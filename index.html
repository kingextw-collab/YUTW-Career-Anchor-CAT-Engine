        const RadarChart = ({ data }) => {
            const size = 400; const center = size / 2; const radius = size * 0.35;
            const maxVal = 10;

            const points = data.map((d, i) => {
                const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                const normalized = Math.max(0, Math.min(d.A / maxVal, 1));
                return {
                    x: center + radius * normalized * Math.cos(angle),
                    y: center + radius * normalized * Math.sin(angle),
                    labelX: center + (radius + 40) * Math.cos(angle),
                    labelY: center + (radius + 40) * Math.sin(angle),
                    subject: d.subject
                };
            });

            const polygonPoints = points.map(p => `${p.x},${p.y}`).join(' ');

            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="w-full h-full max-h-[400px]">
                    {[1, 2, 3, 4].map(level => {
                        const r = radius * (level / 4);
                        const pts = data.map((_, i) => {
                            const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                            return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
                        }).join(' ');
                        return <polygon key={`grid-${level}`} points={pts} fill="none" stroke="#e2e8f0" strokeWidth="1" />;
                    })}
                    {data.map((_, i) => {
                        const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                        return <line key={`axis-${i}`} x1={center} y1={center} x2={center + radius * Math.cos(angle)} y2={center + radius * Math.sin(angle)} stroke="#e2e8f0" strokeWidth="1" />;
                    })}
                    <polygon points={polygonPoints} fill="#4f46e5" fillOpacity="0.2" stroke="#4f46e5" strokeWidth="3" />
                    {points.map((p, i) => <circle key={`dot-${i}`} cx={p.x} cy={p.y} r="4" fill="#4f46e5" />)}
                    {points.map((p, i) => (
                        <text key={`label-${i}`} x={p.labelX} y={p.labelY} fill="#64748b" fontSize="11" fontWeight="700" textAnchor="middle" dominantBaseline="middle">
                            {p.subject}
                        </text>
                    ))}
                </svg>
            );
        };

                { id: "C-LSTF-01", text: "當深度培訓撞期策劃已久的家庭海外旅行時，我會選擇放棄培訓。", catA: "LS", catB: "TF" },
                { id: "C-LSTF-02", text: "若發揮頂尖才華意味著必須 24 小時隨時處理危機，我寧可做個普通的基層人員。", catA: "LS", catB: "TF" },
                { id: "C-LSTF-03", text: "對我而言，利用下班時間研究個人興趣，遠比研讀專業的技術文件更重要。", catA: "LS", catB: "TF" },

                // [矩陣 08] 管理 (GM) vs. 自主 (AU)
                { id: "C-GMAU-01", text: "為了獲得指揮龐大團隊的權力，我可以忍受繁瑣的政治匯報與嚴格的官僚體制。", catA: "GM", catB: "AU" },
                { id: "C-GMAU-02", text: "我願意犧牲決定工作步調的自由，來換取在組織圖上處於頂端的絕對管理權威。", catA: "GM", catB: "AU" },
                { id: "C-GMAU-03", text: "我不介意成為被規則束縛的體制推手，只要最終結果能證明我的管理策略是正確的。", catA: "GM", catB: "AU" },

                // [矩陣 09] 專業 (TF) vs. 自主 (AU)
                { id: "C-TFAU-01", text: "我願意嚴格遵循規範以確保工作成果完全合規，而非為了貪圖個人方便自行改寫捷徑。", catA: "TF", catB: "AU" },
                { id: "C-TFAU-02", text: "面對複雜流程，我會堅持按照官方標準指引執行，而非使用缺乏文件的偏門方法繞過。", catA: "TF", catB: "AU" },
                { id: "C-TFAU-03", text: "我更看重專案是否在專業架構上達到業界最高標準，而非這份工作是否允許我遠距完成。", catA: "TF", catB: "AU" },

                // [矩陣 10] 管理 (GM) vs. 服務 (S)
                { id: "C-GMS-01", text: "當資源排擠時，我能為了集團整體獲利而縮減預算，即便這會大幅增加當地同仁的工作負擔。", catA: "GM", catB: "S" },
                { id: "C-GMS-02", text: "我更傾向擔任掌控預算與成效的專案發起人，而非親自去關心輔導每位同事身心健康。", catA: "GM", catB: "S" },
                { id: "C-GMS-03", text: "我認為專業資歷的最大價值在於具備協調各方利益的戰略手腕，而非成為同事傾訴苦水的導師。", catA: "GM", catB: "S" },

                // [矩陣 11] 創業 (EC) vs. 生活 (LS)
                { id: "C-ECLS-01", text: "若有機會將微型創業擴展為連鎖品牌，我願意為此在未來數年內犧牲所有休閒娛樂的時間。", catA: "EC", catB: "LS" },
                { id: "C-ECLS-02", text: "為了讓我主導的創新專案在市場上打響名號，我不介意在私人旅行中隨時中斷行程處理決策。", catA: "EC", catB: "LS" },
                { id: "C-ECLS-03", text: "下班後投入心力研發可商業化變現的產品，比把時間花在升級個人休閒設備更有吸引力。", catA: "EC", catB: "LS" },

                // [矩陣 12] 穩定 (SS) vs. 挑戰 (PC)
                { id: "C-SSPC-01", text: "我寧可留在有穩定年資保障的傳統企業，也不願空降到極需解決崩潰危機的高壓新創。", catA: "SS", catB: "PC" },
                { id: "C-SSPC-02", text: "面對具備高風險的關鍵任務，我寧願選擇維持現狀並尋求支援，也不願享受那種極限拆彈的快感。", catA: "SS", catB: "PC" },
                { id: "C-SSPC-03", text: "在面對市場大幅波動時，我偏好那些具備抗跌屬性、能安穩產出的專案。", catA: "SS", catB: "PC" },

                // [矩陣 13] 專業 (TF) vs. 挑戰 (PC)
                { id: "C-TFPC-01", text: "處理緊急狀況時，我傾向按部就班執行標準程序，而非享受在最後關頭手動搶救的極限刺激。", catA: "TF", catB: "PC" },
                { id: "C-TFPC-02", text: "我寧願維護一套架構完美且極少出錯的系統，也不願接手一套需要不斷與問題攻防的殘破計畫。", catA: "TF", catB: "PC" },
                { id: "C-TFPC-03", text: "專家的價值在於將危機在發生前弭平，而非成為每次災難發生時享受眾人目光的救火英雄。", catA: "TF", catB: "PC" },

                // [矩陣 14] 生活 (LS) vs. 管理 (GM)
                { id: "C-LSGM-01", text: "為了確保假期絕對不被打擾，我寧願在組織內做一個獨立貢獻者，也不願承接主管職。", catA: "LS", catB: "GM" },
                { id: "C-LSGM-02", text: "若擔任統籌職意味著半年內無法準時下班陪伴家人，我會果斷放棄在高層展露頭角的機會。", catA: "LS", catB: "GM" },
                { id: "C-LSGM-03", text: "即使升遷能掌控更大資源，若會讓我再也無法保有安靜獨處的私人時間，這種升遷就毫無意義。", catA: "LS", catB: "GM" },

                // [矩陣 15] 創業 (EC) vs. 專業 (TF)
                { id: "C-ECTF-01", text: "若我打造出令人驚豔的系統原型，我會立刻思考如何將其募資產權化，而非繼續鑽研底層優化。", catA: "EC", catB: "TF" },
                { id: "C-ECTF-02", text: "掌握最新工具的最大價值，在於利用它們建立新的商業流程來變現，而非成為純粹的技術專家。", catA: "EC", catB: "TF" },
                { id: "C-ECTF-03", text: "我更願意將精力花在跑業務、尋找投資人與建立品牌，並把核心開發外包給他人處理。", catA: "EC", catB: "TF" },

                // [矩陣 16] 自主 (AU) vs. 管理 (GM)
                { id: "C-AUGM-01", text: "我寧可作為一個獨來獨往的專業顧問，也不願成為一個每天行程都被會報塞滿的營運主管。", catA: "AU", catB: "GM" },
                { id: "C-AUGM-02", text: "當專案遇到瓶頸時，比起召集各部門開會，我更習慣把自己關起來獨立把問題解決掉。", catA: "AU", catB: "GM" },
                { id: "C-AUGM-03", text: "如果我能對工作方式擁有 100% 的決定權，即使我完全沒有任何下屬，我也會感到滿意。", catA: "AU", catB: "GM" },

                // [矩陣 17] 服務 (S) vs. 穩定 (SS)
                { id: "C-SSS-01", text: "若出現具備公益價值的專案，即使缺乏明確績效認列，我也願意放棄安穩職務去全心投入。", catA: "S", catB: "SS" },
                { id: "C-SSS-02", text: "為了替團隊爭取更好的福利，我願意得罪高層，甚至甘冒失去這份穩定工作的風險。", catA: "S", catB: "SS" },
                { id: "C-SSS-03", text: "一份能讓我安穩度日、下班準時的差事，如果對社會毫無實質幫助，那也只是缺乏靈魂的合約。", catA: "S", catB: "SS" },

                // [矩陣 18] 挑戰 (PC) vs. 創業 (EC)
                { id: "C-PCEC-01", text: "我更享受憑藉精準判斷力戰勝市場波動的純粹智力挑戰感，而非將資金拿去經營實體門市。", catA: "PC", catB: "EC" },
                { id: "C-PCEC-02", text: "我願意接手瀕臨倒閉的公司將其扭虧為盈，成功挑戰後我可能就會將其賣掉。", catA: "PC", catB: "EC" },
                { id: "C-PCEC-03", text: "核心動力是「打敗對手」與「解決難題」，至於專案是否掛我名字或讓我擁有股權則是次要的。", catA: "PC", catB: "EC" },

                // [矩陣 19] 穩定 (SS) vs. 自主 (AU)
                { id: "C-SSAU-01", text: "為了跳槽到可以讓我自由發揮的遠距團隊，我願意全數放棄在傳統產業累積多年的退休福利。", catA: "SS", catB: "AU" },
                { id: "C-SSAU-02", text: "我更傾向待在薪資結構穩定且能抗壓的公司，而非選擇模式自主但隨時可能斷炊的新創。", catA: "SS", catB: "AU" },
                { id: "C-SSAU-03", text: "若公司強制要求所有員工回到總部辦公室以確保不被裁員，我也會因為失去彈性而選擇辭職。", catA: "SS", catB: "AU" },

                // [矩陣 20] 管理 (GM) vs. 創業 (EC)
                { id: "C-GMEC-01", text: "我更享受調動跨國分公司資源的管理權威感，而不是將這些經驗拿去成立自己的顧問公司。", catA: "GM", catB: "EC" },
                { id: "C-GMEC-02", text: "推動全公司數位化轉型的成就感，遠大於我自己開發一套產品並將其商業化販售。", catA: "GM", catB: "EC" },
                { id: "C-GMEC-03", text: "終極職涯目標是成為大型集團執行長並掌管龐大預算，而非成為由我獨資擁有的微型老闆。", catA: "GM", catB: "EC" },

                // [矩陣 21] 專業 (TF) vs. 服務 (S)
                { id: "C-TFS-01", text: "面對系統需求，我傾向研究如何用最優雅的技術來實現，而非親自去關心協助不熟悉流程的同事。", catA: "TF", catB: "S" },
                { id: "C-TFS-02", text: "面對技術架構錯誤，我堅持徹底修復，即便這會延誤一線客服解決客戶問題的時間。", catA: "TF", catB: "S" },
                { id: "C-TFS-03", text: "如果我的自動化工具減少了加班時間，我的成就感來自「技術解決了難題」，而非「改善了同事生活」。", catA: "TF", catB: "S" },

                // [矩陣 22] 生活 (LS) vs. 穩定 (SS)
                { id: "C-LSSS-01", text: "為了完整的長途旅行假期，我願意選擇底薪較低但保證不加班的工作，而非高薪穩定的隨時待命職位。", catA: "LS", catB: "SS" },
                { id: "C-LSSS-02", text: "我絕不會為了一份穩定高薪與退休保障，去接受一個會嚴重剝奪我陪伴家人時間的外派職位。", catA: "LS", catB: "SS" },
                { id: "C-LSSS-03", text: "能夠在工作之餘保有精力去研究市場投資或經營休閒，比在公司謹慎維持關係以保住飯碗更重要。", catA: "LS", catB: "SS" },

                // [矩陣 23] 自主 (AU) vs. 挑戰 (PC)
                { id: "C-AUPC-01", text: "我寧願選擇自由但缺乏刺激的常規工作，也不願加入一個執行極限任務但必須嚴格服從指揮的高壓團隊。", catA: "AU", catB: "PC" },
                { id: "C-AUPC-02", text: "若解決難題的前提是我必須進辦公室並接受頻繁進度審查，我會立刻失去解決該問題的興趣。", catA: "AU", catB: "PC" },
                { id: "C-AUPC-03", text: "我職場上最渴望的是「沒人能對我的工作方式指手畫腳」，而非不斷尋找更強大的對手。", catA: "AU", catB: "PC" },

                // [矩陣 24] 創業 (EC) vs. 自主 (AU)
                { id: "C-ECAU-01", text: "為了經營的商業模式能成功擴張，我願意每天應付各種繁雜法規與談判，即便這會剝奪我的絕對自由。", catA: "EC", catB: "AU" },
                { id: "C-ECAU-02", text: "我承擔風險創業是為了建立能持續獲利並掛名的商業版圖，而非為了逃避體制換取清閒生活。", catA: "EC", catB: "AU" },
                { id: "C-ECAU-03", text: "比起做個自由自在的外部顧問，我更渴望承擔財務風險去成立公司，即便這會讓我被期望緊緊綁住。", catA: "EC", catB: "AU" },

                // [矩陣 25] 穩定 (SS) vs. 專業 (TF)
                { id: "C-SSTF-01", text: "為了避免營運中斷，我寧可放棄實作最新技術的機會，建議維持穩定現狀。", catA: "SS", catB: "TF" },
                { id: "C-SSTF-02", text: "進行核心移轉時，比起嘗試高效但未經驗證的工具，我更傾向使用緩慢但保證不出錯的標準工具。", catA: "SS", catB: "TF" },
                { id: "C-SSTF-03", text: "工作的最高價值在於「提供組織絕對的安全感」，而非作為讓我實驗前衛技術的遊樂場。", catA: "SS", catB: "TF" },

                // [矩陣 26] 服務 (S) vs. 自主 (AU)
                { id: "C-SAU-01", text: "如果一個公益專案需要我每天進駐現場並嚴格配合團隊作息，我會欣然接受並放棄高度自由的工作。", catA: "S", catB: "AU" },
                { id: "C-SAU-02", text: "我願意為了幫助陷入嚴重心理或專業瓶頸的同事，而暫時放棄我對「工作不受干擾」的堅持。", catA: "S", catB: "AU" },
                { id: "C-SAU-03", text: "當發現政策損害員工權益時，我會主動發起抗議，即便這會讓我失去「讓我自由做事」的特權。", catA: "S", catB: "AU" },

                // [矩陣 27] 挑戰 (PC) vs. 管理 (GM)
                { id: "C-PCGM-01", text: "我更享受憑藉一己之力在壓力下搶救危機的刺激感，而非坐在會議室裡指揮資源調度與戰略。", catA: "PC", catB: "GM" },
                { id: "C-PCGM-02", text: "當組織面臨危機時，我渴望成為站在第一線進行攻防戰的部隊，而非幕後協調整體運作的指揮官。", catA: "PC", catB: "GM" },
                { id: "C-PCGM-03", text: "我寧願接手一個爛攤子來證明我逆轉勝的能力，也不願平穩接班一個資源充沛的大型事業職位。", catA: "PC", catB: "GM" },

                // [矩陣 28] 生活 (LS) vs. 創業 (EC)
                { id: "C-LSEC-01", text: "如果擴大副業規模意味著未來數年無法安排長途旅遊或享受愛好，我會果斷放棄擴張，維持目前狀態。", catA: "LS", catB: "EC" },
                { id: "C-LSEC-02", text: "我絕不會為了將研發的產品推向市場，而將原先用來陪伴家人與維持品質的存款全數投入。", catA: "LS", catB: "EC" },
                { id: "C-LSEC-03", text: "一份能穩定產出現金流、絕對不佔用下班時間的投資組合，比可能成為獨角獸的新創公司更具吸引力。", catA: "LS", catB: "EC" },

                // [矩陣 29] 穩定 (SS) vs. 管理 (GM)
                { id: "C-SSGM-01", text: "我寧願留在目前的職位上領取穩定的固定薪酬，也不願接受一個高薪但隨時可能被撤換的主管職。", catA: "SS", catB: "GM" },
                { id: "C-SSGM-02", text: "面對組織改組，我傾向選擇受體制保障的職位，而非一個權力極大但卻處於鬥爭風口浪尖的職位。", catA: "SS", catB: "GM" },
                { id: "C-SSGM-03", text: "對我來說，長期且可預測的職業安全感，遠比獲得掌控整家公司資源的成就感更重要。", catA: "SS", catB: "GM" },

                // [矩陣 30] 挑戰 (PC) vs. 專業 (TF)
                { id: "C-PCTF-01", text: "當工作內容變得過於駕輕就熟時，即使它能讓我成為頂尖權威，我仍會感到無聊並主動尋找下一個未知的困難。", catA: "PC", catB: "TF" },
                { id: "C-PCTF-02", text: "我渴望在競爭中不斷突破紀錄，即便這意味著我必須放下鑽研多年的專長，轉向完全陌生的領域。", catA: "PC", catB: "TF" },
                { id: "C-PCTF-03", text: "比起「做正確的事 (專業)」，我更享受「贏得困難的戰役 (挑戰)」所帶來的刺激感。", catA: "PC", catB: "TF" },

                // [矩陣 31] 創業 (EC) vs. 服務 (S)
                { id: "C-ECS-01", text: "若一個創新的商業計畫能獲得極大獲利，即便它對社會的正面貢獻不明顯，我仍會傾向推動它。", catA: "EC", catB: "S" },
                { id: "C-ECS-02", text: "我傾向將資源投入在能快速規模化、增加估值的專案，而非耗費大量心力在解決小眾族群的特殊困境。", catA: "EC", catB: "S" },
                { id: "C-ECS-03", text: "與其在非營利組織擔任推手，我更想建立一個擁有強大競爭力與獲利能力的商業帝國。", catA: "EC", catB: "S" },

                // [矩陣 32] 專業 (TF) vs. 穩定 (SS)
                { id: "C-TFSS-01", text: "為了掌握最新的前沿專業技術，我願意離開福利優渥的老牌企業，轉職到一家前景不明但技術領先的公司。", catA: "TF", catB: "SS" },
                { id: "C-TFSS-02", text: "如果掌握專業深度需要我承擔較高的風險，我也會優先選擇精進技術。", catA: "TF", catB: "SS" },
                { id: "C-TFSS-03", text: "我不能接受在一份雖然極度穩定但卻讓我專業技能原地踏步的工作中待超過兩年。", catA: "TF", catB: "SS" },

                // [矩陣 33] 自主 (AU) vs. 服務 (S)
                { id: "C-AUS-01", text: "我更看重是否能完全掌控自己的工作計畫，即便這意味著我必須減少對團隊或社會公益專案的投入。", catA: "AU", catB: "S" },
                { id: "C-AUS-02", text: "即使一個服務性質的工作非常有意義，但若它要求我必須頻繁與他人協作且喪失獨立性，我就會婉拒。", catA: "AU", catB: "S" },
                { id: "C-AUS-03", text: "對我來說，職場成功的定義是「擁有不被任何人打擾的自由」，而非「被眾多人需要」。", catA: "AU", catB: "S" },

                // [矩陣 34] 服務 (S) vs. 管理 (GM)
                { id: "C-SGM-01", text: "在面臨人力縮減時，我會優先考量員工的生計，而非僅從管理的數字成本與營運效率出發。", catA: "S", catB: "GM" },

                { id: "C-SSLS-02", text: "我願意把原本用來投資私人興趣的預算，全數轉為保守積蓄以確保晚年生活。", catA: "SS", catB: "LS" },
                { id: "C-SSLS-03", text: "即使這份工作要求我放棄長期經營的社交圈，只要能提供絕對保障，我仍會考慮。", catA: "SS", catB: "LS" },

                // [矩陣 53] 專業 (TF) vs. 管理 (GM)

                { id: "C-TFGM2-02", text: "看到部屬解決問題的方式不對，我會想親自動手，而非只是下達指導原則。", catA: "TF", catB: "GM" },
                { id: "C-TFGM2-03", text: "對我來說，專業評價與認證，比在公司的職稱高低更具實質意義。", catA: "TF", catB: "GM" },

                // [矩陣 54] 自主 (AU) vs. 生活 (LS)
                { id: "C-AULS-01", text: "我願意接受一份收入較低但不用進辦公室的工作，因為這讓我可以靈活處理瑣事。", catA: "AU", catB: "LS" },
                { id: "C-AULS-02", text: "自由安排工作節奏對我來說是生活的核心，而非只是工作的加分項。", catA: "AU", catB: "LS" },
                { id: "C-AULS-03", text: "只要能在我想工作的時候工作，我不介意辦公室的環境是否舒適。", catA: "AU", catB: "LS" },

                // [矩陣 55] 挑戰 (PC) vs. 服務 (S)
                { id: "C-PCS-01", text: "面對實力懸殊的對戰時，我內心渴望贏過對方，即便這在商業上顯得不夠寬厚。", catA: "PC", catB: "S" },
                { id: "C-PCS-02", text: "我追求的是解決「前人未解之謎」的爽快感，這比慈悲心更能激發我的潛能。", catA: "PC", catB: "S" },
                { id: "C-PCS-03", text: "在壓力環境下，我更看重團隊是否能存活並取勝，而非每個人都感到被溫柔對待。", catA: "PC", catB: "S" },

                // [矩陣 56] 管理 (GM) vs. 專業 (TF)
                { id: "C-GMTF2-01", text: "作為管理者，我更在乎如何找到合適的人才來完成任務，而非我自己要成為專家。", catA: "GM", catB: "TF" },
                { id: "C-GMTF2-02", text: "我能接受在不懂技術細節的情況下做出決策，只要我信任管理與回報機制。", catA: "GM", catB: "TF" },
                { id: "C-GMTF2-03", text: "職涯的最終目標是建立一套能自動運轉的系統，而非讓自己成為不可替代的核心。", catA: "GM", catB: "TF" }
            ]
        };

        function App() {
            const [step, setStep] = useState("welcome");
            const [qIndex, setQIndex] = useState(1);
            const [theta, setTheta] = useState({ TF: 0, GM: 0, AU: 0, SS: 0, EC: 0, S: 0, PC: 0, LS: 0 });
            
            const [tIo, setTIo] = useState(0);
            const [muT, setMuT] = useState(0);
            const [sigmaT, setSigmaT] = useState(0.1);
            const [history, setHistory] = useState([]);
            const [entangledPairs, setEntangledPairs] = useState([]);
            const [currentQ, setCurrentQ] = useState(null);
            
            const startTimeRef = useRef(0);
            const p2OrderRef = useRef(["TF", "GM", "AU", "SS", "EC", "S", "PC", "LS"].sort(() => Math.random() - 0.5));
            const usedMatricesRef = useRef(new Set());

            useEffect(() => {
                if (step === "testing") {
                    let nextQ;
                    if (qIndex === 1) {
                        nextQ = QB.phase1.Q01; 
                    } else if (qIndex === 2) {
                        // Phase 1: Q02 隨機抽取 A~F (防呆校準)
                        nextQ = QB.phase1.Q02[Math.floor(Math.random() * 6)];
                    } else if (qIndex <= 10) {
                        const cat = p2OrderRef.current[qIndex - 3]; 
                        nextQ = QB.phase2[cat][Math.floor(Math.random() * 8)];
                        nextQ.type = "normal";
                        nextQ.cat = cat;
                    } else {
                        const sorted = Object.entries(theta).sort((a, b) => b[1] - a[1]);
                        const t1 = sorted[0][0]; const t2 = sorted[1][0];
                        
                        if (entangledPairs.length > 0) {
                            // 觸發糾纏狀態：針對糾纏的兩個維度進行深度拆解
                            const e1 = entangledPairs[0];
                            const e2 = entangledPairs[1];
                            
                            // 優先尋找這兩個糾纏維度的「衝突矩陣題」
                            nextQ = QB.matrices.find(m => 
                                ((m.catA === e1 && m.catB === e2) || (m.catA === e2 && m.catB === e1)) && !usedMatricesRef.current.has(m.id)
                            );
                            
                            if (nextQ) {
                                usedMatricesRef.current.add(nextQ.id);
                                nextQ.type = "matrix";
                            } else {
                                // 若矩陣題耗盡的防呆降級：在兩個糾纏維度中隨機選一個出常規題
                                const targetCat = Math.random() > 0.5 ? e1 : e2;
                                nextQ = QB.phase2[targetCat][Math.floor(Math.random() * 8)];
                                nextQ.type = "normal";
                                nextQ.cat = targetCat;
                            }
                        } else {
                            // 正常狀態：針對 Top 1 與 Top 2 尋找矩陣題
                            nextQ = QB.matrices.find(m => 
                                ((m.catA === t1 && m.catB === t2) || (m.catA === t2 && m.catB === t1)) && !usedMatricesRef.current.has(m.id)
                            );
                            if (nextQ) {
                                usedMatricesRef.current.add(nextQ.id);
                                nextQ.type = "matrix";
                            } else {
                                nextQ = QB.phase2[t1][Math.floor(Math.random() * 8)];
                                nextQ.type = "normal";
                                nextQ.cat = t1;
                            }
                        }
                    }
                    setCurrentQ(nextQ);
                    startTimeRef.current = Date.now();
                }
            }, [qIndex, step, theta, entangledPairs]);

            const handleAnswer = (score) => {
                const timeCost = (Date.now() - startTimeRef.current) / 1000;
                let nextTheta = { ...theta };
                let currentTe = timeCost;

                if (qIndex <= 2) {
                    if (qIndex === 2) {
                        const prevTimeCost = history.length > 0 ? history[0].timeCost : timeCost;
                        setTIo((prevTimeCost + timeCost) / 2);
                    }
                } else {
                    currentTe = Math.max(0.1, timeCost - tIo); 
                    
                    if (qIndex <= 10) {
                        const sNorm = (score - 3.5) / 2.5;
                        nextTheta[currentQ.cat] += (1.0 * sNorm * 1.0);
                        
                        if (qIndex === 10) {
                            const p2Te = [...history.filter(h => h.id > 2).map(h => h.Te), currentTe];
                            const mean = p2Te.reduce((a, b) => a + b, 0) / 8;
                            const std = Math.sqrt(p2Te.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / 8) || 0.1;
                            setMuT(mean); setSigmaT(std);
                        }
                    } else {
                        const Z = (currentTe - muT) / sigmaT;
                        let W_rt = 1.0;
                        if (Z < -0.5) W_rt = Math.min(1.5, 1 + 0.2 * Math.abs(Z));
                        else if (Z > 0.5) W_rt = Math.max(0.2, 1 - 0.3 * Z);
                        
                        const sNorm = (score - 3.5) / 2.5;
                        
                        if (currentQ.type === "matrix") {
                            if ((score === 3 || score === 4) && Z > 1.0) {
                                if (!entangledPairs.includes(currentQ.catA)) setEntangledPairs(prev => [...prev, currentQ.catA, currentQ.catB]);
                            } else {
                                nextTheta[currentQ.catA] += (1.5 * sNorm * W_rt);
                                nextTheta[currentQ.catB] -= (1.5 * sNorm * W_rt);
                            }
                        } else {
                            nextTheta[currentQ.cat] += (1.0 * sNorm * W_rt);
                        }
                    }
                }

                setHistory([...history, { id: qIndex, qId: currentQ.id, timeCost: timeCost, Te: currentTe, score }]);
                setTheta(nextTheta);

                const sorted = Object.entries(nextTheta).sort((a, b) => b[1] - a[1]);
                let shouldEnd = false;
                
                if (qIndex >= 16 && qIndex < 24) {
                    if (entangledPairs.length === 0) {
                        const gap1 = sorted[0][1] - sorted[1][1];
                        const gap2 = sorted[1][1] - sorted[2][1];
                        const gap3 = sorted[2][1] - sorted[3][1];
                        if (gap1 >= 1.2 && gap2 >= 1.0 && gap3 >= 1.0) shouldEnd = true;
                        
                        if (gap3 < 0.8 && entangledPairs.length === 0) {
                            setEntangledPairs([sorted[2][0], sorted[3][0]]);
                        }
                    }
                }

                if (shouldEnd || qIndex >= 24) {
                    setStep("results");
                } else {
                    setQIndex(qIndex + 1);
                }
            };

            const restart = () => {
                setStep("welcome"); setQIndex(1); setHistory([]); setEntangledPairs([]);
                setTheta({ TF: 0, GM: 0, AU: 0, SS: 0, EC: 0, S: 0, PC: 0, LS: 0 });
                usedMatricesRef.current.clear();
            };

            if (!currentQ && step === "testing") return <div className="p-10 text-center">載入引擎中 Loading Engine...</div>;

            const sortedResults = Object.entries(theta).sort((a, b) => b[1] - a[1]);
            const radarData = Object.entries(theta).map(([k, v]) => ({ subject: ANCHORS[k].name, A: v + 5 }));

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <header className="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 w-8 h-8 rounded flex items-center justify-center text-white font-bold">A</div>
                            <div>
                                <h1 className="font-bold text-slate-800">Career Anchor CAT Engine</h1>
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">v3.2 Build</p>
                            </div>
                        </div>
                        <div className="text-right text-[10px] font-mono text-slate-400">
                            {qIndex > 10 ? `μ: ${muT.toFixed(2)}s | σ: ${sigmaT.toFixed(2)}s` : 'CALIBRATING'}
                        </div>
                    </header>

                    <main className="flex-1 overflow-auto p-6">
                        {step === "welcome" && (
                            <div className="max-w-4xl mx-auto py-20 flex flex-col items-center text-center animate-in fade-in">
                                <h2 className="text-4xl font-black text-slate-900 mb-6">職涯錨定適性診斷 v3.2</h2>
                                <p className="text-slate-500 max-w-xl mb-12">
                                    此系統完整實裝 Z-score 與四階段適性矩陣邏輯。請依據直覺作答，系統將捕捉您的隱性價值拉扯。
                                </p>
                                <button onClick={() => setStep("testing")} className="bg-slate-900 px-10 py-4 rounded-xl text-white font-bold text-lg hover:scale-105 transition-all">
                                    啟動測驗 START ENGINE
                                </button>
                            </div>
                        )}

                        {step === "testing" && currentQ && (
                            <div className="max-w-5xl mx-auto flex flex-col md:flex-row gap-6 animate-in slide-in-from-bottom-4">
                                <div className="flex-[2] bg-white rounded-2xl p-8 border shadow-sm">
                                    <div className="flex justify-between mb-8">
                                        <span className="bg-slate-100 px-2 py-1 rounded text-xs font-mono font-bold text-slate-500">QID: {currentQ.id}</span>
                                        <span className="text-xs font-bold text-slate-400">Prog: {qIndex}/24</span>
                                    </div>
                                    <h2 className="text-2xl font-bold text-slate-800 mb-12 min-h-[80px]">{currentQ.text}</h2>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4">
                                        {[1, 2, 3, 4, 5, 6].map(s => (
                                            <button key={s} onClick={() => handleAnswer(s)} className="h-24 border-2 rounded-xl hover:border-indigo-600 hover:bg-indigo-50 font-black text-xl text-slate-400 hover:text-indigo-600 transition-all">
                                                {s} <div className="text-[10px] uppercase font-bold">{s <= 3 ? "不符合" : "符合"}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex-1 space-y-6">
                                    <div className={`rounded-2xl p-6 text-white transition-all ${entangledPairs.length > 0 ? 'bg-rose-900' : 'bg-slate-900'}`}>
                                        <h3 className="text-[10px] font-black uppercase tracking-widest mb-4 flex items-center gap-2">
                                            <span className={`w-2 h-2 rounded-full animate-pulse ${entangledPairs.length > 0 ? 'bg-rose-500' : 'bg-indigo-500'}`}></span>
                                            {entangledPairs.length > 0 ? 'ENTANGLEMENT DETECTED' : 'REAL-TIME THETA'}
                                        </h3>
                                        <div className="space-y-3">
                                            {sortedResults.slice(0, 4).map(([k, v]) => (
                                                <div key={k}>
                                                    <div className="flex justify-between text-xs font-bold mb-1">
                                                        <span className="text-slate-300">{ANCHORS[k].name}</span>
                                                        <span className="font-mono text-indigo-300">{v.toFixed(2)}</span>
                                                    </div>
                                                    <div className="h-1 bg-slate-800 rounded-full overflow-hidden">
                                                        <div className="bg-indigo-500 h-full" style={{width: `${Math.max(0, (v + 5) * 10)}%`}}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === "results" && (
                            <div className="max-w-4xl mx-auto bg-white p-10 rounded-3xl shadow-sm border text-center animate-in zoom-in-95 duration-500">
                                <h2 className="text-3xl font-black mb-8">職涯錨定鑑定報告</h2>
                                
                                <div className="w-full flex justify-center mb-10">
                                    <RadarChart data={radarData} />
                                </div>

								{/* 顯示核心錨定 (動態 Top 3 或 Top 4) */}
								<div className="bg-slate-50 p-6 rounded-2xl text-left space-y-6 mb-6">
									<h3 className="text-sm font-black text-slate-400 uppercase tracking-widest border-b pb-2">核心職涯錨定 (Primary Anchors)</h3>
									{(() => {
									// 判斷要顯示幾個核心錨點
									let displayCount = 3;
									// 如果第三名和第四名的分數完全相同 (使用 toFixed(2) 確保浮點數比對的精準度)
									if (sortedResults.length > 3 && 
										sortedResults[2][1].toFixed(2) === sortedResults[3][1].toFixed(2)) {
										displayCount = 4;
									}

									return sortedResults.slice(0, displayCount).map(([k, v], index) => (
										<div key={k}>
											<div className="flex items-center gap-2 mb-1">
												<span className="bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-0.5 rounded">
													Top {index + 1}
												</span>
												<h4 className="text-xl font-bold text-indigo-600">{ANCHORS[k].name}</h4>
											</div>
											<p className="text-slate-600 text-sm">{ANCHORS[k].desc}</p>
										</div>
										));
									})()}
								</div>

                                {/* 顯示八大維度完整得分 */}
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 text-left space-y-4">
                                    <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest border-b pb-2">八大維度完整得分 (Theta Score)</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {sortedResults.map(([k, v]) => (
                                            <div key={k} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                <span className="font-bold text-slate-700">{ANCHORS[k].name} ({k})</span>
                                                <span className="font-mono font-bold text-indigo-600">{v.toFixed(2)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button onClick={restart} className="mt-8 px-8 py-3 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition-all hover:scale-105">
                                    RESTART DIAGNOSTIC
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
