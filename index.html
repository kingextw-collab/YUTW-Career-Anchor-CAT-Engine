        const RadarChart = ({ data, maxScore }) => {
            const size = 400; const center = size / 2; const radius = size * 0.35;
            const dynamicMax = Math.max(10, maxScore * 1.1); 
            
            const points = data.map((d, i) => {
                const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                const normalized = Math.max(0, Math.min((d.A + 5) / dynamicMax, 1));
                return {
                    x: center + radius * normalized * Math.cos(angle),
                    y: center + radius * normalized * Math.sin(angle),
                    labelX: center + (radius + 40) * Math.cos(angle),
                    labelY: center + (radius + 40) * Math.sin(angle),
                    subject: d.subject
                };
            });
            const polygonPoints = points.map(p => `${p.x},${p.y}`).join(' ');
            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="w-full h-full max-h-[400px]">
                    {[1, 2, 3, 4].map(level => {
                        const r = radius * (level / 4);
                        const pts = data.map((_, i) => {
                            const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                            return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
                        }).join(' ');
                        return <polygon key={`grid-${level}`} points={pts} fill="none" stroke="#e2e8f0" strokeWidth="1" />;
                    })}
                    {data.map((_, i) => {
                        const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                        return <line key={`axis-${i}`} x1={center} y1={center} x2={center + radius * Math.cos(angle)} y2={center + radius * Math.sin(angle)} stroke="#e2e8f0" strokeWidth="1" />;
                    })}
                    <polygon points={polygonPoints} fill="#4f46e5" fillOpacity="0.2" stroke="#4f46e5" strokeWidth="3" />
                    {points.map((p, i) => <circle key={`dot-${i}`} cx={p.x} cy={p.y} r="4" fill="#4f46e5" />)}
                    {points.map((p, i) => (
                        <text key={`label-${i}`} x={p.labelX} y={p.labelY} fill="#64748b" fontSize="11" fontWeight="700" textAnchor="middle" dominantBaseline="middle">
                            {p.subject}
                        </text>
                    ))}
                </svg>
            );
        };

				{ id: "EC-01", text: "比起維護或優化現有的成熟產品與流程，我對於推動從無到有的全新專案、開發創新服務或建立破壞性商業模式抱持著更高的熱情。" },
				{ id: "EC-02", text: "若有機會主導一個極可能在市場上建立全新品牌或版圖的創新計畫，我完全願意為此承擔較高的個人職涯風險或初期的財務不確定性。" },
				{ id: "EC-03", text: "當我觀察到市場上尚未被滿足的潛在需求時，我會不自覺地開始構思各種解決方案，並積極思考如何將其轉化為具備可行性的商業模式。" },
				{ id: "EC-04", text: "在既有的大型企業體系中擔任高階主管，對我的吸引力遠不如能夠自己親手創立、主導並擁有一個具備高度成長潛力的全新事業體。" },
				{ id: "EC-05", text: "我認為個人職業價值的最大化，應該透過持續創造新的智慧財產、獲得新事業的股權分配，或主導能夠產生規模化收益的新專案來實現。" },
				{ id: "EC-06", text: "我經常主動向決策層或投資人提出新構想，積極爭取必要的資源與授權，以期能開拓一個不受既有規章與傳統框架限制的全新業務領域。" },
				{ id: "EC-07", text: "只要能讓我的創新點子與商業構想真正落地執行，我具備極高的韌性去克服並忍受項目啟動初期的組織混亂狀態與資源匱乏的挑戰。" },
				{ id: "EC-08", text: "我習慣將每一次的職務轉換或專案經驗，視為累積關鍵人脈與產業知識的過程，最終的終極目標是為了實現我個人籌劃已久的開創性計畫。" },
				{ id: "EC-09", text: "無論身處何種職位，我隨時都在評估目前所累積的實務經驗與資源，思考著未來如何將這些積累轉化為我獨立開展新事業時的核心競爭力。" },
				{ id: "EC-10", text: "當看到其他成功的商業模式或創新產品時，我的直覺反應是立即拆解其運作邏輯，並思考我如何能夠做得更好或開發出具備強烈差異化的競品。" },
				{ id: "EC-11", text: "我極度享受那種將一個抽象的概念或點子，透過縝密的規劃與執行，逐步轉化為具體的實體產出，並最終成功推向市場獲取回報的完整過程。" },
				{ id: "EC-12", text: "與其在傳統體制內等待年度的固定調薪或按部就班的升遷，我更渴望透過主導新事業的高速成長，來獲取與自身貢獻相符的爆發性長期回報。" }
			],
			"S": [
				{ id: "S-01", text: "在執行業務與追求組織利潤的同時，我同等重視我們所推動的專案是否能對社會大眾、終端客戶或內部同事帶來實質且正向的深遠影響。" },
				{ id: "S-02", text: "當純粹的商業利益目標與我個人堅守的利他價值觀發生衝突時，我會積極主動地去尋找並提案那些能夠兼顧雙方訴求的平衡替代方案。" },
				{ id: "S-03", text: "能夠在組織內建立一套改善同事工作環境、提升整體福祉的機制，或推動友善職場的計畫，所帶來的滿足感往往大於單純達成個人的業績指標。" },
				{ id: "S-04", text: "在選擇職務發展方向時，我強烈傾向那些能夠直接服務受助群體、解決真實痛點，並能親眼見證自身的工作成果確實改善他人處境的角色。" },
				{ id: "S-05", text: "在團隊合作與跨部門協同的過程中，我經常自發性地擔任傾聽者與協調者的角色，致力於確保每一個參與成員的意見與感受都能被充分重視。" },
				{ id: "S-06", text: "當身邊的同仁在工作上遇到難以突破的瓶頸時，我非常願意暫時放下手邊的進度去提供指導與實質支援，即便這項付出並不會被計入個人績效。" },
				{ id: "S-07", text: "企業本身所秉持的核心價值觀，以及其在社會責任層面的具體實踐程度，是我判斷是否願意為該組織長期效力與奉獻心力的最核心基準。" },
				{ id: "S-08", text: "評估一份工作的綜合價值時，若該職務的內容無法對社會產生任何正面的助益或改善他人的生活，即使薪資條件再優渥，我也會感到缺乏動力。" },
				{ id: "S-09", text: "我在衡量一項專案或產品的成功與否時，會優先檢視它是否真正解決了某個存在已久的社會問題，或是滿足了人類提升生活品質的真實需求。" },
				{ id: "S-10", text: "在挑選合作夥伴或評估商業機會時，我傾向選擇與我具備一致價值觀的對象協作。我願意為了堅守核心信念，而放棄某些理念不合的專案。" },
				{ id: "S-11", text: "當團隊成員遭遇工作或生活上的低谷時，我認為提供適時的情感支持與實質幫助，是維持團隊凝聚力，且比單純追趕專案進度更為重要的職業素養。" },
				{ id: "S-12", text: "能夠在日常的工作任務中，具體且深刻地感受到自己的付出正在幫助他人、並讓別人的生活品質獲得提升，是我每天投入工作的最核心驅動力。" }
			],
			"PC": [
				{ id: "PC-01", text: "當手邊的任務變得過於熟悉或容易預測時，我會感到缺乏動力，並主動去尋找那些被其他人視為極度困難或不可能完成的高難度挑戰來突破自我。" },
				{ id: "PC-02", text: "身處於高度競爭的環境中，或是面對他人認為難以跨越的實務與市場障礙，往往能最大程度激發我的潛能，成為我全心投入工作的核心動力來源。" },
				{ id: "PC-03", text: "對我而言，整個職涯就像是一連串不斷升級的關卡。如果目前的工作環境已經無法再提供具備足夠強度的挑戰性目標，我就會開始考慮轉換跑道。" },
				{ id: "PC-04", text: "在面臨資源極度匱乏、限制繁多或是時限壓力極大的嚴苛情況下，我反而能夠保持高度的冷靜，並展現出比平時更為敏銳的決策能力與強悍的執行力。" },
				{ id: "PC-05", text: "在專業領域或市場競爭中，能夠憑藉實力戰勝強勁對手或是打破過往難以超越的紀錄，這種巨大的成就感是任何實質的薪酬獎勵都無法取代的。" },
				{ id: "PC-06", text: "我對於接手那些瀕臨失敗邊緣、或是看似毫無希望的專案抱持著高度熱忱。我極度享受那種憑藉一己之力將局勢從絕境中徹底翻轉過來的成功快感。" },
				{ id: "PC-07", text: "無論是在專業深度的角逐，還是在廣大市場份額的競爭中，我都渴望透過更精準的策略佈局與卓越的執行力，在各個層面上徹底超越並擊敗競爭對手。" },
				{ id: "PC-08", text: "長期從事單調、重複性高且缺乏變化的常規工作會迅速消耗我的職業熱情。我需要持續保持一定程度的緊迫感與高難度目標，才能維持對工作的專注力。" },
				{ id: "PC-09", text: "當發現競爭對手採取了更為激進的市場策略或推出了突破性的服務時，我並不會感到畏懼，反而會因此感到亢奮，並激發出更強烈的求勝欲望與反擊企圖。" },
				{ id: "PC-10", text: "我特別喜歡接手那些被前人視為無解的系統性疑難雜症。透過導入創新的思維框架或是採取非傳統的解決手段將其成功攻破，是我展現核心價值的方式。" },
				{ id: "PC-11", text: "如果被交付的一個目標被評估為太容易達成，我會覺得這是在浪費我寶貴的時間與才能。缺乏難度的任務會讓我迅速失去對該項目的專注度與執行熱忱。" },
				{ id: "PC-12", text: "面對高度不確定且變數極多的商業環境，我傾向採取積極主動的攻勢。我非常享受在這種充滿未知的局勢中，精準尋找破口並獲取勝利的刺激感。" }
			],
			"LS": [
				{ id: "LS-01", text: "在經營職涯的同時，我會設立非常明確的界線，以確保日常的工作要求與壓力，絕對不會長期侵犯到我與家人相處的高品質時光，或是壓縮私人生活空間。" },
				{ id: "LS-02", text: "若一個晉升機會意味著未來必須長期犧牲規律的作息、大幅增加常態性的加班時間，或是嚴重破壞現有的生活節奏，我會傾向婉拒該機會以維持生活品質。" },
				{ id: "LS-03", text: "我將工作視為支持並豐富多元人生的重要手段之一。我期望工作模式能夠具備足夠的彈性，以便與個人的休閒娛樂、家庭責任以及自我成長活動達成完美整合。" },
				{ id: "LS-04", text: "在選擇任職的企業時，我會將該公司是否提供彈性工時、完善的休假制度，以及整體企業文化對員工家庭生活友善的程度，列為最優先考量的核心決策指標。" },
				{ id: "LS-05", text: "如果長期的工作壓力已經開始導致我無法保有足夠精力去享受高品質的個人愛好，或是影響到身心健康，我會毫不猶豫地主動重新評估並調整目前的職涯步調。" },
				{ id: "LS-06", text: "對我而言，能夠在下班後擁有充裕且可自由支配的時間來發展個人興趣或陪伴親友，其重要性與吸引力，遠遠大於在職場階級中不斷向上晉升或追求更高的職位。" },
				{ id: "LS-07", text: "我極度重視休假期間的完整性。我會盡最大的努力，確保工作上的常規聯繫或非緊急的突發事件，不會在我的私人休假期間打斷我與親友的相處或個人的休息時光。" },
				{ id: "LS-08", text: "我對於個人成功職涯的最高定義，在於能夠長期維持生活與工作的完美平衡狀態。相較於無止境地追求單一的職場成就或財富累積，我更看重整體人生的圓滿。" },
				{ id: "LS-09", text: "若一個高薪或高階的職位要求我必須長期接受海外外派，或是需要極度頻繁地出差，我會因為這些要求對既有生活品質與家庭關係所造成的破壞，而選擇拒絕該職缺。" },
				{ id: "LS-10", text: "在安排每週的行事曆時，我習慣優先排定並保留與家庭成員的聚會時間以及重要的私人休閒活動，隨後才會將工作相關的時程與會議填入剩餘的可用時間區塊中。" },
				{ id: "LS-11", text: "我對卓越職涯的期許是：在工作時間內展現出高度專業與稱職表現，同時在下班後依然擁有充足的體力與愉悅的心情，去盡情享受豐富多樣的業餘生活與個人探索。" },
				{ id: "LS-12", text: "我高度認同並期望企業應該要全面性地支援員工的心理健康與福祉。這包含了尊重每位員工在非辦公時間的斷網權，以及不鼓勵在週末進行非必要的工作聯繫。" }
			]
        },
        matrices: [
				// [矩陣 01] 專業 (TF) vs. 管理 (GM) -> 同意代表保衛 TF，放棄 GM
				{ id: "C-TFGM-01", text: "即使一份管理職缺能帶來極高的權限與統籌資源，若它會使我從此脫離第一線的實務執行與領域知識鑽研，我也會選擇放棄該晉升機會。", catA: "TF", catB: "GM" },
				{ id: "C-TFGM-02", text: "面對核心業務模式變更，我寧願親自驗證每個執行環節的專業正確性，也不願將其完全授權給他人，只專注於向高層進行商業績效報告。", catA: "TF", catB: "GM" },
				{ id: "C-TFGM-03", text: "只要能讓我維持在該實務領域的專家領先地位，即使我的職位名稱缺乏層級上的威望，我也毫不在意是否能進入管理決策圈。", catA: "TF", catB: "GM" },
				{ id: "C-TFGM-04", text: "我寧願擔任掌握核心業務與技術權威的實務專家，也不願晉升為帶領百人團隊，但日常工作卻只剩下預算分配與跨部門協調的主管。", catA: "TF", catB: "GM" },

				// [矩陣 02] 自主 (AU) vs. 穩定 (SS) -> 同意代表保衛 AU，放棄 SS
				{ id: "C-AUSS-01", text: "為了一份能夠讓我完全自由決定作業節奏與工作地點的專案，我願意放棄傳統企業所提供的長期留任保障、完善福利與固定的升遷路徑。", catA: "AU", catB: "SS" },
				{ id: "C-AUSS-02", text: "當公司為了便於管理而導入嚴格的行為監控與固定打卡制度時，即便這份職位能提供絕對安穩的退休金，我也會因為失去彈性而選擇離開。", catA: "AU", catB: "SS" },
				{ id: "C-AUSS-03", text: "我寧可承擔專案結案後的短期失業與收入空窗風險，也要換取在執行過程中完全不受公司行政體制與僵化規範干預的絕對自由。", catA: "AU", catB: "SS" },
				{ id: "C-AUSS-04", text: "只要能確保我的工作模式與時程完全由我自己做主，我願意接受底薪較低、缺乏組織庇護且隨時可能因成效不佳而終止的合約條件。", catA: "AU", catB: "SS" },

				// [矩陣 03] 挑戰 (PC) vs. 生活 (LS) -> 同意代表保衛 PC，放棄 LS
				{ id: "C-PCLS-01", text: "面對一個能大幅突破業界現有天花板、極具指標意義的高難度挑戰，我願意在專案期間大幅壓縮個人的休閒時間，甚至延後安排好的長途旅行。", catA: "PC", catB: "LS" },
				{ id: "C-PCLS-02", text: "當接手一項資源匱乏且競爭極度激烈的極限任務時，為了戰勝強敵所帶來的刺激感，我完全不在乎必須犧牲週末與親友相處的高品質時光。", catA: "PC", catB: "LS" },
				{ id: "C-PCLS-03", text: "即使家中已有預先安排好的重要休閒活動，只要工作上突然出現極難攻克、能展現我反轉實力的危機，我會毫不猶豫地取消私人行程投入戰局。", catA: "PC", catB: "LS" },
				{ id: "C-PCLS-04", text: "為了解決極具難度的專業瓶頸並擊敗市場對手，我願意在一段漫長的時間內，將生活重心徹底傾斜至工作，暫時放棄對工作與生活平衡的追求。", catA: "PC", catB: "LS" },

				// [矩陣 04] 創業 (EC) vs. 穩定 (SS) -> 同意代表保衛 EC，放棄 SS
				{ id: "C-ECSS-01", text: "若發現一個極具潛力且由我主導的新商業模式，我寧可放棄目前在成熟組織中累積多年的年資與退休金保障，也要冒險將其投入市場驗證。", catA: "EC", catB: "SS" },
				{ id: "C-ECSS-02", text: "為了換取新創事業中佔比較高、具備爆發性成長可能的分配權，我願意果斷辭去大型組織中領取固定高薪且營運穩健的主管職缺。", catA: "EC", catB: "SS" },
				{ id: "C-ECSS-03", text: "我願意將個人辛苦累積的積蓄投入一個可能失敗但充滿擴張潛力的新計畫，而非將資金全數安穩地放在避險帳戶中作為無風險的退休準備。", catA: "EC", catB: "SS" },
				{ id: "C-ECSS-04", text: "當我確信這是一次絕佳的開創機會時，我寧可冒著財務斷炊的風險親自創業，也不願為了貪圖每個月固定入帳的薪資而錯失建立自有事業的先機。", catA: "EC", catB: "SS" },

				// [矩陣 05] 管理 (GM) vs. 專業 (TF) -> 同意代表保衛 GM，放棄 TF
				{ id: "C-GMTF-01", text: "當專案的實務細節爭議影響到整體的推進時效，我會選擇跳過深度的專業辯論，直接基於商業利益與宏觀成本的考量下達最終決策。", catA: "GM", catB: "TF" },
				{ id: "C-GMTF-02", text: "進行資源盤點時，若終止某項我個人熱愛的深度實務研究能為整個組織帶來更具規模的獲利，我會毫不猶豫地親手終止該項專業探索。", catA: "GM", catB: "TF" },
				{ id: "C-GMTF-03", text: "面對極端困難的操作障礙，只要預算允許，我傾向直接採購外部現成的成熟方案來解決問題，而非堅持自己花費大量時間去鑽研底層原理。", catA: "GM", catB: "TF" },
				{ id: "C-GMTF-04", text: "若某項深奧的領域知識暫時無法轉換為具體的業務產值或部門績效，即使它在學理上再有價值，我也會要求團隊停止對它的資源投入。", catA: "GM", catB: "TF" },

				// [矩陣 06] 服務 (S) vs. 挑戰 (PC) -> 同意代表保衛 S，放棄 PC
				{ id: "C-SPC-01", text: "即使一項極限專案充滿了戰勝強大競爭對手的刺激感，但若其執行手段會損害無辜群體或合作夥伴的實質權益，我也會堅決拒絕參與該計畫。", catA: "S", catB: "PC" },
				{ id: "C-SPC-02", text: "當團隊面臨高壓任務的生死關頭，我寧願稍微放緩衝刺的腳步去安撫並協助心理壓力瀕臨崩潰的成員，也不願只顧著追求個人闖關成功的成就感。", catA: "S", catB: "PC" },
				{ id: "C-SPC-03", text: "在極度困難的決策關頭，我寧可犧牲專案的短期勝利與業績突破，也不願做出犧牲基層成員身心健康或違反我利他價值觀的冷酷決定。", catA: "S", catB: "PC" },
				{ id: "C-SPC-04", text: "一份充滿高難度挑戰且能讓我大顯身手的工作，如果其核心商業邏輯最終不會對社會大眾帶來正面效益，對我而言就失去了投入的意義。", catA: "S", catB: "PC" },

				// [矩陣 07] 生活 (LS) vs. 專業 (TF) -> 同意代表保衛 LS，放棄 TF
				{ id: "C-LSTF-01", text: "若成為某個領域的頂尖權威，意味著我必須將下班後的私人時間也全數投入專業進修與技術研討，我寧願維持目前的實務水準以換取生活品質。", catA: "LS", catB: "TF" },
				{ id: "C-LSTF-02", text: "當一場極具含金量的高階專業培訓，撞期了我策劃已久的家庭海外旅行時，我會果斷放棄培訓機會，將寶貴的時光留給重要的親友。", catA: "LS", catB: "TF" },
				{ id: "C-LSTF-03", text: "對我而言，利用下班時間經營個人的休閒嗜好與多元成長，其重要性遠高於耗費精力去研讀最新的專業文獻以追求業界最前沿的技術地位。", catA: "LS", catB: "TF" },
				{ id: "C-LSTF-04", text: "如果一份工作要求我必須不斷壓縮私人的社交與休假時間，才能鑽研實務細節以避免被淘汰，我會主動放棄該職務，尋找能準時登出的選項。", catA: "LS", catB: "TF" },

				// [矩陣 08] 管理 (GM) vs. 自主 (AU) -> 同意代表保衛 GM，放棄 AU
				{ id: "C-GMAU-01", text: "為了獲取指揮龐大團隊與調度跨國資源的影響力，我完全能夠接受組織嚴密的層級規範，並忍受頻繁且繁瑣的行政會議與進度匯報體制。", catA: "GM", catB: "AU" },
				{ id: "C-GMAU-02", text: "我願意犧牲決定個人工作步調與作業方式的絕對自由，來換取在組織架構上位居高處、能夠拍板定案並掌控大局的關鍵決策權。", catA: "GM", catB: "AU" },
				{ id: "C-GMAU-03", text: "我不介意自身成為被龐大體制與標準流程束縛的推手，只要這套行政體系最終能賦予我指揮大規模資源並達成營運目標的實質權力。", catA: "GM", catB: "AU" },
				{ id: "C-GMAU-04", text: "只要最終結果能證明我的營運策略是成功的，我願意將個人時間奉獻給各種人際協調與跨部門角力，放棄做一個獨往獨來的獨立貢獻者。", catA: "GM", catB: "AU" },

				// [矩陣 09] 專業 (TF) vs. 自主 (AU) -> 同意代表保衛 TF，放棄 AU
				{ id: "C-TFAU-01", text: "為了確保工作產出能達到業界最嚴苛的標準，我願意嚴格遵循官方的規範手冊與繁瑣的審查流程，即使這會大幅限制我個人作業的自由度。", catA: "TF", catB: "AU" },
				{ id: "C-TFAU-02", text: "面對複雜的處理程序，我會堅持按部就班採用公認的最佳實踐方法，而非為了貪圖個人的作業便利，去使用未經嚴格驗證的偏門捷徑。", catA: "TF", catB: "AU" },
				{ id: "C-TFAU-03", text: "我更看重一項任務是否在專業品質上被雕琢到極致，至於這份工作是否允許我自由彈性地安排工時與地點，對我來說則是次要考量。", catA: "TF", catB: "AU" },
				{ id: "C-TFAU-04", text: "我認為遵循領域內的標準指引，比隨心所欲展現個人風格更具專業價值。因此我願意收起實驗精神，專注於合規且精確的實務產出。", catA: "TF", catB: "AU" },

				// [矩陣 10] 管理 (GM) vs. 服務 (S) -> 同意代表保衛 GM，放棄 S
				{ id: "C-GMS-01", text: "在組織資源面臨緊縮的危機時，為了確保整體企業的存續與財務獲利，我能夠承受壓力，做出精簡人力或縮減基層福利的艱難管理決策。", catA: "GM", catB: "S" },
				{ id: "C-GMS-02", text: "我更傾向擔任掌控整體預算並對最終營運績效負責的計畫統籌者，而非親自花費大量時間去關懷、傾聽並協助每一位同事解決他們的心理困境。", catA: "GM", catB: "S" },
				{ id: "C-GMS-03", text: "我認為高階職涯最大的價值在於具備權衡各方利益的商業談判手腕，在評估部門表現時，我會將財務產出置於員工的情緒滿意度之上。", catA: "GM", catB: "S" },
				{ id: "C-GMS-04", text: "當推動一項能為組織帶來巨大獲利的商業模式時，即便這個項目可能會對部分小眾群體的權益造成輕微的排擠，我也會優先考慮將其推向市場。", catA: "GM", catB: "S" },

				// [矩陣 11] 創業 (EC) vs. 生活 (LS) -> 同意代表保衛 EC，放棄 LS
				{ id: "C-ECLS-01", text: "為了解決新事業在初創階段所面臨的生死存亡危機，我不介意在私人行程或週末假期中隨時中斷休息，將全部心力投入在穩定商業模式上。", catA: "EC", catB: "LS" },
				{ id: "C-ECLS-02", text: "若有絕佳的機會能擴張我的開創性計畫並獲取市場影響力，我完全願意在未來的數年內，犧牲絕大部分的休閒娛樂與發展個人愛好的時光。", catA: "EC", catB: "LS" },
				{ id: "C-ECLS-03", text: "對我而言，利用下班後的深夜時間研發可變現的產品或佈局商業策略，其吸引力與成就感，遠大於把時間花在安排一場高品質的放鬆體驗。", catA: "EC", catB: "LS" },
				{ id: "C-ECLS-04", text: "我深信職業價值的突破需要極大的投入。為了讓我的創業點子成功落地，我願意忍受長期無法擁有規律作息與陪伴家人的極限狀態。", catA: "EC", catB: "LS" },

				// [矩陣 12] 穩定 (SS) vs. 挑戰 (PC) -> 同意代表保衛 SS，放棄 PC
				{ id: "C-SSPC-01", text: "比起被派往第一線去挽救一個充滿未知變數、隨時可能崩潰的極限專案，我更傾向留在一個制度健全、能為員工提供穩定避風港的常規部門。", catA: "SS", catB: "PC" },
				{ id: "C-SSPC-02", text: "在面臨市場大幅波動與高度未知的決策關頭，我寧願選擇維持穩健的現狀並保住既有產值，也不願為了追求高報酬而涉入極限博弈的刺激戰局。", catA: "SS", catB: "PC" },
				{ id: "C-SSPC-03", text: "我寧可安穩地待在具備完整福利保障與晉升階梯的傳統企業，也不願空降到那些極度需要強悍執行力來處理嚴重危機的高壓新創組織。", catA: "SS", catB: "PC" },
				{ id: "C-SSPC-04", text: "相比於在動盪不安的環境中尋求突破與反轉，我更傾向在缺乏強烈競爭壓力、能確保每一天工作進度都在預期軌道上的環境中度過職涯。", catA: "SS", catB: "PC" },

				// [矩陣 13] 專業 (TF) vs. 挑戰 (PC) -> 同意代表保衛 TF，放棄 PC
				{ id: "C-TFPC-01", text: "我認為專業的最大價值在於事前建立一套極少出錯的完美流程，而非在危機爆發後，享受那種於最後一刻憑藉靈光一現搶救成功的極限刺激感。", catA: "TF", catB: "PC" },
				{ id: "C-TFPC-02", text: "處理緊急狀況時，我強烈傾向按部就班地執行標準的防呆與修復程序，即使這顯得有些沉悶，我也拒絕採用高風險的即興發揮來證明實力。", catA: "TF", catB: "PC" },
				{ id: "C-TFPC-03", text: "我寧願安靜地維護一套邏輯嚴密且運作順暢的底層系統，也不願主動去接手一套殘破不堪、需要每天與突發狀況進行高壓攻防的計畫。", catA: "TF", catB: "PC" },
				{ id: "C-TFPC-04", text: "對我來說，將實務細節優化到完美無瑕的踏實感，遠比戰勝強勁對手或解決前人未解之謎所帶來的腎上腺素飆升更具吸引力。", catA: "TF", catB: "PC" },

				// [矩陣 14] 生活 (LS) vs. 管理 (GM) -> 同意代表保衛 LS，放棄 GM
				{ id: "C-LSGM-01", text: "即使晉升能讓我掌控更龐大的預算與決策權，若這意味著我將失去下班後安靜獨處的私人時間，並需要頻繁應付緊急會議，我會選擇放棄該機會。", catA: "LS", catB: "GM" },
				{ id: "C-LSGM-02", text: "為了確保我的假期絕對不會被公事打擾，我寧願在組織內永遠做一個準時登出的獨立貢獻者，也不願承接需要隨時為部門營運待命的主管職務。", catA: "LS", catB: "GM" },
				{ id: "C-LSGM-03", text: "若擔任負責統籌跨區域資源的高階主管，意味著我將長期無法準時回家陪伴家人共進晚餐，我會果斷拒絕這種在高層舞台展露頭角的升遷安排。", catA: "LS", catB: "GM" },
				{ id: "C-LSGM-04", text: "我強烈拒絕那些隨時可能因跨部門的人事衝突或利益協調，而打斷我與親友相處的工作。無論該職位能賦予我多大的行政權限，我都毫無興趣。", catA: "LS", catB: "GM" },

				// [矩陣 15] 創業 (EC) vs. 專業 (TF) -> 同意代表保衛 EC，放棄 TF
				{ id: "C-ECTF-01", text: "當我成功研發出一套極具價值的實務方案時，我會立即思考如何將其專利化或尋求商業變現，而不是繼續花費大量時間留在實驗室裡鑽研細節優化。", catA: "EC", catB: "TF" },
				{ id: "C-ECTF-02", text: "我認為掌握最新領域知識的最大價值，在於利用它們迅速建立起新的獲利流程與商業版圖，而非為了讓自己成為該學理領域中純粹的學術權威。", catA: "EC", catB: "TF" },
				{ id: "C-ECTF-03", text: "我渴望擁有一套由我完全主導的商業機制。至於這套機制背後所需的深奧技術或實務細節，我更傾向外包或交由專才負責，而非親自下去實作。", catA: "EC", catB: "TF" },
				{ id: "C-ECTF-04", text: "比起成為某項技術被公認的頂尖專家，我更願意將精力集中在開發業務、建立品牌與尋求投資人，藉由整合資源來極大化我的商業回報。", catA: "EC", catB: "TF" },

				// [矩陣 16] 自主 (AU) vs. 管理 (GM) -> 同意代表保衛 AU，放棄 GM
				{ id: "C-AUGM-01", text: "我寧願作為一個對自己產出全權負責、不受約束的獨立貢獻者，也不願成為一個握有龐大行政權力，卻每天行程都被跨部門協調會議塞滿的主管。", catA: "AU", catB: "GM" },
				{ id: "C-AUGM-02", text: "當專案推進遇到嚴重瓶頸時，比起召集各級部門開會並進行資源分配，我更習慣把自己關起來，用自己的獨特節奏獨立將問題給攻克。", catA: "AU", catB: "GM" },
				{ id: "C-AUGM-03", text: "如果我能對自己的工作內容與作業時間擁有絕對的決定權，即使我完全沒有任何下屬可以指揮，也無法參與組織的營運決策，我也會感到十分滿足。", catA: "AU", catB: "GM" },
				{ id: "C-AUGM-04", text: "我寧可做一個在外接案、自由自在且不必受制於企業層級規範的自由工作者，也不願踏入體制內，成為一個需要處理複雜人際衝突的營運負責人。", catA: "AU", catB: "GM" },

				// [矩陣 17] 服務 (S) vs. 穩定 (SS) -> 同意代表保衛 S，放棄 SS
				{ id: "C-SSS-01", text: "為了推動一項能夠解決重大社會痛點且具備深遠公益價值的計畫，我願意辭去目前按時上下班、收入穩健且具備完善退休保障的傳統職務。", catA: "S", catB: "SS" },
				{ id: "C-SSS-02", text: "當發現組織政策明顯不公時，為了替團隊成員爭取應有的權益或改善惡劣的環境，我願意得罪高層，甚至承擔失去這份安穩工作的強烈風險。", catA: "S", catB: "SS" },
				{ id: "C-SSS-03", text: "如果一份工作內容只是讓我安穩度日、領取死薪水，卻對社會大眾或弱勢群體毫無實質的正面幫助，那我寧願放棄這份保障去尋找更有意義的差事。", catA: "S", catB: "SS" },
				{ id: "C-SSS-04", text: "一份能確實解決終端使用者痛苦、但所屬公司可能隨時斷糧的非營利專案，對我的吸引力，遠大於在一家永不倒閉的機構中做著平庸無奇的行政庶務。", catA: "S", catB: "SS" },

				// [矩陣 18] 挑戰 (PC) vs. 創業 (EC) -> 同意代表保衛 PC，放棄 EC
				{ id: "C-PCEC-01", text: "我接手瀕臨破產的事業，主要是為了享受在極限壓力下扭轉危機並擊敗對手的純粹智力挑戰。一旦成功反轉，我便可能轉身離開，而非長期經營該品牌。", catA: "PC", catB: "EC" },
				{ id: "C-PCEC-02", text: "我最享受的是憑藉精準決策在市場劇烈波動中勝出的「極限博弈感」，至於這份勝利是否能轉化為我個人擁有的實體資產或股權，則是次要考量。", catA: "PC", catB: "EC" },
				{ id: "C-PCEC-03", text: "當我成功擊敗市場上的強大競爭對手時，那種證明自身實力的純粹亢奮感，遠比我創辦了多少家公司或累積了多少商業獲利，更讓我感到興奮。", catA: "PC", catB: "EC" },
				{ id: "C-PCEC-04", text: "我的核心動力在於不斷尋找並解決商業戰場上的「死結」與「強敵」。只要任務夠艱鉅，我完全不介意是以專業經理人的身分迎戰，而非身為企業主。", catA: "PC", catB: "EC" },

				// [矩陣 19] 穩定 (SS) vs. 自主 (AU) -> 同意代表保衛 SS，放棄 AU
				{ id: "C-SSAU-01", text: "我能接受受制於嚴格的上下班打卡制度與僵化的組織規章，只要這份工作能為我帶來長期且明確的財務安全感，以及絕不輕易裁員的留任保障。", catA: "SS", catB: "AU" },
				{ id: "C-SSAU-02", text: "若組織強制要求所有人員必須回到固定的辦公室集中作業以換取不被裁員的承諾，我會毫不猶豫地配合規定，放棄我對遠距辦公與時間彈性的堅持。", catA: "SS", catB: "AU" },
				{ id: "C-SSAU-03", text: "為了維持目前在傳統產業累積多年的優渥退休福利與年資，我完全願意放棄轉職到那些可以讓我自由安排生活節奏、但缺乏財務保障的新創遠距團隊。", catA: "SS", catB: "AU" },
				{ id: "C-SSAU-04", text: "我強烈傾向待在薪酬體系明確、抗風險能力極佳的大型企業，即使必須遵循各種死板的作業流程，我也拒絕選擇模式完全自主但隨時可能斷糧的接案生活。", catA: "SS", catB: "AU" },

				// [矩陣 20] 管理 (GM) vs. 創業 (EC) -> 同意代表保衛 GM，放棄 EC
				{ id: "C-GMEC-01", text: "我期望的職涯頂點是成為大型上市集團的營運負責人，調動跨國資源推動組織轉型，而非承擔個人財務風險去開創一家由我完全獨資擁有的微型企業。", catA: "GM", catB: "EC" },
				{ id: "C-GMEC-02", text: "推動全公司數千人進行大規模業務重組並獲取成功的成就感，對我而言，遠大於我自己親手開發一套產品並將其成功商業變現所獲得的私人財富。", catA: "GM", catB: "EC" },
				{ id: "C-GMEC-03", text: "我更享受在龐大的企業機器中攀上決策顛峰、運用體制力量指揮千軍萬馬的權威感，而不是帶著幾個人的團隊在市場邊緣冒險求生，尋求創業突破。", catA: "GM", catB: "EC" },
				{ id: "C-GMEC-04", text: "只要能讓我擁有主導大型集團發展方向的決策權限，我完全不介意我只是一個領取年薪的專業經理人，而非擁有該公司分配股權的實際創辦人。", catA: "GM", catB: "EC" },

				// [矩陣 21] 專業 (TF) vs. 服務 (S) -> 同意代表保衛 TF，放棄 S
				{ id: "C-TFS-01", text: "面對核心邏輯的架構錯誤，我會堅持暫停運作並進行徹底翻修以確保專業嚴謹度，即使這會導致第一線處理客戶抱怨的同仁面臨極大的情緒壓力。", catA: "TF", catB: "S" },
				{ id: "C-TFS-02", text: "當作業流程出現不影響最終結果但邏輯不夠完美的小瑕疵時，我會優先花時間鑽研技術根除問題，而不是去安撫並協助那些因為操作不順而感到挫折的同事。", catA: "TF", catB: "S" },
				{ id: "C-TFS-03", text: "如果我開發的優化工具大幅減少了系統運算時間，我的成就感完全來自於「解決了複雜的實務難題」，而不是這項工具「減輕了同事多少加班的痛苦」。", catA: "TF", catB: "S" },
				{ id: "C-TFS-04", text: "面對實務運作上的嚴重爭議時，我強烈傾向於客觀地追究專業邏輯的對錯與標準，而非優先考量如何妥協以照顧當事人的自尊心或情緒感受。", catA: "TF", catB: "S" },

				// [矩陣 22] 生活 (LS) vs. 穩定 (SS) -> 同意代表保衛 LS，放棄 SS
				{ id: "C-LSSS-01", text: "為了換取每年能夠安排長途旅行且保證絕對不加班的生活節奏，我願意接受一份薪水較低、缺乏長期退休保障且隨時可能因約滿而終止的專案合約。", catA: "LS", catB: "SS" },
				{ id: "C-LSSS-02", text: "我絕不會為了一份業界最高水準的穩定高薪與終身僱用保證，去接受一個會嚴重剝奪我陪伴家人時光、必須長期駐外且無預警出差的高壓職位。", catA: "LS", catB: "SS" },
				{ id: "C-LSSS-03", text: "只要一份工作嚴重損害了我經營個人社群或興趣的精力，即使我在該組織已經累積了十年的安穩年資與深厚人脈，我也會毫不眷戀地選擇辭職。", catA: "LS", catB: "SS" },
				{ id: "C-LSSS-04", text: "我追求的是一種能與家庭深度整合、隨時可以啟動長假的工作模式。為了這份平衡，我完全可以捨棄那些為了保住飯碗而必須謹小慎微、迎合上意的穩定職涯。", catA: "LS", catB: "SS" },

				// [矩陣 23] 自主 (AU) vs. 挑戰 (PC) -> 同意代表保衛 AU，放棄 PC
				{ id: "C-AUPC-01", text: "如果一項能改寫業界標竿的高難度挑戰，要求我必須進入高壓密集的團隊中並絕對服從指揮官的指令，我會為了維持個人的作業自由度而選擇放棄參與。", catA: "AU", catB: "PC" },
				{ id: "C-AUPC-02", text: "我寧願選擇節奏平緩、完全由我自主控制進度的常規性接案工作，也不願加入一個雖然能執行極限挑戰、但進度必須受限於頻繁審查的菁英部隊。", catA: "AU", catB: "PC" },
				{ id: "C-AUPC-03", text: "對我而言，職場上最渴望的終極狀態是「沒有任何人能干涉我的產出過程」，這遠比不斷尋找更強大的競爭對手來證明自己的極限實力更為重要。", catA: "AU", catB: "PC" },
				{ id: "C-AUPC-04", text: "若解決一項史詩級難題的前提是，我必須捨棄遠距辦公的特權並每天進辦公室接受嚴密的進度追蹤，我就會立刻失去攻克該難題的所有興致。", catA: "AU", catB: "PC" },

				// [矩陣 24] 創業 (EC) vs. 自主 (AU) -> 同意代表保衛 EC，放棄 AU
				{ id: "C-ECAU-01", text: "為了讓我的創新事業成功擴張規模並獲取市場影響力，我願意每天應付各種繁瑣的行政法規與投資人談判，即使這會徹底剝奪我個人的絕對自由。", catA: "EC", catB: "AU" },
				{ id: "C-ECAU-02", text: "我承擔龐大風險開創新事業，是為了建立一個能持續獲利並具備知名度的商業實體，而非單純為了逃避企業的打卡制度或追求個人的不受拘束。", catA: "EC", catB: "AU" },
				{ id: "C-ECAU-03", text: "比起做個自由自在、只對自己負責的獨立顧問，我更渴望承擔起創立團隊、發放薪水與建立制度的重責大任，即便這意味著我將被事業緊緊綁住。", catA: "EC", catB: "AU" },
				{ id: "C-ECAU-04", text: "我完全願意為了佈局我的商業版圖而犧牲個人的作息彈性，並遵守商業市場的嚴格規範。因為看著事業體逐漸壯大，才是我真正的核心目標。", catA: "EC", catB: "AU" },

				// [矩陣 25] 穩定 (SS) vs. 專業 (TF) -> 同意代表保衛 SS，放棄 TF
				{ id: "C-SSTF-01", text: "進行核心系統升級時，為了確保營運的絕對穩定與不中斷，我寧可放棄導入最頂尖且高效能的前衛架構，堅持使用緩慢但保證不出錯的傳統工法。", catA: "SS", catB: "TF" },
				{ id: "C-SSTF-02", text: "我認為職業的最高價值在於「提供組織絕對的安全感與延續性」，而非將工作場域當作讓我實驗最新穎專業理論或磨練高階技術的個人遊樂場。", catA: "SS", catB: "TF" },
				{ id: "C-SSTF-03", text: "如果一項能大幅提升產出精確度的創新做法，存在著千分之一導致部門短暫停擺的風險，為了保住全體員工的考績，我會強烈建議維持現狀。", catA: "SS", catB: "TF" },
				{ id: "C-SSTF-04", text: "即便留在目前的老字號公司意味著我只能維護舊有模式，永遠無法接觸業界最頂尖的領域知識，只要公司保證永不裁員，我就絕不會主動尋找外部機會。", catA: "SS", catB: "TF" },

				// [矩陣 26] 服務 (S) vs. 自主 (AU) -> 同意代表保衛 S，放棄 AU
				{ id: "C-SAU-01", text: "當我發現一項政策正嚴重損害多數基層成員的權益時，我會主動挺身而出帶頭倡議與協商，即便這會讓我失去原本能安靜獨立作業、不受打擾的特權。", catA: "S", catB: "AU" },
				{ id: "C-SAU-02", text: "如果一個極具利他價值的公益專案需要我每天駐點，並嚴格配合受助群體的僵化作息，我會欣然接受，並心甘情願地放棄過去高度自由的工作狀態。", catA: "S", catB: "AU" },
				{ id: "C-SAU-03", text: "我非常願意為了幫助陷入嚴重職涯瓶頸或心理困境的同事，而暫時放下我對「作業節奏不容干擾」的強烈堅持，花費大量時間陪伴他們走過低谷。", catA: "S", catB: "AU" },
				{ id: "C-SAU-04", text: "當參與一項能大幅改善團隊福祉的互助計畫時，我完全能夠忍受該計畫中各種瑣碎的協作規則與限制，不再堅持只能用我自己發明的高效方式來做事。", catA: "S", catB: "AU" },

				// [矩陣 27] 挑戰 (PC) vs. 管理 (GM) -> 同意代表保衛 PC，放棄 GM
				{ id: "C-PCGM-01", text: "當組織面臨存亡關鍵時，我渴望成為站在第一線與危機直接進行高壓攻防的特遣隊，而非安穩地坐在總部幕後，進行長期的資源分配與人事戰略規劃。", catA: "PC", catB: "GM" },
				{ id: "C-PCGM-02", text: "我寧願主動接手一個眾人皆不看好的殘破部門，來證明我能將其反敗為勝的極限能力，也不願順理成章地接班一個資源充足且運作平穩的大型管理職缺。", catA: "PC", catB: "GM" },
				{ id: "C-PCGM-03", text: "我極度享受憑藉一己之力的果斷決策，在倒數計時的極限壓力下扭轉危機的刺激感，這遠比坐在會議室裡協調跨部門利益、行使行政指揮權更讓我著迷。", catA: "PC", catB: "GM" },
				{ id: "C-PCGM-04", text: "對我而言，真槍實彈地在最前線與棘手問題進行廝殺決鬥，其所帶來的純粹快感，是任何高階管理職稱與指揮龐大團隊的權威感都無法比擬的。", catA: "PC", catB: "GM" },

				// [矩陣 28] 生活 (LS) vs. 創業 (EC) -> 同意代表保衛 LS，放棄 EC
				{ id: "C-LSEC-01", text: "我絕不會為了將個人研發的創新產品推向市場、追求未來的獨角獸潛力，而將原先規劃用來確保家人生活品質與安穩的緊急預備金全數投入風險之中。", catA: "LS", catB: "EC" },
				{ id: "C-LSEC-02", text: "如果擴展我的副業版圖，意味著我在未來的數年內都無法享受長途旅行，或將徹底失去發展個人愛好的時間，我會果斷放棄擴張計畫，維持目前的舒適狀態。", catA: "LS", catB: "EC" },
				{ id: "C-LSEC-03", text: "一份能穩定提供足夠現金流，且絕對不會佔用到任何週末時光的被動收入組合，對我的吸引力，遠大於親手創辦一家極具市場爆發力的新創企業。", catA: "LS", catB: "EC" },
				{ id: "C-LSEC-04", text: "我對於「成功」的最深層定義，在於生活節奏的從容與家庭關係的和諧。至於我是否擁有具備市場價值的創業股權或商業名聲，對我而言一點都不重要。", catA: "LS", catB: "EC" },

				// [矩陣 29] 服務 (S) vs. 專業 (TF) -> 同意代表保衛 S，放棄 TF
				{ id: "C-STF-01", text: "為了協助同事解決操作困難並度過低谷，我寧願暫停手邊複雜的專業實務專案，即使這會嚴重延誤我鑽研最新領域知識的進度。", catA: "S", catB: "TF" },
				{ id: "C-STF-02", text: "當系統發生小錯誤時，我會優先花時間製作易懂的教學指引來幫助同仁，而不是將精力投入於把底層架構優化到完美無瑕。", catA: "S", catB: "TF" },
				{ id: "C-STF-03", text: "在開發產品時，若發現操作介面會讓弱勢使用者感到挫折，我寧可放棄導入最頂尖的自動化技術，也要尋找最具人情味的替代方案。", catA: "S", catB: "TF" },
				{ id: "C-STF-04", text: "衡量專業能力時，我最看重的是這項技術能否實質改善他人的處境。若無法對大眾產生正面影響，即使技術門檻極高我也缺乏鑽研動力。", catA: "S", catB: "TF" },

				// [矩陣 30] 管理 (GM) vs. 穩定 (SS) -> 同意代表保衛 GM，放棄 SS
				{ id: "C-GMSS-01", text: "只要組織願意賦予我統籌大型轉型計畫的實質權力，我完全願意簽下若專案失敗便主動離職的高風險承諾，放棄目前的穩定年資。", catA: "GM", catB: "SS" },
				{ id: "C-GMSS-02", text: "為了展現高階管理的決斷力並獲取更高的跨部門指揮權，我敢於大刀闊斧地精簡編制，即使這會打破我在組織內長年累積的和諧與安穩。", catA: "GM", catB: "SS" },
				{ id: "C-GMSS-03", text: "只要能讓我晉升為掌握核心預算與戰略方向的負責人，我完全不在乎這會讓我失去目前在原單位所享有的固定工時與免於裁員的保障。", catA: "GM", catB: "SS" },
				{ id: "C-GMSS-04", text: "我極度渴望被賦予帶領組織轉型的權限。為了獲取這份影響力，我願意放棄傳統企業那種按部就班、毫無風險的安穩職涯路徑。", catA: "GM", catB: "SS" },

				// [矩陣 31] 創業 (EC) vs. 挑戰 (PC) -> 同意代表保衛 EC，放棄 PC
				{ id: "C-ECPC-01", text: "當我成功建立一套可複製的獲利流程後，我會立刻尋求將其商業變現或出售，而不是繼續將其留在身邊，挑戰更嚴苛的極限操作情境。", catA: "EC", catB: "PC" },
				{ id: "C-ECPC-02", text: "面對市場競爭，我唯一的目標是將研發成果轉化為實質的商業版圖與股權。我對單純為了證明自身實力而進行的極限挑戰毫無興趣。", catA: "EC", catB: "PC" },
				{ id: "C-ECPC-03", text: "當外部環境震盪時，我最在乎的是這筆資源能否成為我開展開創性事業的資本，而非享受在極限波動中精準決策的對決快感。", catA: "EC", catB: "PC" },
				{ id: "C-ECPC-04", text: "若我的商業模式已經確立並開始獲利，我會開始策劃下一個新事業，而不會為了戰勝更強大的業界標竿，將這家公司推向高風險的生死決鬥。", catA: "EC", catB: "PC" },

				// [矩陣 32] 生活 (LS) vs. 自主 (AU) -> 同意代表保衛 LS，放棄 AU
				{ id: "C-LSAU-01", text: "只要能確保我下班後絕對不必處理任何公事，我完全可以接受在上班時間內必須嚴格服從主管指示，並放棄我對工作方式與節奏的自主權。", catA: "LS", catB: "AU" },
				{ id: "C-LSAU-02", text: "為了換取每個週末都能專心陪伴家人的生活品質，我寧願接受一份主管會嚴格干涉作業細節但保證準時下班的內勤，也不願做時間無上限的自由顧問。", catA: "LS", catB: "AU" },
				{ id: "C-LSAU-03", text: "只要能讓我在休假期間徹底斷網放鬆，我毫不介意組織強制我使用最僵化的作業系統與死板流程，放棄用自己喜歡的方式來解決任務。", catA: "LS", catB: "AU" },
				{ id: "C-LSAU-04", text: "擁有穩定且可預測的私人生活節奏對我來說是首要目標。為了這份安寧，我願意忍受白天在辦公室裡失去彈性工時與自由決策的特權。", catA: "LS", catB: "AU" },

				// [矩陣 33] 穩定 (SS) vs. 服務 (S) -> 同意代表保衛 SS，放棄 S
				{ id: "C-SSS2-01", text: "為了確保自身部門的考核績效與職位安穩不受波及，在面臨組織資源緊縮時，我會選擇保持沉默，即便這意味著無法替權益受損的弱勢同仁發聲。", catA: "SS", catB: "S" },
				{ id: "C-SSS2-02", text: "當核心業務出現異常時，為了保住我個人的長期考績與安穩狀態，我會嚴格遵守非我管轄絕不介入的原則，即使我知道其他同仁正為此焦頭爛額。", catA: "SS", catB: "S" },
				{ id: "C-SSS2-03", text: "在參與年度評等或決策時，我會將不破壞既有體制的穩定性放在第一位。即使知道某些有貢獻的邊緣同仁受到委屈，我也不願為此承擔得罪高層的風險。", catA: "SS", catB: "S" },
				{ id: "C-SSS2-04", text: "在面臨可能的業務究責時，我會優先確保符合組織的標準流程與自我保護機制，絕不願為了熱心協助他人，而讓自己陷入可能被開除的職涯風險。", catA: "SS", catB: "S" },

				// [矩陣 34] 挑戰 (PC) vs. 專業 (TF) -> 同意代表保衛 PC，放棄 TF
				{ id: "C-PCTF-01", text: "只要能在一場不被看好的戰役中驚險逆轉局勢，我完全不在乎解決問題的過程是否符合業界最嚴謹的專業標準與實務規範。", catA: "PC", catB: "TF" },
				{ id: "C-PCTF-02", text: "比起安靜地在實驗室裡將現有流程梳理到極致完美，我更渴望被派往第一線，去阻擋一場前所未見、充滿極限挑戰的重大危機。", catA: "PC", catB: "TF" },
				{ id: "C-PCTF-03", text: "如果緊急任務要求在極短時間內完成交付，我會採取任何能立即過關的激進手段來戰勝對手，而不是慢條斯理地去雕琢產出的技術細節。", catA: "PC", catB: "TF" },
				{ id: "C-PCTF-04", text: "對我來說，憑藉強悍執行力戰勝強敵所帶來的刺激亢奮感，其價值遠遠超越遵循專家防呆手冊所帶來的完美無瑕與實務踏實感。", catA: "PC", catB: "TF" },

				// [矩陣 35] 自主 (AU) vs. 服務 (S) -> 同意代表保衛 AU，放棄 S
				{ id: "C-AUS-01", text: "在推動計畫時，我寧可獨自扛下所有壓力並用自己的極快節奏完成，也不願為了照顧那些進度落後、需要大量引導的成員而放慢我的步調。", catA: "AU", catB: "S" },
				{ id: "C-AUS-02", text: "只要能確保我個人作業的絕對自由與不受干擾，我完全不介意被同事視為一個缺乏團隊互助精神、不願意花時間參與公益或關懷活動的獨行俠。", catA: "AU", catB: "S" },
				{ id: "C-AUS-03", text: "為了維持我獨特且高效的工作模式，我強烈拒絕配合那些打著為了團隊和諧或照顧多數人感受旗號，而強制要求所有成員統一作業方式的組織規範。", catA: "AU", catB: "S" },
				{ id: "C-AUS-04", text: "我堅持使用我自己發明且最順手的方式來處理任務，即使這種高度個人化的作風會讓負責協作或接手的同事感到難以理解與痛苦，我也不願妥協。", catA: "AU", catB: "S" },

				// [矩陣 36] 專業 (TF) vs. 穩定 (SS) -> 同意代表保衛 TF，放棄 SS
				{ id: "C-TFSS-01", text: "只要組織允許我將最前衛的專業解法導入核心流程，我願意承擔這項新做法可能導致系統短暫不穩定，甚至讓我個人考績面臨被降級的風險。", catA: "TF", catB: "SS" },
				{ id: "C-TFSS-02", text: "為了徹底掌握並推行一套效能極強但相對冷門的實務架構，我完全願意放棄目前在主流成熟環境中累積多年的權威地位與安穩評價。", catA: "TF", catB: "SS" },
				{ id: "C-TFSS-03", text: "只要能讓我深入接觸業界最頂尖的領域知識與實作技巧，我寧可離開一家保證永不裁員的老字號企業，轉往充滿不確定性的新環境發展。", catA: "TF", catB: "SS" },
				{ id: "C-TFSS-04", text: "我職業的最高價值在於掌握該領域最深奧的實務工法。為了獲得這份專業成就，我完全不在乎是否會破壞組織營運的絕對穩定感與我的長期退休保障。", catA: "TF", catB: "SS" },

				// [矩陣 37] 服務 (S) vs. 管理 (GM) -> 同意代表保衛 S，放棄 GM
				{ id: "C-SGM-01", text: "在進行資源分配的關鍵時刻，我寧願稍微犧牲自身所帶領部門的帳面財務績效，也要確保那些家境困難或處於弱勢的基層同仁能夠保有工作。", catA: "S", catB: "GM" },
				{ id: "C-SGM-02", text: "當推動一項對社會大眾有益的專案時，我唯一的目的是看到環境獲得實質改善。我極度反感管理層試圖將這個專案包裝成展現跨國統籌權力的舞台。", catA: "S", catB: "GM" },
				{ id: "C-SGM-03", text: "當部門同仁需要長期的心理支持與實質協助時，我願意完全放下手中的管理權杖去親自陪伴他們度過難關，這比掌握行政職權更能讓我感到滿足。", catA: "S", catB: "GM" },
				{ id: "C-SGM-04", text: "我更希望利用大型專案去發掘並記錄基層人員默默奉獻的感人故事，而不是將其視為一個向董事會展現我營運調度能力與擴大晉升資本的工具。", catA: "S", catB: "GM" },

				// [矩陣 38] 創業 (EC) vs. 服務 (S) -> 同意代表保衛 EC，放棄 S
				{ id: "C-ECS-01", text: "為了確保我一手創立的商業模式能成功擴張並存活，我會果斷停止服務那些經常延遲付款的清寒客戶。在商言商，企業的存續絕對優先於公益考量。", catA: "EC", catB: "S" },
				{ id: "C-ECS-02", text: "當我發現一個極具獲利潛力與市場爆發力的商業缺口時，即使這個項目可能會對部分社經弱勢群體的利益造成輕微的排擠，我也會毫不猶豫地將其推向市場。", catA: "EC", catB: "S" },
				{ id: "C-ECS-03", text: "如果我開發了一套能精準預測市場趨勢的分析工具，我會選擇成立收費高昂的諮詢公司來最大化我的財富，而不是將其無償開源提供給社會大眾使用。", catA: "EC", catB: "S" },
				{ id: "C-ECS-04", text: "在建立商業版圖的過程中，我會將企業的市場擴張力與實質獲利能力置於實踐社會責任之上。對我而言，創造可觀的商業估值才是正確的開創者思維。", catA: "EC", catB: "S" },

				// [矩陣 39] 專業 (TF) vs. 生活 (LS) -> 同意代表保衛 TF，放棄 LS
				{ id: "C-TFLS-01", text: "面對一個極其罕見且深奧的業務報錯，我寧可犧牲原定好的下班後私人休閒時光，熬夜查閱相關文件到天亮，也不願按時登出並把問題丟給隔天的接班人。", catA: "TF", catB: "LS" },
				{ id: "C-TFLS-02", text: "為了徹底搞懂一項最新的實務運作機制以維持我的專家地位，我完全願意連續幾個週末不出門，大幅壓縮我陪伴家人與長途旅行的時間。", catA: "TF", catB: "LS" },
				{ id: "C-TFLS-03", text: "如果能讓我參與一項業界最前沿的基礎建設升級計畫，進而大幅提升我的實務深度，我毫不介意這個專案將會徹底摧毀我對工作與生活平衡的追求。", catA: "TF", catB: "LS" },
				{ id: "C-TFLS-04", text: "我經常主動利用私人的週末假期來研究實務領域的複雜細節。因為對我而言，追求專業領域上的極致深造，比單純的旅遊或家庭放鬆更能讓我感到充實。", catA: "TF", catB: "LS" },

				// [矩陣 40] 管理 (GM) vs. 挑戰 (PC) -> 同意代表保衛 GM，放棄 PC
				{ id: "C-GMPC-01", text: "比起親上前線廝殺、享受極限逆轉勝的刺激，我更傾向待在總部，冷靜地指揮跨區域部門的資源調度，以確保組織整體的長治久安。", catA: "GM", catB: "PC" },
				{ id: "C-GMPC-02", text: "當組織面臨危機時，我認為最有價值的是建立一套不再發生危機的營運制度，而不是去享受那種在混亂中成為救火英雄的戰鬥快感。", catA: "GM", catB: "PC" },
				{ id: "C-GMPC-03", text: "我期望的職涯頂點是掌管龐大且運作平穩的企業帝國，運用體制力量指揮全局，而不是不斷去尋找高難度的爛攤子公司來證明我的反轉能力。", catA: "GM", catB: "PC" },
				{ id: "C-GMPC-04", text: "我追求的是透過完善的管理制度來掌控全局的絕對穩定，而非透過參與一場又一場的限時博弈與極限挑戰來證明自己的身手。", catA: "GM", catB: "PC" },

				// [矩陣 41] 自主 (AU) vs. 創業 (EC) -> 同意代表保衛 AU，放棄 EC
				{ id: "C-AUEC-01", text: "我寧可永遠做個只對自己產出負責的獨立接案者，也不願承擔風險去創立一家公司，進而扛起發放員工薪水與應付投資人報告的企業主責任。", catA: "AU", catB: "EC" },
				{ id: "C-AUEC-02", text: "即使我手上有極具市場潛力的計畫原型，只要想到創業必須不斷受制於董事會的壓力並失去作業自由，我也會立刻打消將其商業化的念頭。", catA: "AU", catB: "EC" },
				{ id: "C-AUEC-03", text: "對我來說，隨時隨地能工作的絕對自由，其價值遠遠超越承擔高額財務風險去打造一個具備高變現能力與市場知名度的連鎖商業品牌。", catA: "AU", catB: "EC" },
				{ id: "C-AUEC-04", text: "我對職涯成功的最高理解是沒有人能干涉我做什麼，而非我創立了一家估值多高、擁有多少名員工的龐大企業體系。", catA: "AU", catB: "EC" },

				// [矩陣 42] 穩定 (SS) vs. 創業 (EC) -> 同意代表保衛 SS，放棄 EC
				{ id: "C-SSEC-01", text: "即使我腦中擁有極佳的創業點子與早期資金，我也會因為捨不得目前在成熟大企業累積多年的安穩年資與固定分紅，而選擇按兵不動。", catA: "SS", catB: "EC" },
				{ id: "C-SSEC-02", text: "對我而言，一份月薪固定且保證能讓我安穩直到退休的行政職缺，勝過一個號稱未來能讓我獲得千萬分配股權但充滿變數的共同創辦人機會。", catA: "SS", catB: "EC" },
				{ id: "C-SSEC-03", text: "在進行重大職涯選擇時，我堅守保本與獲取穩定現金流的原則。無論潛在回報多麼驚人，我都絕不輕易將職涯黃金期投入高風險的新創事業。", catA: "SS", catB: "EC" },
				{ id: "C-SSEC-04", text: "我會將畢生積蓄全數存放在具備高度保障、低風險的傳統避險計畫中，絕對不會拿去投資那些可能成為業界獨角獸但隨時會血本無歸的初創事業。", catA: "SS", catB: "EC" },

				// [矩陣 43] 自主 (AU) vs. 專業 (TF) -> 同意代表保衛 AU，放棄 TF
				{ id: "C-AUTF-01", text: "若要精進某項核心技術的前提是，我必須參加極度僵化且強制打卡的實體培訓課程，我會因為這嚴重限制了我的時間彈性而果斷選擇放棄。", catA: "AU", catB: "TF" },
				{ id: "C-AUTF-02", text: "當面對一個強制要求成員必須遵循業界最權威但也最繁瑣審查流程的系統時，為了爭取個人作業的隨性與自由，我會選擇離開這個專案。", catA: "AU", catB: "TF" },
				{ id: "C-AUTF-03", text: "我認為能夠用我自己喜歡且彈性的方式把任務解掉，其重要性遠遠高於使用業界公認最無懈可擊但程序死板的最佳實務框架來執行。", catA: "AU", catB: "TF" },
				{ id: "C-AUTF-04", text: "只要一份工作嚴格要求每一步都必須依照標準防呆手冊進行審查，扼殺了我個人解決問題的靈活性，即使這能讓我成為頂尖專家，我也會拒絕。", catA: "AU", catB: "TF" },

				// [矩陣 44] 服務 (S) vs. 生活 (LS) -> 同意代表保衛 S，放棄 LS
				{ id: "C-SLS-01", text: "只要一份工作能實質且深遠地改善弱勢群體的生活，我完全願意接受較低的薪資水平，並大幅縮減我個人每年的休閒與家庭娛樂預算。", catA: "S", catB: "LS" },
				{ id: "C-SLS-02", text: "為了支持具備重大公益價值的利他專案，即使需要嚴重縮短年度的家庭聚會時間並犧牲週末的放鬆時光，我也會義無反顧地投入其中。", catA: "S", catB: "LS" },
				{ id: "C-SLS-03", text: "我認為將下班後的業餘時間奉獻給組織內部的弱勢互助社團，其生命意義遠遠大於獨自待在家裡享受安靜的私人娛樂或經營個人的休閒嗜好。", catA: "S", catB: "LS" },
				{ id: "C-SLS-04", text: "當受助對象或同事遭遇緊急心理危機時，我願意在深夜或假日的休假期間隨時接聽求助電話。對我而言，幫助他人比維持我生活界線的完整更重要。", catA: "S", catB: "LS" },

				// [矩陣 45] 專業 (TF) vs. 創業 (EC) -> 同意代表保衛 TF，放棄 EC
				{ id: "C-TFEC-01", text: "當我開發出一個效能絕佳的實務工具時，我更傾向把它留在手中持續進行底層細節的深度優化，而非立刻暫停研發腳步將其包裝成商品尋求變現。", catA: "TF", catB: "EC" },
				{ id: "C-TFEC-02", text: "我畢生的追求是成為該實務領域中被公認的絕對專家。比起成為一家將技術外包以獲取龐大利潤的代理商老闆，我更在乎學理與技術上的深度。", catA: "TF", catB: "EC" },
				{ id: "C-TFEC-03", text: "深入鑽研核心實務邏輯所帶來的純粹滿足感，對我的吸引力，遠遠大於利用這些技術去商業市場上承受開創風險並賺取千萬財富。", catA: "TF", catB: "EC" },
				{ id: "C-TFEC-04", text: "我傾向於將絕大部分的時間用於不斷精進並保護我的專業成果。我不願為了迎合市場趨勢，而匆忙將半成品的技術轉化為純獲利導向的商業產品。", catA: "TF", catB: "EC" },

				// [矩陣 46] 生活 (LS) vs. 自主 (AU) -> 同意代表保衛 LS，放棄 AU
				{ id: "C-LSAU2-01", text: "為了換取每週都有充裕且不被打擾的家庭時光，我完全可以接受一份主管會微觀管理我所有作業細節、徹底剝奪我工作自主權的死板職務。", catA: "LS", catB: "AU" },
				{ id: "C-LSAU2-02", text: "對我來說，擁有一套準時上下班且可控的生活節奏，遠比獲得一份能夠隨心所欲安排進度、但不時需要深夜加班的遠距接案工作更重要。", catA: "LS", catB: "AU" },
				{ id: "C-LSAU2-03", text: "只要能保證我下班後不必處理任何突發公事，我心甘情願地配合公司內部各種不合理且僵化的請假規範與行政約束，放棄爭取個人的作業彈性。", catA: "LS", catB: "AU" },
				{ id: "C-LSAU2-04", text: "維護私人生活的高品質是我的底線。為了確保休假不被中斷，我完全能接受在上班時間內成為一顆聽命行事的齒輪，放棄對專案節奏的決定權。", catA: "LS", catB: "AU" },

				// [矩陣 47] 管理 (GM) vs. 挑戰 (PC) -> 同意代表保衛 GM，放棄 PC
				{ id: "C-GMPC2-01", text: "作為營運決策者，我更在乎如何精準調度龐大資源讓組織長治久安。我絕對不會為了解決一個充滿刺激的限時危機，而將整體部門置於高風險的博弈中。", catA: "GM", catB: "PC" },
				{ id: "C-GMPC2-02", text: "成功的管理者應具備宏觀的大局觀。我絕不允許團隊為追求極限挑戰與英雄式的成就感，而破壞了組織內部早已建立好的穩健獲利流程。", catA: "GM", catB: "PC" },
				{ id: "C-GMPC2-03", text: "我認為掌管千人企業所帶來的階級權威與資源支配力，其價值遠遠大於單槍匹馬解決一項無人能解的高難度障礙所帶來的戰鬥快感。", catA: "GM", catB: "PC" },
				{ id: "C-GMPC2-04", text: "面對市場上的強大對手，我會優先考量透過併購或體制改革來擴大營運版圖，而非親自下場與其進行一場關乎生死、充滿腎上腺素的極限廝殺。", catA: "GM", catB: "PC" },

				// [矩陣 48] 創業 (EC) vs. 穩定 (SS) -> 同意代表保衛 EC，放棄 SS
				{ id: "C-ECSS2-01", text: "與其在傳統大企業中安穩地領取優渥年終獎金，我更想將這筆保命資金全數提領出來，拿去支應我剛創立、隨時可能血本無歸的新事業初期開銷。", catA: "EC", catB: "SS" },
				{ id: "C-ECSS2-02", text: "我對於個人財務的終極看法是創造無上限的商業可能性，而非尋求最安全、最穩定的退休保障。為了擴張事業，我隨時準備好承擔斷炊的風險。", catA: "EC", catB: "SS" },
				{ id: "C-ECSS2-03", text: "我追求的是能夠完全掌控事業高速成長所帶來的爆發性收益。為此，我寧可放棄受大型組織保護的勞健保福利與免於資遣的安穩承諾。", catA: "EC", catB: "SS" },
				{ id: "C-ECSS2-04", text: "只要這個創業構思具備顛覆市場的潛力，我寧願為了實現它而承受數年沒有固定收入的高壓生活，也絕對不願回頭過著領取穩定月薪的日子。", catA: "EC", catB: "SS" },

				// [矩陣 49] 挑戰 (PC) vs. 自主 (AU) -> 同意代表保衛 PC，放棄 AU
				{ id: "C-PCAU-01", text: "只要接手的任務具備突破業界天花板的極限刺激感，我完全不介意被編入一個紀律極度嚴明、必須絕對服從長官指令的高壓部隊中運作。", catA: "PC", catB: "AU" },
				{ id: "C-PCAU-02", text: "為了攻克一個強大且看似無法擊敗的市場競爭對手，我願意徹底放棄我對彈性工時與遠距辦公的堅持，無條件配合團隊最高密度的集中作業。", catA: "PC", catB: "AU" },
				{ id: "C-PCAU-03", text: "只要專案目標極具野心且能證明我反轉逆境的實力，我完全可以忍受在極度僵化的指揮體系下運作，並捨棄用我自己喜歡的方式做事的權利。", catA: "PC", catB: "AU" },

				// [矩陣 50] 服務 (S) vs. 創業 (EC) -> 同意代表保衛 S，放棄 EC
				{ id: "C-SEC-01", text: "我認為衡量事業成功的最終標準是這個項目實質改變了多少弱勢群體的生命。若只是一味追求龐大的商業估值與盈餘數字，對我來說毫無意義。", catA: "S", catB: "EC" },

				{ id: "C-SSLS-03", text: "為了換取在企業內不被裁員的安全感，我願意將原本用來投資私人興趣與發展多元成長的時間，全數轉為準備能保住飯碗的內部枯燥考核。", catA: "SS", catB: "LS" },

				// [矩陣 53] 專業 (TF) vs. 管理 (GM) -> 同意代表保衛 TF，放棄 GM

				{ id: "C-TFGM2-02", text: "我極度渴望親自解決一個棘手的實務難題。如果職務要求我只能坐在辦公室裡協調不同部門之間的利益分配，我會覺得這項晉升毫無價值。", catA: "TF", catB: "GM" },
				{ id: "C-TFGM2-03", text: "對我來說，獲得該領域最高殿堂的專業評價與技術認證，其意義遠遠超過在公司組織圖上獲得高階的行政職稱與統籌龐大預算的實質權力。", catA: "TF", catB: "GM" },
				{ id: "C-TFGM2-04", text: "只要能讓我全心全意專注於實務細節的精進，我寧可一輩子做個缺乏行政指揮權的基層專家，也不願轉向僅負責資源盤點與績效匯報的管理職。", catA: "TF", catB: "GM" },

				// [矩陣 54] 自主 (AU) vs. 生活 (LS) -> 同意代表保衛 AU，放棄 LS
				{ id: "C-AULS-01", text: "為了換取能夠完全不受干涉、自由決定作業節奏的遠距專案，我願意接受這份工作可能需要在週末或深夜隨時趕工，破壞我規律的生活作息。", catA: "AU", catB: "LS" },
				{ id: "C-AULS-02", text: "對我來說，作業過程完全不受主管微觀管理的絕對自由感，其重要性遠遠高於確保每週能擁有完整且不會被工作打斷的家庭假期。", catA: "AU", catB: "LS" },
				{ id: "C-AULS-03", text: "只要能讓我在我想工作的時候才工作，我毫不介意這份接案合約無法提供任何休假保障，甚至會大幅壓縮我發展個人業餘愛好的時間。", catA: "AU", catB: "LS" },
				{ id: "C-AULS-04", text: "自由安排工作節奏是我職涯的核心靈魂。為了保有不受體制約束的特權，我完全可以放棄追求傳統意義上工作與私人生活時間的完美平衡。", catA: "AU", catB: "LS" },

				// [矩陣 55] 挑戰 (PC) vs. 服務 (S) -> 同意代表保衛 PC，放棄 S
				{ id: "C-PCS-01", text: "面對實力懸殊的市場對戰時，我內心渴望以壓倒性的實力徹底贏過對方。即使這種趕盡殺絕的手段在道德上顯得不夠寬厚，我也毫不在乎。", catA: "PC", catB: "S" },
				{ id: "C-PCS-02", text: "我追求的是解決前人未解之謎與戰勝強大阻礙的極致爽快感。這種對勝利的渴望比溫暖的慈悲心或照顧弱勢，更能激發我無限的工作潛能。", catA: "PC", catB: "S" },
				{ id: "C-PCS-03", text: "在高壓嚴苛的極限環境下，我唯一看重的是團隊是否能存活並贏得最終戰役，而非花時間確保每一個基層成員的情緒都感到被溫柔對待。", catA: "PC", catB: "S" },
				{ id: "C-PCS-04", text: "為了攻克一個極具指標意義的高難度難題，我願意採取任何高壓且冷酷的手段逼迫團隊前進，即使這會嚴重損害同仁的心理健康或破壞團隊和諧。", catA: "PC", catB: "S" },

				// [矩陣 56] 管理 (GM) vs. 專業 (TF) -> 同意代表保衛 GM，放棄 TF
				{ id: "C-GMTF2-01", text: "身為營運管理者，我只在乎如何整合出最合適的人才團隊來完成專案。至於我自己是否懂那些深奧的實務細節或能否成為專家，我根本不在意。", catA: "GM", catB: "TF" },
				{ id: "C-GMTF2-02", text: "只要我建立的管理與回報機制足夠穩健，我完全能接受在不懂任何底層技術原理的情況下，直接對整個專業部門下達攸關成敗的商業決策。", catA: "GM", catB: "TF" },
				{ id: "C-GMTF2-03", text: "我職涯的最終目標是建立一套能自動運轉、創造規模化獲利的企業系統，而非讓自己深陷於實務操作中，成為某個領域不可替代的技術核心。", catA: "GM", catB: "TF" },
				{ id: "C-GMTF2-04", text: "我衡量一切專業知識與技術的唯一標準，在於它能否立刻解決營運痛點並提升組織財務績效。若無法達成此目標，該學理再深奧也毫無價值。", catA: "GM", catB: "TF" }
        ]
    };
		// 幫手函式：打亂陣列
        const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);

        function App() {
            const DEBUG_MODE = false;

            const [step, setStep] = useState("welcome");
            const [qIndex, setQIndex] = useState(1);
            
            const [affinity, setAffinity] = useState({ TF: 0, GM: 0, AU: 0, SS: 0, EC: 0, S: 0, PC: 0, LS: 0 });
            const [priority, setPriority] = useState({ TF: 0, GM: 0, AU: 0, SS: 0, EC: 0, S: 0, PC: 0, LS: 0 });
            const [tensions, setTensions] = useState([]); 

            const [tIo, setTIo] = useState(0);
            const [muT, setMuT] = useState(0);
            const [sigmaT, setSigmaT] = useState(0.1);
            const [history, setHistory] = useState([]);
            const [currentQ, setCurrentQ] = useState(null);
            const [copySuccess, setCopySuccess] = useState(false);

            const decksRef = useRef({});
            const matrixUsedRef = useRef(new Set());
            const calibDeckRef = useRef([]);
            const p2OrderRef = useRef([]);
            const startTimeRef = useRef(0);
            
            // v4.4: 追蹤 Matrix 方向平衡
            const directionStatsRef = useRef({}); 

            // --- 幫手函式 ---
            const calculateExpectedRT = (text) => {
                const charCount = text.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, "").length; 
                return 3.0 + (charCount / 9.0);
            };

            // v4.4: Canonical Direction (正規化方向)
            const getCanonicalPair = (catA, catB) => {
                const [cat1, cat2] = [catA, catB].sort();
                return { pairId: `${cat1}-${cat2}`, cat1, cat2 };
            };
            const toCanonicalDelta = (q, sNorm, cat1, cat2) => {
                if (q.catA === cat1 && q.catB === cat2) return sNorm;
                if (q.catA === cat2 && q.catB === cat1) return -sNorm;
                return 0;
            };

            const getCombinedScore = (currAffinity, currPriority) => {
                let combined = {};
                Object.keys(currAffinity).forEach(k => {
                    combined[k] = currAffinity[k] + currPriority[k];
                });
                return combined;
            };

            const initEngine = () => {
                const newDecks = {};
                Object.keys(QB.phase2).forEach(cat => {
                    newDecks[cat] = shuffleArray(QB.phase2[cat]);
                });
                decksRef.current = newDecks;
                matrixUsedRef.current.clear();
                directionStatsRef.current = {};
                
                calibDeckRef.current = shuffleArray(QB.phase1);
                p2OrderRef.current = shuffleArray([
                    "TF", "GM", "AU", "SS", "EC", "S", "PC", "LS", 
                    "TF", "GM", "AU", "SS", "EC", "S", "PC", "LS", 
                    "TF", "GM", "AU", "SS", "EC", "S", "PC", "LS"
                ]);
            };

            // --- v4.4 智慧適應性抽題 (CAT Routing) ---
            const drawNextQuestion = (nextIndex, currAffinity, currPriority, currTensions) => {
                let nextQ = null;
                const combinedScore = getCombinedScore(currAffinity, currPriority);

                if (nextIndex <= 2) {
                    nextQ = calibDeckRef.current.pop();
                } else if (nextIndex <= 26) {
                    const cat = p2OrderRef.current[nextIndex - 3];
                    if (decksRef.current[cat].length === 0) decksRef.current[cat] = shuffleArray(QB.phase2[cat]);
                    nextQ = { ...decksRef.current[cat].pop(), type: "normal", cat };
                } else {
                    let targetPair = null;

                    // 1. v4.4: 找出「最值得追問」的矛盾 (綜合分數高且未解決)
                    const unresolved = currTensions
                        .filter(t => t.status === "open" || t.status === "insufficient")
                        .map(t => ({
                            ...t,
                            importance: (combinedScore[t.cat1] + combinedScore[t.cat2]) + (t.slowMidCount * 0.5)
                        }))
                        .sort((a, b) => b.importance - a.importance);

                    if (unresolved.length > 0) {
                        targetPair = [unresolved[0].cat1, unresolved[0].cat2];
                    } else {
                        // 2. 退回測量綜合高分群的戰場
                        const sorted = Object.entries(combinedScore).sort((a, b) => b[1] - a[1]);
                        const candidatePairs = [
                            [sorted[0][0], sorted[1][0]], [sorted[1][0], sorted[2][0]], [sorted[0][0], sorted[2][0]]  
                        ];
                        let minGap = Infinity;
                        targetPair = candidatePairs[0];
                        candidatePairs.forEach(pair => {
                            const gap = Math.abs(combinedScore[pair[0]] - combinedScore[pair[1]]);
                            if (gap < minGap) { minGap = gap; targetPair = pair; }
                        });
                    }

                    // v4.4: 加入方向平衡機制 (Direction Balancing)
                    const { pairId, cat1, cat2 } = getCanonicalPair(targetPair[0], targetPair[1]);
                    const stats = directionStatsRef.current[pairId] || { forward: 0, backward: 0 };
                    
                    let validMatrices = QB.matrices.filter(m => 
                        ((m.catA === cat1 && m.catB === cat2) || (m.catA === cat2 && m.catB === cat1)) &&
                        !matrixUsedRef.current.has(m.id)
                    );

                    if (validMatrices.length > 0) {
                        // 優先挑選出現較少的方向
                        const preferredDirection = stats.forward > stats.backward ? 'backward' : (stats.backward > stats.forward ? 'forward' : 'any');
                        let preferredPool = validMatrices;
                        
                        if (preferredDirection === 'forward') preferredPool = validMatrices.filter(m => m.catA === cat1);
                        else if (preferredDirection === 'backward') preferredPool = validMatrices.filter(m => m.catA === cat2);
                        
                        const poolToUse = preferredPool.length > 0 ? preferredPool : validMatrices;
                        nextQ = { ...shuffleArray(poolToUse)[0], type: "matrix" };
                        
                        // 紀錄本次方向
                        matrixUsedRef.current.add(nextQ.id);
                        if (nextQ.catA === cat1) stats.forward += 1; else stats.backward += 1;
                        directionStatsRef.current[pairId] = stats;
                        
                    } else {
                        const fallbackCat = targetPair[0];
                        if (decksRef.current[fallbackCat].length === 0) decksRef.current[fallbackCat] = shuffleArray(QB.phase2[fallbackCat]);
                        nextQ = { ...decksRef.current[fallbackCat].pop(), type: "normal", cat: fallbackCat };
                    }
                }
                setCurrentQ(nextQ);
                startTimeRef.current = Date.now();
            };

            const startTest = () => {
                initEngine();
                setStep("testing");
                setQIndex(1);
                setHistory([]); setTensions([]);
                const emptyState = { TF: 0, GM: 0, AU: 0, SS: 0, EC: 0, S: 0, PC: 0, LS: 0 };
                setAffinity(emptyState); setPriority(emptyState);
                setTIo(0); setMuT(0); setSigmaT(0.1);
                drawNextQuestion(1, emptyState, emptyState, []);
            };

            // --- v4.4 分層計分與正規化張力機推演 ---
            const handleAnswer = (score) => {
                const timeCost = (Date.now() - startTimeRef.current) / 1000;
                
                if (qIndex <= 2 && score !== currentQ.expected) {
                    alert(`【系統校準提示】\n您的點選與指示不符。請放鬆心情，依照文字指示點選即可。`);
                    startTimeRef.current = Date.now(); return;
                }
                
                let isDelayed = false;
                let rtRatio = 1.0;
                let netTimeCost = timeCost;
                const expectedRT = currentQ ? calculateExpectedRT(currentQ.text) : 3.0;
                
                if (qIndex > 2) {
                    netTimeCost = Math.max(0.1, timeCost - tIo);
                    rtRatio = netTimeCost / expectedRT;
                    if (rtRatio > 1.4) {
                        isDelayed = true;
                        if (DEBUG_MODE) alert(`[Debug] 預期 ${expectedRT.toFixed(1)}s，花費 ${netTimeCost.toFixed(1)}s (Ratio: ${rtRatio.toFixed(2)})，標記為張力信號。`);
                    }
                }

                let nextAffinity = { ...affinity };
                let nextPriority = { ...priority };
                let nextTensions = [...tensions];

                if (qIndex <= 2) {
                    if (qIndex === 2) {
                        const prevTimeCost = history.length > 0 ? history[0].timeCost : timeCost;
                        setTIo((prevTimeCost + timeCost) / 2.0);
                    }
                } else {
                    if (qIndex <= 26) {
                        let addedScore = score <= 3 ? 0 : (score - 3);
                        nextAffinity[currentQ.cat] += addedScore; 
                        
                        // v4.4 Bug 修復：正確讀取 netTimeCost
                        if (qIndex === 26) {
                            const p2Times = [...history.filter(h => h.id > 2).map(h => h.netTimeCost), netTimeCost];
                            const m = p2Times.reduce((a, b) => a + b, 0) / 24;
                            const s = Math.sqrt(p2Times.reduce((a, b) => a + Math.pow(b - m, 2), 0) / 24) || 0.1;
                            setMuT(m); setSigmaT(s);
                        }
                    } else {
                        const sNorm = (score - 3.5) / 2.5; 

                        if (currentQ.type === "matrix") {
                            const { pairId, cat1, cat2 } = getCanonicalPair(currentQ.catA, currentQ.catB);
                            const canonicalDelta = toCanonicalDelta(currentQ, sNorm, cat1, cat2);

                            let tensionObj = nextTensions.find(t => t.pairId === pairId);
                            if (!tensionObj) {
                                tensionObj = { 
                                    pairId, cat1, cat2, 
                                    evidenceCount: 0, slowMidCount: 0, directionSum: 0, 
                                    directionHistory: [], status: "insufficient", evidence: [] 
                                };
                                nextTensions.push(tensionObj);
                            }

                            tensionObj.evidenceCount += 1;
                            tensionObj.evidence.push({ qId: currentQ.id, score, rtRatio, isDelayed, canonicalDelta });
                            tensionObj.directionSum += canonicalDelta;
                            tensionObj.directionHistory.push(canonicalDelta);

                            if ((score === 3 || score === 4) && isDelayed) tensionObj.slowMidCount += 1;

                            // v4.4: 更嚴謹的矛盾判定
                            const absDirections = tensionObj.directionHistory.map(Math.abs);
                            const decisiveCount = absDirections.filter(v => v >= 0.6).length;
                            const positive = tensionObj.directionHistory.filter(v => v > 0).length;
                            const negative = tensionObj.directionHistory.filter(v => v < 0).length;
                            const directionConsistency = Math.max(positive, negative) / tensionObj.directionHistory.length;

                            if (tensionObj.evidenceCount < 2) {
                                tensionObj.status = "insufficient";
                            } else if (tensionObj.slowMidCount >= 2 && Math.abs(tensionObj.directionSum) < 0.8) {
                                tensionObj.status = "stable_tension"; 
                            } else if (decisiveCount >= 2 && directionConsistency >= 0.75 && Math.abs(tensionObj.directionSum) >= 1.2) {
                                tensionObj.status = "resolved"; 
                            } else {
                                tensionObj.status = "open"; 
                            }

                            nextPriority[currentQ.catA] += (1.5 * sNorm);
                            nextPriority[currentQ.catB] -= (1.5 * sNorm);
                        } else { 
                            nextAffinity[currentQ.cat] += (score <= 3 ? 0 : score - 3); 
                        }
                    }
                }

                setHistory([...history, { id: qIndex, qId: currentQ.id, timeCost, netTimeCost, rtRatio, score, isDelayed }]);
                setAffinity(nextAffinity); setPriority(nextPriority); setTensions(nextTensions);

                if (qIndex >= 40) setStep("results"); 
                else { 
                    const nextIndex = qIndex + 1;
                    setQIndex(nextIndex);
                    drawNextQuestion(nextIndex, nextAffinity, nextPriority, nextTensions);
                }
            };

            // --- v4.4 職涯輪廓 Interpretation Frame 輸出 ---
            const generateInterpretationFrame = () => {
                const combinedScore = getCombinedScore(affinity, priority);
                const avgAffinity = Object.values(affinity).reduce((a,b)=>a+b,0) / 8;
                const avgPriority = Object.values(priority).reduce((a,b)=>a+b,0) / 8;

                const coreAnchors = [];
                const desiredAnchors = [];
                const protectedAnchors = [];
                const stableTensionPairs = tensions.filter(t => t.status === "stable_tension").map(t => t.pairId);

                Object.keys(ANCHORS).forEach(cat => {
                    const isHighAffinity = affinity[cat] > avgAffinity;
                    const isHighPriority = priority[cat] > avgPriority;
                    const inTension = stableTensionPairs.some(p => p.includes(cat));

                    if (isHighAffinity && isHighPriority && !inTension) coreAnchors.push(cat);
                    else if (isHighAffinity && !isHighPriority) desiredAnchors.push(cat);
                    else if (!isHighAffinity && isHighPriority) protectedAnchors.push(cat);
                });

                return { coreAnchors, desiredAnchors, protectedAnchors, combinedScore };
            };

			// --- v4.4 精簡版：純資料輸出 (交由 Gemini Gem 解析) ---
            const handleCopyResults = () => {
                const now = new Date();
                const timeStr = now.toLocaleString('zh-TW', { hour12: false });
                const { coreAnchors, desiredAnchors, protectedAnchors, combinedScore } = generateInterpretationFrame();

                const textToCopy = `【Career Anchor Inference Engine v4.4 Internal Data】

				[Version]
				appVersion: v4.4
				modelVersion: APT-Canonical-2026
				timestamp: ${timeStr}

				[InterpretationFrame]
				Core: ${coreAnchors.length ? coreAnchors.join(', ') : 'None'}
				Desired: ${desiredAnchors.length ? desiredAnchors.join(', ') : 'None'}
				Protected: ${protectedAnchors.length ? protectedAnchors.join(', ') : 'None'}

				[Affinity]
				${Object.entries(affinity).sort((a,b)=>b[1]-a[1]).map(([k,v])=> `${k}: ${v.toFixed(2)}`).join('\n')}

				[Priority]
				${Object.entries(priority).sort((a,b)=>b[1]-a[1]).map(([k,v])=> `${k}: ${v.toFixed(2)}`).join('\n')}

				[TensionPairs]
				${tensions.length === 0 ? "None" : tensions.map(t => `${t.pairId}: status=${t.status}, dirSum=${t.directionSum.toFixed(2)}, slowMid=${t.slowMidCount}`).join('\n')}

				[RTSummary]
				calibrationTIo: ${tIo.toFixed(2)}s
				normalAvgRT: ${muT.toFixed(2)}s
				delayedItems: ${history.filter(h=>h.isDelayed).length}`;
								
								navigator.clipboard.writeText(textToCopy).then(() => {
									setCopySuccess(true); setTimeout(() => setCopySuccess(false), 2500);
                });
            };

            // --- 畫面渲染 ---
            const { combinedScore, coreAnchors, desiredAnchors, protectedAnchors } = step === "results" ? generateInterpretationFrame() : { combinedScore: getCombinedScore(affinity, priority) };
            const sortedResults = Object.entries(combinedScore).sort((a, b) => b[1] - a[1]);
            const maxCombinedScore = sortedResults.length > 0 ? sortedResults[0][1] : 5;
            const radarData = Object.entries(combinedScore).map(([k, v]) => ({ subject: ANCHORS[k].name, A: v }));
            const topAnchors = sortedResults.slice(0, 3);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <header className="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 w-8 h-8 rounded flex items-center justify-center text-white font-bold">A</div>
                            <div>
                                <h1 className="font-bold text-slate-800 uppercase tracking-tight text-sm">Career Anchor Inference Engine</h1>
                                <p className="text-[10px] text-slate-400 font-black uppercase">v4.4 Final Build</p>
                            </div>
                        </div>
                        <div className="text-right text-[10px] font-mono text-slate-400">
                            {DEBUG_MODE ? `tIo: ${tIo.toFixed(1)}s` : 'CALIBRATED'}
                        </div>
                    </header>

                    <main className="flex-1 overflow-auto p-4 sm:p-6">
                        {step === "welcome" && (
                            <div className="max-w-4xl mx-auto py-20 flex flex-col items-center text-center">
                                <h2 className="text-4xl font-black text-slate-900 mb-6 tracking-tighter">職涯輪廓推理引擎</h2>
                                <p className="text-slate-500 max-w-xl mb-6 leading-relaxed">
                                    本系統透過機會成本抉擇與時間訊號追蹤，深入解析您的「核心渴望」、「真實取捨」與「價值張力」。
                                </p>
                                <button onClick={startTest} className="bg-slate-900 px-12 py-5 rounded-2xl text-white font-bold text-lg hover:scale-105 transition-all shadow-xl">
                                    啟動推理 START
                                </button>
                            </div>
                        )}

                        {step === "testing" && currentQ && (
                            <div className="max-w-6xl mx-auto flex flex-col lg:flex-row gap-6 animate-in slide-in-from-bottom-4">
                                <div className="flex-[3] bg-white rounded-3xl p-6 sm:p-10 border shadow-sm mx-auto w-full lg:max-w-3xl">
                                    <div className="flex justify-between items-center mb-10">
                                        <div className="flex gap-2">
                                            {DEBUG_MODE && <span className="bg-slate-100 px-2 py-1 rounded text-[10px] font-mono font-black text-slate-500">{currentQ.id}</span>}
                                            <span className="text-[10px] font-black text-slate-300 uppercase self-center">Prog: {qIndex}/40</span>
                                        </div>
                                        <button onClick={() => window.confirm("確定重置？") && setStep("welcome")} className="text-[10px] bg-slate-50 text-slate-400 px-3 py-1 rounded-full hover:bg-rose-50 hover:text-rose-500 font-bold transition-all">
                                            ⟳ 終止並重置
                                        </button>
                                    </div>
                                    <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-12 min-h-[80px] leading-snug">{currentQ.text}</h2>
									<div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                                        {[
                                            { score: 1, label: "最不符合" },
                                            { score: 2, label: "不符合" },
                                            { score: 3, label: "較不符合" },
                                            { score: 4, label: "較符合" },
                                            { score: 5, label: "符合" },
                                            { score: 6, label: "最符合" }
                                        ].map(item => (
                                            <button key={item.score} onClick={() => handleAnswer(item.score)} className="h-20 sm:h-28 border-2 rounded-2xl hover:border-indigo-600 hover:bg-indigo-50 font-black text-xl text-slate-300 hover:text-indigo-600 transition-all flex flex-col items-center justify-center gap-1">
                                                {item.score} <div className="text-[10px] sm:text-xs uppercase opacity-80 font-bold">{item.label}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === "results" && (
                            <div className="max-w-4xl mx-auto bg-white p-6 sm:p-12 rounded-[2.5rem] shadow-sm border animate-in zoom-in-95 duration-700">
                                <h2 className="text-3xl font-black mb-10 text-center tracking-tight">職涯輪廓推理解析</h2>
                                <div className="w-full flex justify-center mb-12 bg-slate-50 rounded-3xl py-8">
                                    <RadarChart data={radarData} maxScore={maxCombinedScore} />
                                </div>

                                {/* v4.4 新增：職涯輪廓句 */}
                                <div className="bg-indigo-50 border-l-4 border-indigo-600 p-6 rounded-r-2xl mb-8 space-y-3">
                                    <h3 className="text-sm font-black text-indigo-900 uppercase">暫定職涯輪廓摘要</h3>
                                    <p className="text-slate-700 text-sm leading-relaxed">
                                        您傾向追求 <strong className="text-indigo-700">{coreAnchors.length > 0 ? coreAnchors.map(c=>ANCHORS[c].name).join(' 與 ') : '多元價值'}</strong> 作為職涯核心。
                                        {desiredAnchors.length > 0 && <span> 雖然受到 <span className="text-slate-500">{desiredAnchors.map(c=>ANCHORS[c].name).join('、')}</span> 的吸引，但在極端情境下可能選擇妥協。</span>}
                                        {tensions.filter(t=>t.status==="stable_tension").length > 0 && <span className="text-rose-600 font-bold">目前系統偵測到您的價值觀存在深層拉扯，建議將數據交由 AI 進行深度解析。</span>}
                                    </p>
                                </div>

                                <div className="bg-white p-8 rounded-3xl border-2 border-slate-100 text-left space-y-6">
                                    <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest">系統結構化數據與 AI 解析</h3>
                                        <button onClick={handleCopyResults} className={`text-xs px-4 py-2 rounded-xl font-bold transition-all shadow-sm ${copySuccess ? 'bg-emerald-500 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                                            {copySuccess ? '✓ 已成功複製' : '📋 複製 Interpretation 框架'}
                                        </button>
                                    </div>
                                    <div className="mt-2 bg-slate-800 rounded-2xl p-6 text-white text-center space-y-4 shadow-inner">
                                        <h4 className="text-lg font-black text-amber-400 flex justify-center items-center gap-2">
                                            <span>✨</span> 獲取 AI 深度輪廓解析
                                        </h4>
                                        <p className="text-sm text-slate-300 max-w-md mx-auto leading-relaxed">
                                            請點擊上方「<strong className="text-white">📋 複製 Interpretation 框架</strong>」，前往專屬的 Gemini 助理貼上，它將依據此框架為您生成最精準的職涯輪廓報告！
                                        </p>
                                        <a 
                                            href="https://gemini.google.com/gem/15P_iNv1Jo_aqojAgcz1LlL3chFi7dSoY?usp=sharing" 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="inline-block mt-2 bg-amber-500 text-slate-900 font-black px-8 py-3 rounded-xl hover:bg-amber-400 hover:scale-105 transition-all shadow-lg"
                                        >
                                            前往 Gemini 貼上分析 ↗
                                        </a>
                                    </div>
                                </div>

                                <button onClick={() => setStep("welcome")} className="mt-12 w-full py-4 text-slate-400 font-bold text-xs uppercase tracking-widest hover:text-slate-600 transition-all">
                                    — 結束並返回首頁 Return to Home —
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
