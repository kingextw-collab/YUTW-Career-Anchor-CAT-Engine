        const RadarChart = ({ data }) => {
            const size = 400; const center = size / 2; const radius = size * 0.35;
            const maxVal = 10;
            const points = data.map((d, i) => {
                const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                const normalized = Math.max(0, Math.min(d.A / maxVal, 1));
                return {
                    x: center + radius * normalized * Math.cos(angle),
                    y: center + radius * normalized * Math.sin(angle),
                    labelX: center + (radius + 40) * Math.cos(angle),
                    labelY: center + (radius + 40) * Math.sin(angle),
                    subject: d.subject
                };
            });
            const polygonPoints = points.map(p => `${p.x},${p.y}`).join(' ');
            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="w-full h-full max-h-[400px]">
                    {[1, 2, 3, 4].map(level => {
                        const r = radius * (level / 4);
                        const pts = data.map((_, i) => {
                            const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                            return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
                        }).join(' ');
                        return <polygon key={`grid-${level}`} points={pts} fill="none" stroke="#e2e8f0" strokeWidth="1" />;
                    })}
                    {data.map((_, i) => {
                        const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                        return <line key={`axis-${i}`} x1={center} y1={center} x2={center + radius * Math.cos(angle)} y2={center + radius * Math.sin(angle)} stroke="#e2e8f0" strokeWidth="1" />;
                    })}
                    <polygon points={polygonPoints} fill="#4f46e5" fillOpacity="0.2" stroke="#4f46e5" strokeWidth="3" />
                    {points.map((p, i) => <circle key={`dot-${i}`} cx={p.x} cy={p.y} r="4" fill="#4f46e5" />)}
                    {points.map((p, i) => (
                        <text key={`label-${i}`} x={p.labelX} y={p.labelY} fill="#64748b" fontSize="11" fontWeight="700" textAnchor="middle" dominantBaseline="middle">
                            {p.subject}
                        </text>
                    ))}
                </svg>
            );
        };

                    { id: "LS-05", text: "如果工作壓力導致我無法享受高品質的個人愛好，我會主動重新評估職涯發展。" },
                    { id: "LS-06", text: "對我而言，能自由支配下班後的時間來發展興趣，比在職場晉升更具吸引力。" },
                    { id: "LS-07", text: "我絕不允許工作上的聯繫或突發事件，在休假期間打斷我與親友的相處。" },
                    { id: "LS-08", text: "成功的職涯定義在於達到「生活與工作的完美平衡」，而非無止盡追求職位成就。" },
					{ id: "LS-09", text: "如果一個高薪職位要求我必須長期外派或頻繁出差，我會因為其對生活品質的破壞而拒絕。" },
					{ id: "LS-10", text: "我習慣在行事曆上優先排定家庭聚會與私人活動，然後才填入工作時程。" },
					{ id: "LS-11", text: "我對成功的定義是：在職場上表現稱職，同時擁有足夠的體力與心情享受業餘生活。" },
					{ id: "LS-12", text: "我高度認同公司應該全面支援員工的心理健康，並尊重每個人在非辦公時間的「斷網權」。" }
                ]
            },
			matrices: [
                // [矩陣 01] 專業 (TF) vs. 管理 (GM)
                { id: "C-TFGM-01", text: "面對核心業務流程整併時，我傾向親自規劃內部的運算邏輯，而非計算長期的人事成本與跨部門溝通。", catA: "TF", catB: "GM" },
                { id: "C-TFGM-02", text: "當面臨關鍵業務模式變更時，我傾向親自驗證每個執行環節的正確性，而非授權他人並專注向高層報告。", catA: "TF", catB: "GM" },
                { id: "C-TFGM-03", text: "我寧願擔任掌握核心業務權威的專家，也不願擔任管理百人但不再接觸具體實務的主管。", catA: "TF", catB: "GM" },
                { id: "C-TFGM-04", text: "即使職位名稱不夠亮眼，只要能讓我維持在該領域的專業領先地位，我願意放棄進入管理決策層的機會。", catA: "TF", catB: "GM" },

                // [矩陣 02] 自主 (AU) vs. 穩定 (SS)
                { id: "C-AUSS-01", text: "我願意接受底薪較低且缺乏長期保障，但能完全自由決定工作方式與地點的任務。", catA: "AU", catB: "SS" },
                { id: "C-AUSS-02", text: "當公司導入嚴格的行為監控或打卡制度時，即便這份職位絕對穩定，我也會考慮離開。", catA: "AU", catB: "SS" },
                { id: "C-AUSS-03", text: "比起待在制度完善、升遷明確的大企業，我更想轉戰不受規範、收入隨成效波動的個人市場。", catA: "AU", catB: "SS" },
                { id: "C-AUSS-04", text: "我寧可承擔專案結案後的短期失業風險，也要換取在執行過程中不被公司行政體制干預的自由。", catA: "AU", catB: "SS" },

                // [矩陣 03] 挑戰 (PC) vs. 生活 (LS)
                { id: "C-PCLS-01", text: "為了解決極具難度的專業瓶頸，我願意在一段時間內大幅犧牲週末與私人的休假計畫。", catA: "PC", catB: "LS" },
                { id: "C-PCLS-02", text: "面對高風險且競爭激烈的專案，解決難題的刺激感會讓我不在乎私人休息時間的減少。", catA: "PC", catB: "LS" },
                { id: "C-PCLS-03", text: "即使家中已有安排好的重要休閒活動，只要工作出現極難攻克的危機，我會毫不猶豫取消行程。", catA: "PC", catB: "LS" },
                { id: "C-PCLS-04", text: "面對一個能改寫業界標竿的極限任務，我願意將個人年度旅遊計畫無限期延後，直到攻克難題為止。", catA: "PC", catB: "LS" },

                // [矩陣 04] 創業 (EC) vs. 穩定 (SS)
                { id: "C-ECSS-01", text: "我願意將積蓄投入一個可能失敗但充滿潛力的新計畫，而非用於確保穩定的退休準備。", catA: "EC", catB: "SS" },
                { id: "C-ECSS-02", text: "放棄大型組織中穩健的職位，去換取新事業中低底薪但高佔比的分配權，是我願意的選擇。", catA: "EC", catB: "SS" },
                { id: "C-ECSS-03", text: "發現具備潛力的市場機會時，我寧可冒著財務風險辭職開展事業，也不願為了固定薪資錯失先機。", catA: "EC", catB: "SS" },
                { id: "C-ECSS-04", text: "我追求的是能掌控事業成長帶來的爆發性收益，而非安穩領取受組織保護的固定退休金。", catA: "EC", catB: "SS" },

                // [矩陣 05] 管理 (GM) vs. 專業 (TF)
                { id: "C-GMTF-01", text: "進行預算盤點時，若終止我熱愛的專業研究能為組織帶來更大獲利，我會親手終止它。", catA: "GM", catB: "TF" },
                { id: "C-GMTF-02", text: "面對極端困難的操作障礙，我傾向採購外部現成方案來解決，而非自己花費大量時間鑽研原理。", catA: "GM", catB: "TF" },
                { id: "C-GMTF-03", text: "若某項深奧專業知識無法轉換為具體的業務產值，我就會要求團隊停止對它的探索。", catA: "GM", catB: "TF" },
                { id: "C-GMTF-04", text: "當專業部門的細節爭議影響到組織的營運時效時，我會跳過技術辯論，直接下達基於商業利益的決定。", catA: "GM", catB: "TF" },

                // [矩陣 06] 服務 (S) vs. 挑戰 (PC)
                { id: "C-SPC-01", text: "當團隊面臨高壓任務時，我會花更多時間安撫與協助心理壓力大的成員，而非只追求個人的挑戰成就。", catA: "S", catB: "PC" },
                { id: "C-SPC-02", text: "即使一份工作充滿挑戰與競爭樂趣，但若其核心邏輯會傷害大眾福祉，我會堅決拒絕。", catA: "S", catB: "PC" },
                { id: "C-SPC-03", text: "在極度困難的決策關頭，我寧可犧牲專案的短期勝利，也不願做出犧牲基層成員權益的冷酷決定。", catA: "S", catB: "PC" },
                { id: "C-SPC-04", text: "即使一份專案的挑戰性極高、能讓我大顯身手，但若其執行過程會損害合作夥伴的權益，我寧可放棄該計畫。", catA: "S", catB: "PC" },

                // [矩陣 07] 生活 (LS) vs. 專業 (TF)
                { id: "C-LSTF-01", text: "當進階專業培訓撞期我策劃已久的家庭海外旅行時，我會選擇放棄該次培訓。", catA: "LS", catB: "TF" },
                { id: "C-LSTF-02", text: "若成為頂尖人才意味著必須 24 小時隨時處理危機，我寧可做個準時下班的普通員工。", catA: "LS", catB: "TF" },
                { id: "C-LSTF-03", text: "對我而言，利用下班時間經營個人生活嗜好，比研讀最新的專業文件更重要。", catA: "LS", catB: "TF" },
                { id: "C-LSTF-04", text: "如果一份工作要求我必須不斷壓縮個人進修與社交時間來鑽研專業細節，我會毫不猶豫地拒絕該工作。", catA: "LS", catB: "TF" },

                // [矩陣 08] 管理 (GM) vs. 自主 (AU)
                { id: "C-GMAU-01", text: "為了獲得指揮龐大團隊的權力，我可以忍受繁瑣的會議匯報與嚴格的層級規範。", catA: "GM", catB: "AU" },
                { id: "C-GMAU-02", text: "我願意犧牲決定工作步調的自由，來換取在組織圖上位居高處的絕對決策權。", catA: "GM", catB: "AU" },
                { id: "C-GMAU-03", text: "我不介意成為被體制運作束縛的推手，只要最終結果能證明我的營運策略是成功的。", catA: "GM", catB: "AU" },
                { id: "C-GMAU-04", text: "我願意接受嚴密的職權層級與會報制度，只要這套體制能賦予我指揮大規模資源的影響力。", catA: "GM", catB: "AU" },

                // [矩陣 09] 專業 (TF) vs. 自主 (AU)
                { id: "C-TFAU-01", text: "我願意嚴格遵循專業規範以確保產出完全合規，而非為了個人作業方便而自行簡化流程。", catA: "TF", catB: "AU" },
                { id: "C-TFAU-02", text: "面對複雜的處理程序，我會堅持按照官方標準指引執行，而非使用缺乏驗證的偏門方法繞過。", catA: "TF", catB: "AU" },
                { id: "C-TFAU-03", text: "我更看重任務是否在專業品質上達到業界最高標準，而非這份工作是否允許我自由安排時間。", catA: "TF", catB: "AU" },
                { id: "C-TFAU-04", text: "我認為遵循業界公認的「最佳實踐方法」比「隨心所欲的個人化風格」更具備專業價值。", catA: "TF", catB: "AU" },

                // [矩陣 10] 管理 (GM) vs. 服務 (S)
                { id: "C-GMS-01", text: "當資源有限時，我能為了組織整體獲利而縮減成本，即便這會大幅增加第一線同事的工作負擔。", catA: "GM", catB: "S" },
                { id: "C-GMS-02", text: "我更傾向擔任掌控預算與績效的計畫負責人，而非親自去關懷並協助每位同事的心理健康。", catA: "GM", catB: "S" },
                { id: "C-GMS-03", text: "我認為職業生涯最大的價值在於具備權衡各方利益的談判手腕，而非成為同事傾訴苦水的心靈導師。", catA: "GM", catB: "S" },
                { id: "C-GMS-04", text: "在評估部門績效時，我會將財務產出置於員工的情緒滿意度之上，因為這才是管理者的職責。", catA: "GM", catB: "S" },

                // [矩陣 11] 創業 (EC) vs. 生活 (LS)
                { id: "C-ECLS-01", text: "若有機會擴大我的開創計畫，我願意在未來數年內犧牲絕大部分的休閒娛樂與私人假期。", catA: "EC", catB: "LS" },
                { id: "C-ECLS-02", text: "為了讓我主導的創新方案在市場上建立影響力，我不介意在私人行程中隨時中斷休息處理決策。", catA: "EC", catB: "LS" },
                { id: "C-ECLS-03", text: "下班後投入心力研發可變現的個人產品，比把時間花在安排高品質的感官體驗更有吸引力。", catA: "EC", catB: "LS" },
                { id: "C-ECLS-04", text: "我會利用大部分的私人深夜時間來研究開創性業務的可能性，而不僅僅是用於放鬆或娛樂。", catA: "EC", catB: "LS" },

                // [矩陣 12] 穩定 (SS) vs. 挑戰 (PC)
                { id: "C-SSPC-01", text: "我寧可留在有完整制度保障的傳統企業，也不願空降到極需處理嚴重危機的高壓新創組織。", catA: "SS", catB: "PC" },
                { id: "C-SSPC-02", text: "面對具備高度未知的關鍵任務，我寧願選擇維持穩健現狀，也不願追求那種極限博弈的快感。", catA: "SS", catB: "PC" },
                { id: "C-SSPC-03", text: "在面對市場大幅波動時，我偏好那些具備抗壓屬性、能穩定產出的既有項目。", catA: "SS", catB: "PC" },
                { id: "C-SSPC-04", text: "相比於在動盪中尋求突破，我更傾向於在一個制度健全、能為員工遮風避雨的環境中穩健成長。", catA: "SS", catB: "PC" },

                // [矩陣 13] 專業 (TF) vs. 挑戰 (PC)
                { id: "C-TFPC-01", text: "處理緊急狀況時，我傾向按部就班執行標準解決程序，而非享受在最後關頭憑靈光一現搶救的極限刺激。", catA: "TF", catB: "PC" },
                { id: "C-TFPC-02", text: "我寧願維護一套邏輯完美且極少出錯的作業系統，也不願接手一套需要不斷與突發狀況攻防的殘破計畫。", catA: "TF", catB: "PC" },
                { id: "C-TFPC-03", text: "專家的價值在於將危機預防於發生之前，而非成為每次災難發生時享受眾人目光的救火英雄。", catA: "TF", catB: "PC" },
                { id: "C-TFPC-04", text: "我更看重如何將流程優化到「完美且不會出錯」，而非享受在發生錯誤後進行即興搶救的英雄感。", catA: "TF", catB: "PC" },

                // [矩陣 14] 生活 (LS) vs. 管理 (GM)
                { id: "C-LSGM-01", text: "為了確保假期絕對不被打擾，我寧願在組織內做一個獨立貢獻者，也不願承接主管職務。", catA: "LS", catB: "GM" },
                { id: "C-LSGM-02", text: "若擔任統籌主管意味著長期無法準時回家陪伴家人，我會果斷放棄在高層展露頭角的機會。", catA: "LS", catB: "GM" },
                { id: "C-LSGM-03", text: "即使晉升能掌控更大資源，若會讓我徹底失去安靜獨處的私人時間，這種升遷就毫無意義。", catA: "LS", catB: "GM" },
                { id: "C-LSGM-04", text: "我拒絕那些隨時可能因緊急會議而打斷我與親友相處的工作，無論其管理權限有多吸引人。", catA: "LS", catB: "GM" },

                // [矩陣 15] 創業 (EC) vs. 專業 (TF)
                { id: "C-ECTF-01", text: "若我構思出一套極具價值的解決方案，我會立刻思考如何將其專利化或市場化，而非繼續鑽研細節優化。", catA: "EC", catB: "TF" },
                { id: "C-ECTF-02", text: "掌握最新知識的最大價值，在於利用它們建立新的獲利流程，而非成為該領域純粹的學術權威。", catA: "EC", catB: "TF" },
                { id: "C-ECTF-03", text: "我更願意將精力花在開發業務、建立品牌與尋求投資，並將核心執行工作交由專家處理。", catA: "EC", catB: "TF" },
                { id: "C-ECTF-04", text: "我渴望擁有一套由我主導的商業機制，至於這套機制背後的專業細節，我更傾向交給專才去負責。", catA: "EC", catB: "TF" },

                // [矩陣 16] 自主 (AU) vs. 管理 (GM)
                { id: "C-AUGM-01", text: "我寧可作為一個獨往獨來的獨立專業人員，也不願成為一個每天行程都被會議塞滿的行政主管。", catA: "AU", catB: "GM" },
                { id: "C-AUGM-02", text: "當專案遇到瓶頸時，比起召集各級部門開會，我更習慣把自己關起來獨立將問題攻克。", catA: "AU", catB: "GM" },
                { id: "C-AUGM-03", text: "如果我能對自己的工作內容擁有絕對決定權，即使我完全沒有任何下屬，我也會感到滿足。", catA: "AU", catB: "GM" },
                { id: "C-AUGM-04", text: "我寧可做一個獨立作業、不受節制的自由接案者，也不願成為一個需要協調各種人際衝突的行政主管。", catA: "AU", catB: "GM" },

                // [矩陣 17] 服務 (S) vs. 穩定 (SS)
                { id: "C-SSS-01", text: "若出現具備重大公益價值的專案，即使缺乏明確的晉升認列，我也願意放棄目前安穩的工作去投入。", catA: "S", catB: "SS" },
                { id: "C-SSS-02", text: "為了替團隊爭取公平權益或更好的環境，我願意得罪高層，甚至承擔失去工作的風險。", catA: "S", catB: "SS" },
                { id: "C-SSS-03", text: "一份能讓我安穩度日、下班準時的差事，如果對社會毫無實質正面幫助，那也只是缺乏靈魂的合約。", catA: "S", catB: "SS" },
                { id: "C-SSS-04", text: "一份能解決大眾痛點但薪資不穩的工作，對我的吸引力遠大於一份安穩平庸但對社會毫無貢獻的工作。", catA: "S", catB: "SS" },

                // [矩陣 18] 挑戰 (PC) vs. 創業 (EC)
                { id: "C-PCEC-01", text: "我更享受憑藉精準決策在市場波動中勝出的「純智力挑戰感」，而非將資產拿去經營具體的實體門市。", catA: "PC", catB: "EC" },
                { id: "C-PCEC-02", text: "我願意接手瀕臨破產的公司並將其扭虧為盈，純粹是為了證明我的拆彈能力，成功後我可能就會轉身離開。", catA: "PC", catB: "EC" },
                { id: "C-PCEC-03", text: "核心動力是「戰勝強敵」與「解決死結」，至於計畫是否最終由我擁權或掛名則是次要的。", catA: "PC", catB: "EC" },
                { id: "C-PCEC-04", text: "當我擊敗市場上的強大競爭者時，那種純粹的勝出感遠比我創辦了多少家公司更讓我興奮。", catA: "PC", catB: "EC" },

                // [矩陣 19] 穩定 (SS) vs. 自主 (AU)
                { id: "C-SSAU-01", text: "為了轉職到可以讓我自由安排生活節奏的遠距團隊，我願意放棄在傳統產業累積多年的優渥退休福利。", catA: "SS", catB: "AU" },
                { id: "C-SSAU-02", text: "我更傾向待在薪酬體系明確且抗風險的大公司，而非選擇模式完全自主但隨時可能斷糧的新創團隊。", catA: "SS", catB: "AU" },
                { id: "C-SSAU-03", text: "若組織強制要求所有人員回到固定地點辦公以換取不被裁員，我也會因為失去靈活性而選擇離開。", catA: "SS", catB: "AU" },
                { id: "C-SSAU-04", text: "我能接受受制於嚴格的上下班制度與組織規章，只要這能換取長期且明確的財務安全感。", catA: "SS", catB: "AU" },

                // [矩陣 20] 管理 (GM) vs. 創業 (EC)
                { id: "C-GMEC-01", text: "我更享受調動組織跨國資源的指揮權威感，而不是將這些經驗拿去成立自己的小型微創事業。", catA: "GM", catB: "EC" },
                { id: "C-GMEC-02", text: "推動全公司大規模轉型成功的成就感，遠大於我自己開發一套產品並將其商業變現。", catA: "GM", catB: "EC" },
                { id: "C-GMEC-03", text: "終極職涯目標是成為大型集團的營運負責人，而非成為由我獨資擁有的微型公司老闆。", catA: "GM", catB: "EC" },
                { id: "C-GMEC-04", text: "我更傾向在大型上市企業中攀上決策巔峰，而非在市場邊緣冒險去開創一家由我完全擁有的小公司。", catA: "GM", catB: "EC" },

                // [矩陣 21] 專業 (TF) vs. 服務 (S)
                { id: "C-TFS-01", text: "面對專業需求，我傾向研究如何用最嚴謹的方法來實現，而非親自去安撫並協助不熟悉流程的同事。", catA: "TF", catB: "S" },
                { id: "C-TFS-02", text: "面對核心邏輯的錯誤，我堅持徹底翻修，即便這會大幅延誤第一線處理客戶抱怨的時間。", catA: "TF", catB: "S" },
                { id: "C-TFS-03", text: "如果我的優化工具減少了作業時間，我的成就感來自「解決了複雜難題」，而非「改善了同事的工作負擔」。", catA: "TF", catB: "S" },
                { id: "C-TFS-04", text: "面對問題時，我更傾向於追究專業邏輯的對錯，而非優先考量如何照顧當事人的情緒感受。", catA: "TF", catB: "S" },

                // [矩陣 22] 生活 (LS) vs. 穩定 (SS)
                { id: "C-LSSS-01", text: "為了換取完全自主的長途旅行假期，我願意選擇薪水較低但保證不加班的工作，而非穩定隨時待命的高薪職務。", catA: "LS", catB: "SS" },
                { id: "C-LSSS-02", text: "我絕不會為了一份穩定高薪與退休保證，去接受一個會嚴重剝奪我陪伴家人時光的外派或出差職位。", catA: "LS", catB: "SS" },
                { id: "C-LSSS-03", text: "能在工作之餘保有精力經營個人社群或興趣，比在組織內謹小慎微地維持關係以保住職位更重要。", catA: "LS", catB: "SS" },
                { id: "C-LSSS-04", text: "我追求的是能隨時啟動長假、與家人整合的工作模式，而非為了保住穩定職位而不得不犧牲休假。", catA: "LS", catB: "SS" },

                // [矩陣 23] 自主 (AU) vs. 挑戰 (PC)
                { id: "C-AUPC-01", text: "我寧願選擇自由但步調平緩的常規工作，也不願加入一個執行極限任務但必須絕對服從指令的高壓團隊。", catA: "AU", catB: "PC" },
                { id: "C-AUPC-02", text: "若解決難題的前提是我必須密集進辦公室並接受頻繁進度審查，我會立刻失去解決該問題的興致。", catA: "AU", catB: "PC" },
                { id: "C-AUPC-03", text: "我職場上最渴望的是「沒有人能隨意干涉我的執行節奏」，而非不斷尋找更強大的對手來廝殺。", catA: "AU", catB: "PC" },
                { id: "C-AUPC-04", text: "如果一項挑戰要求我必須進入高壓、高密度的團隊中進行密集協作，我寧可放棄該挑戰以換取作業自由。", catA: "AU", catB: "PC" },

                // [矩陣 24] 創業 (EC) vs. 自主 (AU)
                { id: "C-ECAU-01", text: "為了經營事業能成功擴張規模，我願意每天應付各種繁瑣行政與外部談判，即便這會剝奪我的絕對自由。", catA: "EC", catB: "AU" },
                { id: "C-ECAU-02", text: "我承擔風險開創新事業是為了建立能持續獲利並具名聲的商業版圖，而非為了逃避管理制度。", catA: "EC", catB: "AU" },
                { id: "C-ECAU-03", text: "比起做個自由自在的個人顧問，我更渴望承擔風險成立團隊，即便這會讓我被職責緊緊綁住。", catA: "EC", catB: "AU" },
                { id: "C-ECAU-04", text: "我願意為了擴張我的開創版圖而犧牲個人的作息自由，因為建立事業體才是我的核心目標。", catA: "EC", catB: "AU" },

                // [矩陣 25] 穩定 (SS) vs. 專業 (TF)
                { id: "C-SSTF-01", text: "為了避免營運上的任何中斷，我寧可放棄嘗試最前衛的解決方案，建議維持目前的穩健模式。", catA: "SS", catB: "TF" },
                { id: "C-SSTF-02", text: "進行核心架構轉換時，比起使用高效但未經驗證的新工具，我更傾向使用緩慢但保證不出錯的標準化手法。", catA: "SS", catB: "TF" },
                { id: "C-SSTF-03", text: "職業的最高價值在於「提供組織絕對的安全感」，而非作為讓我實驗新穎專業理論的遊樂場。", catA: "SS", catB: "TF" },
                { id: "C-SSTF-04", text: "我認為維持組織運作的「絕對穩定性」其價值遠高於引入任何未經長期驗證的前衛專業理論。", catA: "SS", catB: "TF" },

                // [矩陣 26] 服務 (S) vs. 自主 (AU)
                { id: "C-SAU-01", text: "如果一個利他專案需要我每天駐點並嚴格配合群眾作息，我會欣然接受並放棄高度自由的工作狀態。", catA: "S", catB: "AU" },
                { id: "C-SAU-02", text: "我願意為了幫助陷入嚴重職涯瓶頸或心理困境的同事，而暫時放下我對「作業不受干擾」的堅持。", catA: "S", catB: "AU" },
                { id: "C-SAU-03", text: "當發現政策損害大多數基層成員利益時，我會主動帶頭倡議，即便這會讓我失去「自由做事」的特權。", catA: "S", catB: "AU" },
                { id: "C-SAU-04", text: "當我參與一項對團隊有益的互助計畫時，我願意接受該計畫中各種瑣碎的協作規則與限制。", catA: "S", catB: "AU" },

                // [矩陣 27] 挑戰 (PC) vs. 管理 (GM)
                { id: "C-PCGM-01", text: "我更享受憑藉一己之力在極限壓力下扭轉危機的刺激感，而非坐在辦公室裡指揮戰略與協調利益。", catA: "PC", catB: "GM" },
                { id: "C-PCGM-02", text: "當組織面臨存亡關鍵時，我渴望成為站在第一線進行攻防戰的部隊，而非幕後協調整體運作的總指揮。", catA: "PC", catB: "GM" },
                { id: "C-PCGM-03", text: "我寧願接手一個爛攤子來證明我反敗為勝的能力，也不願安穩地接班一個資源充足的大型部門職位。", catA: "PC", catB: "GM" },
                { id: "C-PCGM-04", text: "我享受那種在最前線與問題直接交鋒的生死決鬥感，而非坐在辦公室裡規劃複雜的人事戰略。", catA: "PC", catB: "GM" },

                // [矩陣 28] 生活 (LS) vs. 創業 (EC)
                { id: "C-LSEC-01", text: "如果擴大副業版圖意味著未來數年無法享受長途旅行或發展個人愛好，我會果斷放棄擴張，維持目前狀態。", catA: "LS", catB: "EC" },
                { id: "C-LSEC-02", text: "我絕不會為了將研發的產品推向市場，而將原先用來確保家人生活品質的緊急預備金全數投入。", catA: "LS", catB: "EC" },
                { id: "C-LSEC-03", text: "一份能穩定產出現金流、且絕對不佔用任何私人時間的資產組合，比可能成為獨角獸的新事業更具吸引力。", catA: "LS", catB: "EC" },
                { id: "C-LSEC-04", text: "我對於「成功的定義」在於生活與家庭的和諧，而非擁有多少具備市場價值的創業股權。", catA: "LS", catB: "EC" },

				// [矩陣 29] 服務 (S) vs. 專業 (TF)
                { id: "C-STF-01", text: "當作業流程頻繁出現不影響產出但令人困惑的小錯誤時，我會優先花時間製作教學指引安撫並幫助同仁理解，而不是鑽研下一個更深奧的核心模式。", catA: "S", catB: "TF" },
                { id: "C-STF-02", text: "看到其他部門的同事因為操作不順而感到嚴重挫折時，我寧願暫停手邊複雜的專案，花整個下午耐心指導對方，這比我獨自完成任務更有成就感。", catA: "S", catB: "TF" },
                { id: "C-STF-03", text: "在經營事業時，如果客戶反映流程不好用，我會優先考量使用者的需求，尋找最具人情味的處理方式，而不是導入一套效能頂尖但缺乏溫度的自動化系統。", catA: "S", catB: "TF" },
                { id: "C-STF-04", text: "我衡量專業能力的最重要標準在於它是否真的幫助到了同事，而非這項能力本身具備多高的專業門檻。", catA: "S", catB: "TF" },

                // [矩陣 30] 管理 (GM) vs. 穩定 (SS)
                { id: "C-GMSS-01", text: "雖然我在目前職位已經擁有十多年的資歷與絕對安穩，但只要組織願意將具備重大影響力的轉型計畫交給我統籌，我願意簽下「若失敗就負責離職」的高風險承諾。", catA: "GM", catB: "SS" },
                { id: "C-GMSS-02", text: "若能讓我擔任跨區域的業務統籌負責人，我完全不在乎這會讓我失去目前在總部享有的穩定工時與優渥的固定福利提撥。", catA: "GM", catB: "SS" },
                { id: "C-GMSS-03", text: "為了展現高階管理的決斷力與資源控制力，我敢於大刀闊斧地精簡重疊的部門編制，即使這會打破組織內部長期的和諧與穩定感。", catA: "GM", catB: "SS" },
                { id: "C-GMSS-04", text: "我渴望被賦予帶領組織轉型的權力，即使這意謂著我將不再享有傳統企業那種按部就班的安穩感。", catA: "GM", catB: "SS" },

                // [矩陣 31] 創業 (EC) vs. 挑戰 (PC)
                { id: "C-ECPC-01", text: "若我成功開發出一套具備複雜邏輯的新型作業模式，我接下來最大的渴望是將其品牌化或尋求商業變現，而不是繼續挑戰將其移植到更嚴苛的極限環境中。", catA: "EC", catB: "PC" },
                { id: "C-ECPC-02", text: "面對競爭激烈的市場，我設立的目標是建立一套能快速複製、獲利的商業模式，而不是把這裡當成挑戰研發「業界工法最複雜產品」的個人競技場。", catA: "EC", catB: "PC" },
                { id: "C-ECPC-03", text: "當外部環境震盪時，比起享受在極限波動中精準決策的對決快感，我更在乎這筆資源能否成為我下一次開展事業的啟動資本。", catA: "EC", catB: "PC" },
                { id: "C-ECPC-04", text: "當我成功建立一套可複製的獲利流程後，我就會考慮將其出售並開始下一個計畫，而非持續鑽研優化該流程。", catA: "EC", catB: "PC" },

                // [矩陣 32] 生活 (LS) vs. 自主 (AU)
                { id: "C-LSAU-01", text: "為了確保每個週末都能專心享受個人生活，我寧願接受一份主管會嚴格干涉我工作方法但「保證準時下班」的內勤，也不願選擇一份「自由但無固定下班時間」的顧問職。", catA: "LS", catB: "AU" },
                { id: "C-LSAU-02", text: "在度假期間，只要能讓我徹底斷網放鬆，我不介意組織要求我使用僵化的作業系統與死板的流程，而不是讓我自由發揮。", catA: "LS", catB: "AU" },
                { id: "C-LSAU-03", text: "下班後的寧靜時光對我來說神聖不可侵犯；為此，我願意忍受白天在辦公室裡必須完全聽命於上級的指令，不做多餘的個人爭執。", catA: "LS", catB: "AU" },
                { id: "C-LSAU-04", text: "只要能讓我下班後徹底關閉工作聯繫，我能接受在上班時間完全服從組織內最死板的管理規範。", catA: "LS", catB: "AU" },

                // [矩陣 33] 穩定 (SS) vs. 服務 (S)
                { id: "C-SSS2-01", text: "當核心業務出現異常時，為了保住我個人的考核與安穩，我會嚴格遵守「非我管轄絕不介入」的原則，即使我知道別的部門同仁正為此焦頭爛額。", catA: "SS", catB: "S" },
                { id: "C-SSS2-02", text: "面對組織即將裁撤老員工以維持穩定的決策，為了確保我自己的部門預算與職位不受波及，我會選擇保持沉默，即使這違反了我照顧同僚的初衷。", catA: "SS", catB: "S" },
                { id: "C-SSS2-03", text: "在參與年度評等或決策時，我會將「不破壞既有體制」放在第一位，即使我知道某些真正有貢獻但被邊緣化的同仁應該獲得更高的評價。", catA: "SS", catB: "S" },
                { id: "C-SSS2-04", text: "在面臨可能的責任追究時，我會優先確保符合組織的自我保護機制，而非為了助人而讓自己陷入職涯風險。", catA: "SS", catB: "S" },

                // [矩陣 34] 挑戰 (PC) vs. 專業 (TF)
                { id: "C-PCTF-01", text: "當遇到幾乎無解的突發危機時，我最享受的是在無人看好的情況下驚險扭轉局勢的瞬間，至於這過程是否完全符合標準專家規範，我並不在乎。", catA: "PC", catB: "TF" },
                { id: "C-PCTF-02", text: "比起坐在辦公室裡把現有的流程梳理到極致完美，我更渴望被派到第一線，去阻擋一場前所未見、正在衝擊組織運作的重大戰役。", catA: "PC", catB: "TF" },
                { id: "C-PCTF-03", text: "如果緊急任務要求在極短時間內完成交付，我會用最有效率的手段立刻達成挑戰，而不是慢條斯理地去雕琢產出的細節完美度。", catA: "PC", catB: "TF" },
                { id: "C-PCTF-04", text: "對我來說，「戰勝強敵」帶來的亢奮感遠高於「遵循專家標準」所帶來的穩健感。", catA: "PC", catB: "TF" },

                // [矩陣 35] 自主 (AU) vs. 服務 (S)
                { id: "C-AUS-01", text: "在處理項目時，我堅持用我個人發明、效率最高的方式來作業，即使這種方式會讓負責接手或協作的人員感到難以理解與痛苦。", catA: "AU", catB: "S" },
                { id: "C-AUS-02", text: "我極度厭惡那些打著「為了團隊和諧」旗號，強迫我改變高效作業習慣或參加無意義社交協作的組織文化。", catA: "AU", catB: "S" },
                { id: "C-AUS-03", text: "在推動計畫時，我寧可獨自扛下所有壓力並用自己的極快節奏完成，也不願放慢腳步去照顧那些進度落後、需要大量情感支持的成員。", catA: "AU", catB: "S" },
                { id: "C-AUS-04", text: "我寧可因為過於堅持個人的獨立作業風格而顯得與團隊格格不入，也不願為了團隊氣氛而改變節奏。", catA: "AU", catB: "S" },

                // [矩陣 36] 專業 (TF) vs. 穩定 (SS)
                { id: "C-TFSS-01", text: "只要組織允許我將最前衛的解決方案整合到核心流程中，我願意承擔這項新做法可能導致的不穩定、甚至讓我個人績效背鍋的風險。", catA: "TF", catB: "SS" },
                { id: "C-TFSS-02", text: "為了徹底掌握並推行一套效能更強大但冷門的專業運作架構，我願意放棄目前在主流環境累積多年的權威地位與安穩評價。", catA: "TF", catB: "SS" },
                { id: "C-TFSS-03", text: "如果留在老字號公司意謂著我只能維護舊有模式而無法接觸最頂尖的領域知識，即使這家公司保證永不裁員，我也會主動尋找外部機會。", catA: "TF", catB: "SS" },
                { id: "C-TFSS-04", text: "我追求的是掌握該領域最頂尖的執行工法，即便實施這種工法會導致組織運作出現暫時性的不穩定。", catA: "TF", catB: "SS" },

                // [矩陣 37] 服務 (S) vs. 管理 (GM)
                { id: "C-SGM-01", text: "參與重大專案時，我更希望利用這個專案去發掘並記錄基層人員的貢獻故事，而不是將其視為一個向各部門展現我統籌權力的舞台。", catA: "S", catB: "GM" },
                { id: "C-SGM-02", text: "當我推動成立內部的健康互助社團時，我唯一的目的是看到同事變快樂；我非常反感管理層試圖將這個社團轉化為展現公司績效的工具。", catA: "S", catB: "GM" },
                { id: "C-SGM-03", text: "在進行資源分配時，我寧願稍微犧牲自己部門的帳面數據，也要確保那些家境困難或處於弱勢的同仁能保有工作。", catA: "S", catB: "GM" },
                { id: "C-SGM-04", text: "當同仁需要長期支持時，我願意放下手中的管理權杖去親自協助他們，這比掌握職權更有成就感。", catA: "S", catB: "GM" },

                // [矩陣 38] 創業 (EC) vs. 服務 (S)
                { id: "C-ECS-01", text: "如果經營的事業面臨利潤微薄的困境，為了確保商業模式能存活，我會果斷停止服務那些經常延遲付款的清寒客戶，在商言商。", catA: "EC", catB: "S" },
                { id: "C-ECS-02", text: "當我發現一個極具獲利潛力的商業缺口時，即使這個項目可能會對部分群體的利益造成輕微損害，我也會優先考慮將其推向市場。", catA: "EC", catB: "S" },
                { id: "C-ECS-03", text: "如果我開發了一套能精準預測市場趨勢的分析工具，我會選擇成立收費昂貴的諮詢公司來最大化我的財富，而不是將其無償提供給大眾使用。", catA: "EC", catB: "S" },
                { id: "C-ECS-04", text: "當我需要建立商業版圖時，我會將企業的市場競爭力置於公益貢獻之上，這才是正確的開創者思維。", catA: "EC", catB: "S" },

                // [矩陣 39] 專業 (TF) vs. 生活 (LS)
                { id: "C-TFLS-01", text: "為了徹底搞懂一項最新的專業協定或運作機制，我願意連續幾個週末不出門，甚至犧牲原本安排好的休閒與娛樂時間。", catA: "TF", catB: "LS" },
                { id: "C-TFLS-02", text: "面對一個罕見的業務報錯，我會產生強烈的究極感，寧可熬夜查閱相關文件到天亮，也不願按時下班把問題丟給隔天的接班人。", catA: "TF", catB: "LS" },
                { id: "C-TFLS-03", text: "如果能讓我參與一項業界最前沿的基礎建設升級計畫，我完全不介意它會大幅壓縮我陪伴家人與長途旅行的時間。", catA: "TF", catB: "LS" },
                { id: "C-TFLS-04", text: "我經常利用私人週末假期研究專業領域的細節，因為這比單純的旅遊或休閒更讓我感到充實。", catA: "TF", catB: "LS" },

                // [矩陣 40] 管理 (GM) vs. 挑戰 (PC)
                { id: "C-GMPC-01", text: "比起親上前線廝殺、享受極限逆轉勝的刺激，我更喜歡待在總部，冷靜地指揮跨區域部門的資源調度與長期戰略規劃。", catA: "GM", catB: "PC" },
                { id: "C-GMPC-02", text: "當組織面臨危機時，我認為最有價值的是「建立一套不再發生危機的制度」，而不是享受那種在混亂中成為英雄的快感。", catA: "GM", catB: "PC" },
                { id: "C-GMPC-03", text: "我期望的職涯頂點是掌管龐大且運作平穩的企業帝國，而不是不斷尋找高難度的爛攤子公司來證明我的反轉能力。", catA: "GM", catB: "PC" },
                { id: "C-GMPC-04", text: "我追求的是透過制度來掌控全局的運作穩定，而非透過參與一場又一場的限時危機來證明身手。", catA: "GM", catB: "PC" },

                // [矩陣 41] 自主 (AU) vs. 創業 (EC)
                { id: "C-AUEC-01", text: "我寧可永遠做個只對自己產出負責的獨立接案者，也不願成立公司、扛起發放員工薪水與繳納稅務的企業主責任。", catA: "AU", catB: "EC" },
                { id: "C-AUEC-02", text: "對我來說，「隨時隨地能工作」的絕對自由，遠比承擔風險去打造一個具備高變現能力的連鎖品牌更具吸引力。", catA: "AU", catB: "EC" },
                { id: "C-AUEC-03", text: "即使我手上有極具市場潛力的計畫原型，只要想到創業必須不斷受制於投資人的報告壓力，我就會打消念頭。", catA: "AU", catB: "EC" },
                { id: "C-AUEC-04", text: "我對成功的理解是「沒人能管我做什麼」，而非「我創立了一家有多少名員工的企業」。", catA: "AU", catB: "EC" },

                // [矩陣 42] 穩定 (SS) vs. 創業 (EC)
                { id: "C-SSEC-01", text: "即使我有極好的創業點子與早期資金，我也會因為捨不得目前在成熟企業累積多年的年資與穩定分紅，而選擇按兵不動。", catA: "SS", catB: "EC" },
                { id: "C-SSEC-02", text: "在進行投資與職涯選擇時，我堅守「保本與穩定現金流」的原則，絕不輕易將大筆資金或職涯黃金期投入高風險的新創事業。", catA: "SS", catB: "EC" },
                { id: "C-SSEC-03", text: "對我而言，一份月薪固定但保證能讓我安穩退休的行政職缺，勝過一個號稱未來能讓我獲得千萬分配股權的創辦人機會。", catA: "SS", catB: "EC" },
                { id: "C-SSEC-04", text: "我會將積蓄放在具備高保障、低風險的避險計畫中，而非拿去投資充滿變數的新創事業。", catA: "SS", catB: "EC" },

				// [矩陣 43] 自主 (AU) vs. 專業 (TF)
                { id: "C-AUTF-01", text: "若精進某項技術需要我參加嚴格的實體培訓，我會因為這限制了我的彈性而考慮放棄。", catA: "AU", catB: "TF" },
                { id: "C-AUTF-02", text: "當面對一個強制要求成員遵循極度嚴格規範與繁瑣審查流程的系統時，我會為了爭取個人作業的隨性與自由而選擇離開。", catA: "AU", catB: "TF" },
                { id: "C-AUTF-03", text: "我認為「用我喜歡的方式把任務解掉」比「使用業界公認最權威的作業框架來解決」更為重要。", catA: "AU", catB: "TF" },
                { id: "C-AUTF-04", text: "我拒絕那些要求每一步都必須依照標準手冊審查的工作，因為這扼殺了我個人解決問題的靈活性。", catA: "AU", catB: "TF" },

                // [矩陣 44] 服務 (S) vs. 生活 (LS)
                { id: "C-SLS-01", text: "我願意在深夜或假日接聽求助電話，因為我覺得幫助他人是我的職責。", catA: "S", catB: "LS" },
                { id: "C-SLS-02", text: "如果一份工作能讓世界變得更好，我願意接受較低的生活水平與更少的休閒預算。", catA: "S", catB: "LS" },
                { id: "C-SLS-03", text: "我認為將業餘時間奉獻給內部的互助社團，比獨自待在家裡享受個人娛樂更有意義。", catA: "S", catB: "LS" },
                { id: "C-SLS-04", text: "即使需要縮短年度家庭聚會的時間，只要是為了支持具備重大貢獻的利他專案，我也願意參與。", catA: "S", catB: "LS" },

                // [矩陣 45] 專業 (TF) vs. 創業 (EC)
                { id: "C-TFEC-01", text: "當我開發出一個很棒的工具或流程時，我更傾向把它留在手中持續優化，而非立刻將其商業化。", catA: "TF", catB: "EC" },
                { id: "C-TFEC-02", text: "我想成為該領域被公認的專家，而非成為一家技術外包的代理商老闆。", catA: "TF", catB: "EC" },
                { id: "C-TFEC-03", text: "對我來說，深入鑽研核心專業邏輯所帶來的滿足感，遠比利用這些技術去市場上賺取第一桶金來得重要。", catA: "TF", catB: "EC" },
                { id: "C-TFEC-04", text: "我傾向於不斷精進並保護我的專業技術成果，而非匆忙將其轉化為獲利導向的商業產品。", catA: "TF", catB: "EC" },

                // [矩陣 46] 生活 (LS) vs. 自主 (AU)
                { id: "C-LSAU-01", text: "為了換取高品質的家庭生活，我可以接受一份雖然死板的工作。", catA: "LS", catB: "AU" },
                { id: "C-LSAU-02", text: "對我來說，穩定且可控的生活節奏，比「隨心所欲但極度混亂」的工作模式更重要。", catA: "LS", catB: "AU" },
                { id: "C-LSAU-03", text: "我願意配合公司的各種規範，只要它能保證我不必在休假期間處理公事。", catA: "LS", catB: "AU" },
                { id: "C-LSAU-04", text: "只要能讓我下班後徹底關閉工作聯繫，我能接受在上班時間完全服從組織內最死板的管理規範。", catA: "LS", catB: "AU" },

                // [矩陣 47] 管理 (GM) vs. 挑戰 (PC)
                { id: "C-GMPC-01", text: "我更在乎如何整合資源讓組織長治久安，而非只是為了解決一個充滿刺激的危機。", catA: "GM", catB: "PC" },
                { id: "C-GMPC-02", text: "成功的管理者應具備大局觀，不應為了追求個人成就感而讓公司陷入不必要的風險中。", catA: "GM", catB: "PC" },
                { id: "C-GMPC-03", text: "管理龐大組織所帶來的地位感，遠大於單槍匹馬解決難題的英雄式快樂。", catA: "GM", catB: "PC" },
                { id: "C-GMPC-04", text: "我追求的是透過制度來掌控全局的運作穩定，而非透過參與一場又一場的限時危機來證明身手。", catA: "GM", catB: "PC" },

                // [矩陣 48] 創業 (EC) vs. 穩定 (SS)
                { id: "C-ECSS2-01", text: "與其在大企業中領取優渥獎金，我更想拿這筆錢去支應我的新事業初期開銷。", catA: "EC", catB: "SS" },
                { id: "C-ECSS2-02", text: "我對財務的看法是「創造更多可能性」，而非「尋求最安全的保障」。", catA: "EC", catB: "SS" },
                { id: "C-ECSS2-03", text: "我寧願為了實現一個創業構思而承擔短暫風險，也不願過著領固定薪水的生活。", catA: "EC", catB: "SS" },
                { id: "C-ECSS2-04", text: "我追求的是能掌控事業成長帶來的收益，而非安穩領取受組織保護的固定退休金。", catA: "EC", catB: "SS" },

                // [矩陣 49] 挑戰 (PC) vs. 自主 (AU)
                { id: "C-PCAU-01", text: "只要任務夠刺激、能展現實力，我不介意在高度紀律化的體制下運作。", catA: "PC", catB: "AU" },
                { id: "C-PCAU-02", text: "我可以為了攻克一個強大的競爭對手，而暫時放棄我對彈性工時的堅持。", catA: "PC", catB: "AU" },
                { id: "C-PCAU-03", text: "只要專案目標極具野心，我願意接受指令，只要我能在其中擔任關鍵角色。", catA: "PC", catB: "AU" },
                { id: "C-PCAU-04", text: "只要能解決極難攻克的標竿專案，我完全可以忍受在極度僵化的指揮體系下運作，放棄作業自由。", catA: "PC", catB: "AU" },

                // [矩陣 50] 服務 (S) vs. 創業 (EC)
                { id: "C-SEC-01", text: "我認為衡量事業成功的最終標準是影響了多少人的生命，而非帳戶上的盈餘數字。", catA: "S", catB: "EC" },
                { id: "C-SEC-02", text: "在資源有限時，我會優先照顧供應商與客戶的利益，而非追求利潤最大化。", catA: "S", catB: "EC" },
                { id: "C-SEC-03", text: "我寧可經營一家規模小但有意義的店鋪，也不願經營一個缺乏溫度的連鎖企業。", catA: "S", catB: "EC" },
                { id: "C-SEC-04", text: "我認為事業的核心是傳遞社會價值，如果只是一味追求獲利，那便失去了職業意義。", catA: "S", catB: "EC" },

                // [矩陣 51] 生活 (LS) vs. 挑戰 (PC)
                { id: "C-LSPC2-01", text: "我拒絕參與任何會導致我身心健康受損的挑戰，無論其回報有多豐厚。", catA: "LS", catB: "PC" },
                { id: "C-LSPC2-02", text: "我會避開那些競爭風氣過盛的環境，因為我追求的是內心的平靜與舒適。", catA: "LS", catB: "PC" },
                { id: "C-LSPC2-03", text: "當工作壓力開始讓我無法享受愛好時，我會主動選擇退出這場競爭。", catA: "LS", catB: "PC" },
                { id: "C-LSPC2-04", text: "面對一個可能改寫業界標竿但極其耗時的任務，我會為了維持生活品質而主動放棄參與。", catA: "LS", catB: "PC" },

                // [矩陣 52] 穩定 (SS) vs. 生活 (LS)
                { id: "C-SSLS-01", text: "為了確保我在組織累積多年的年資與保障絕對不會中斷，我願意配合常態性的週末加班與臨時出勤要求。", catA: "SS", catB: "LS" },
                { id: "C-SSLS-02", text: "只要能保證未來二十年的職涯安全與極高的薪資下限，我願意長期放棄在既有居住地經營的生活圈。", catA: "SS", catB: "LS" },
                { id: "C-SSLS-03", text: "我願意把原本用來投資私人興趣的時間，全數轉為準備能保住飯碗的內部考試，以換取安全感。", catA: "SS", catB: "LS" },
                { id: "C-SSLS-04", text: "我願意配合組織在假日的任何緊急徵調，只要這能確保我的考核表現維持在「最安全」的水準。", catA: "SS", catB: "LS" },

                // [矩陣 53] 專業 (TF) vs. 管理 (GM)
                { id: "C-TFGM2-01", text: "我更享受親自解決一個棘手的難題，而非協調不同部門之間的利益分配。", catA: "TF", catB: "GM" },
                { id: "C-TFGM2-02", text: "看到部屬解決問題的方式不對，我會想親自動手，而非只是下達指導原則。", catA: "TF", catB: "GM" },
                { id: "C-TFGM2-03", text: "對我來說，專業評價與認證，比在公司的職稱高低更具實質意義。", catA: "TF", catB: "GM" },
                { id: "C-TFGM2-04", text: "我寧願擔任掌握核心專業權威的職位，也不願轉向僅負責資源分配與績效匯報的管理職。", catA: "TF", catB: "GM" },

                // [矩陣 54] 自主 (AU) vs. 生活 (LS)
                { id: "C-AULS-01", text: "我願意接受一份收入較低但不用進辦公室的工作，因為這讓我可以靈活處理瑣事。", catA: "AU", catB: "LS" },
                { id: "C-AULS-02", text: "自由安排工作節奏對我來說是生活的核心，而非只是工作的加分項。", catA: "AU", catB: "LS" },
                { id: "C-AULS-03", text: "只要能在我想工作的時候工作，我不介意辦公室的環境是否舒適。", catA: "AU", catB: "LS" },
                { id: "C-AULS-04", text: "對我來說，「作業過程完全不受干擾」的自由感，重要性高於確保每週能有完整的假期。", catA: "AU", catB: "LS" },

                // [矩陣 55] 挑戰 (PC) vs. 服務 (S)
                { id: "C-PCS-01", text: "面對實力懸殊的對戰時，我內心渴望贏過對方，即便這在商業上顯得不夠寬厚。", catA: "PC", catB: "S" },
                { id: "C-PCS-02", text: "我追求的是解決「前人未解之謎」的爽快感，這比慈悲心更能激發我的潛能。", catA: "PC", catB: "S" },
                { id: "C-PCS-03", text: "在壓力環境下，我更看重團隊是否能存活並取勝，而非每個人都感到被溫柔對待。", catA: "PC", catB: "S" },
                { id: "C-PCS-04", text: "面對市場上的強大競爭者，我渴望以實力徹底擊敗對方，而不僅僅是尋求和平共處。", catA: "PC", catB: "S" },

                // [矩陣 56] 管理 (GM) vs. 專業 (TF)
                { id: "C-GMTF2-01", text: "作為管理者，我更在乎如何找到合適的人才來完成任務，而非我自己要成為專家。", catA: "GM", catB: "TF" },
                { id: "C-GMTF2-02", text: "我能接受在不懂技術細節的情況下做出決策，只要我信任管理與回報機制。", catA: "GM", catB: "TF" },
                { id: "C-GMTF2-03", text: "職涯的最終目標是建立一套能自動運轉的系統，而非讓自己成為不可替代的核心。", catA: "GM", catB: "TF" },
                { id: "C-GMTF2-04", text: "我衡量專業知識的標準，在於它能否解決營運痛點，而非其本身的學理深度。", catA: "GM", catB: "TF" }
            ]
        };

        function App() {
            const [step, setStep] = useState("welcome");
            const [qIndex, setQIndex] = useState(1);
            const [theta, setTheta] = useState({ TF: 0, GM: 0, AU: 0, SS: 0, EC: 0, S: 0, PC: 0, LS: 0 });
            const [tIo, setTIo] = useState(0);
            const [muT, setMuT] = useState(0);
            const [sigmaT, setSigmaT] = useState(0.1);
            const [history, setHistory] = useState([]);
            const [entangledPairs, setEntangledPairs] = useState([]);
            const [currentQ, setCurrentQ] = useState(null);
			const [rerollTrigger, setRerollTrigger] = useState(0);
			const [copySuccess, setCopySuccess] = useState(false);

            const startTimeRef = useRef(0);
			// 第二階段改為 24 題，每維度 3 次
            const p2OrderRef = useRef(
                ["TF", "GM", "AU", "SS", "EC", "S", "PC", "LS", 
                 "TF", "GM", "AU", "SS", "EC", "S", "PC", "LS", 
                 "TF", "GM", "AU", "SS", "EC", "S", "PC", "LS"]
                .sort(() => Math.random() - 0.5)
            );
			const calibOrderRef = useRef([...QB.phase1].sort(() => Math.random() - 0.5));
            const usedMatricesRef = useRef(new Set());

            const handlePause = () => { /* 已由超時機制取代 */ };

            const restart = () => {
                setStep("welcome"); setQIndex(1); setHistory([]); setEntangledPairs([]);
                setTheta({ TF: 0, GM: 0, AU: 0, SS: 0, EC: 0, S: 0, PC: 0, LS: 0 });
                usedMatricesRef.current.clear();
				calibOrderRef.current = [...QB.phase1].sort(() => Math.random() - 0.5);
                setTIo(0); setMuT(0); setSigmaT(0.1);
            };

            const handleCopyResults = () => {
                const now = new Date();
                const timeStr = now.toLocaleString('zh-TW', { 
                    year: 'numeric', month: '2-digit', day: '2-digit', 
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: false, timeZoneName: 'short' 
                });

                const shiftedScores = Object.entries(theta).map(([k, v]) => ({
                    key: k, name: ANCHORS[k].name, score: Math.max(0, v + 5)
                }));
                const totalScore = shiftedScores.reduce((sum, item) => sum + item.score, 0);
                
                const textToCopy = `您好，這是我剛完成的職涯錨定診斷數據（總和100%），請以此為基礎進行分析：\n\n` + 
                    `測驗完成時間：${timeStr}\n\n` +
                    shiftedScores.sort((a, b) => b.score - a.score).map(item => {
                        const percentage = totalScore > 0 ? ((item.score / totalScore) * 100).toFixed(1) : 0;
                        return `- ${item.name}： ${percentage}%`;
                    }).join('\n');
                
                navigator.clipboard.writeText(textToCopy).then(() => {
                    setCopySuccess(true);
                    setTimeout(() => setCopySuccess(false), 2500);
                });
            };

            useEffect(() => {
                if (step === "testing") {
                    let nextQ;
                    if (qIndex === 1) {
                        nextQ = calibOrderRef.current[0]; 
                    } else if (qIndex === 2) {
                        nextQ = calibOrderRef.current[1];
                    } else if (qIndex <= 26) {
                        const cat = p2OrderRef.current[qIndex - 3]; 
                        nextQ = QB.phase2[cat][Math.floor(Math.random() * 8)];
                        nextQ.type = "normal"; nextQ.cat = cat;
                    } else {
                        const sorted = Object.entries(theta).sort((a, b) => b[1] - a[1]);
                        const t1 = sorted[0][0]; const t2 = sorted[1][0];
                        if (entangledPairs.length > 0) {
                            const e1 = entangledPairs[0]; const e2 = entangledPairs[1];
                            nextQ = QB.matrices.find(m => ((m.catA === e1 && m.catB === e2) || (m.catA === e2 && m.catB === e1)) && !usedMatricesRef.current.has(m.id));
                            if (nextQ) { usedMatricesRef.current.add(nextQ.id); nextQ.type = "matrix"; }
                            else { const targetCat = Math.random() > 0.5 ? e1 : e2; nextQ = QB.phase2[targetCat][Math.floor(Math.random() * 8)]; nextQ.type = "normal"; nextQ.cat = targetCat; }
                        } else {
                            nextQ = QB.matrices.find(m => ((m.catA === t1 && m.catB === t2) || (m.catA === t2 && m.catB === t1)) && !usedMatricesRef.current.has(m.id));
                            if (nextQ) { usedMatricesRef.current.add(nextQ.id); nextQ.type = "matrix"; }
                            else { nextQ = QB.phase2[t1][Math.floor(Math.random() * 8)]; nextQ.type = "normal"; nextQ.cat = t1; }
                        }
                    }
                    setCurrentQ(nextQ);
                    startTimeRef.current = Date.now();
                }
            }, [qIndex, step, theta, entangledPairs, rerollTrigger]);

            const handleAnswer = (score) => {
                const timeCost = (Date.now() - startTimeRef.current) / 1000;
                if (qIndex <= 2) {
                    if (score !== currentQ.expected) {
                        alert(`【系統校準失敗】\n指示為 ${currentQ.expected} 分，您點選了 ${score} 分。請精準依照指示作答。`);
                        startTimeRef.current = Date.now(); return;
                    }
                }
                if (qIndex > 2 && timeCost > 20.0) {
                    alert("偵測到作答中斷。為確保數據準確，本題作廢並更換情境，請保持專注。");
                    setRerollTrigger(prev => prev + 1); return;
                }

                let nextTheta = { ...theta };
                let currentTe = timeCost;

                if (qIndex <= 2) {
                    if (qIndex === 2) {
                        const prevTimeCost = history.length > 0 ? history[0].timeCost : timeCost;
                        setTIo((prevTimeCost + timeCost) / 2);
                    }
                } else {
                    currentTe = Math.max(0.1, timeCost - tIo); 
                    if (qIndex <= 26) {
                        const sNorm = (score - 3.5) / 2.5;
                        nextTheta[currentQ.cat] += (1.0 * sNorm * 1.0);
                        if (qIndex === 26) {
                            const p2Te = [...history.filter(h => h.id > 2).map(h => h.Te), currentTe];
                            const mean = p2Te.reduce((a, b) => a + b, 0) / 24;
                            const std = Math.sqrt(p2Te.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / 24) || 0.1;
                            setMuT(mean); setSigmaT(std);
                        }
                    } else {
                        const Z = (currentTe - muT) / sigmaT;
                        let W_rt = 1.0;
                        if (Z < -0.5) W_rt = Math.min(1.5, 1 + 0.2 * Math.abs(Z));
                        else if (Z > 0.5) W_rt = Math.max(0.2, 1 - 0.3 * Z);
                        const sNorm = (score - 3.5) / 2.5;
                        if (currentQ.type === "matrix") {
                            if ((score === 3 || score === 4) && Z > 1.0) {
                                if (!entangledPairs.includes(currentQ.catA)) setEntangledPairs(prev => [...prev, currentQ.catA, currentQ.catB]);
                            } else {
                                nextTheta[currentQ.catA] += (1.5 * sNorm * W_rt);
                                nextTheta[currentQ.catB] -= (1.5 * sNorm * W_rt);
                            }
                        } else { nextTheta[currentQ.cat] += (1.0 * sNorm * W_rt); }
                    }
                }

                setHistory([...history, { id: qIndex, qId: currentQ.id, timeCost, Te: currentTe, score }]);
                setTheta(nextTheta);

                const sorted = Object.entries(nextTheta).sort((a, b) => b[1] - a[1]);
                let shouldEnd = false;
                if (qIndex >= 32 && qIndex < 40) {
                    if (entangledPairs.length === 0) {
                        const gap1 = sorted[0][1] - sorted[1][1];
                        const gap2 = sorted[1][1] - sorted[2][1];
                        const gap3 = sorted[2][1] - sorted[3][1];
                        if (gap1 >= 1.8 && gap2 >= 1.5 && gap3 >= 1.5) shouldEnd = true;
                        if (gap3 < 1.0 && entangledPairs.length === 0) { setEntangledPairs([sorted[2][0], sorted[3][0]]); }
                    }
                }

                if (shouldEnd || qIndex >= 40) { setStep("results"); } 
                else { setQIndex(qIndex + 1); }
            };

            if (!currentQ && step === "testing") return <div className="p-10 text-center font-bold">載入引擎中...</div>;
            const sortedResults = Object.entries(theta).sort((a, b) => b[1] - a[1]);
            const radarData = Object.entries(theta).map(([k, v]) => ({ subject: ANCHORS[k].name, A: v + 5 }));

            let displayCount = 3;
            if (sortedResults.length > 3 && sortedResults[2][1].toFixed(2) === sortedResults[3][1].toFixed(2)) { displayCount = 4; }
            const topAnchors = sortedResults.slice(0, displayCount);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <header className="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 w-8 h-8 rounded flex items-center justify-center text-white font-bold">A</div>
                            <div>
                                <h1 className="font-bold text-slate-800 uppercase tracking-tight text-sm">Career Anchor CAT Engine</h1>
                                <p className="text-[10px] text-slate-400 font-black uppercase">v3.4 Production Build</p>
                            </div>
                        </div>
                        <div className="text-right text-[10px] font-mono text-slate-400">
                            {qIndex > 26 ? `μ: ${muT.toFixed(2)}s | σ: ${sigmaT.toFixed(2)}s` : 'CALIBRATING'}
                        </div>
                    </header>

                    <main className="flex-1 overflow-auto p-4 sm:p-6">
                        {step === "welcome" && (
                            <div className="max-w-4xl mx-auto py-20 flex flex-col items-center text-center">
                                <h2 className="text-4xl font-black text-slate-900 mb-6 tracking-tighter">職涯錨定深度診斷 v3.4</h2>
                                <p className="text-slate-500 max-w-xl mb-12 leading-relaxed">
                                    此為企業級高精度版本（40 題型）。系統將透過 Z-score 相對反應模型偵測您的核心動機，請依直覺快速作答。
                                </p>
                                <button onClick={() => setStep("testing")} className="bg-slate-900 px-12 py-5 rounded-2xl text-white font-bold text-lg hover:scale-105 transition-all shadow-xl">
                                    啟動深度診斷 START
                                </button>
                            </div>
                        )}

                        {step === "testing" && currentQ && (
                            <div className="max-w-6xl mx-auto flex flex-col lg:flex-row gap-6 animate-in slide-in-from-bottom-4">
                                <div className="flex-[3] bg-white rounded-3xl p-6 sm:p-10 border shadow-sm">
                                    <div className="flex justify-between items-center mb-10">
                                        <div className="flex gap-2">
                                            <span className="bg-slate-100 px-2 py-1 rounded text-[10px] font-mono font-black text-slate-500">{currentQ.id}</span>
                                            <span className="text-[10px] font-black text-slate-300 uppercase self-center">Prog: {qIndex}/40</span>
                                        </div>
                                        <button onClick={() => window.confirm("確定重測？") && restart()} className="text-[10px] bg-slate-50 text-slate-400 px-3 py-1 rounded-full hover:bg-rose-50 hover:text-rose-500 font-bold transition-all">
                                            ⟳ 重新開始
                                        </button>
                                    </div>
                                    <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-12 min-h-[80px] leading-snug">{currentQ.text}</h2>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                                        {[1, 2, 3, 4, 5, 6].map(s => (
                                            <button key={s} onClick={() => handleAnswer(s)} className="h-20 sm:h-28 border-2 rounded-2xl hover:border-indigo-600 hover:bg-indigo-50 font-black text-xl text-slate-300 hover:text-indigo-600 transition-all flex flex-col items-center justify-center gap-1">
                                                {s} <div className="text-[9px] uppercase opacity-60 font-bold">{s <= 3 ? "不符合" : "符合"}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex-1 space-y-6">
                                    <div className={`rounded-3xl p-6 text-white transition-all shadow-lg ${entangledPairs.length > 0 ? 'bg-rose-900' : 'bg-slate-900'}`}>
                                        <h3 className="text-[10px] font-black uppercase tracking-widest mb-6 opacity-60 flex items-center gap-2">
                                            <span className={`w-1.5 h-1.5 rounded-full ${entangledPairs.length > 0 ? 'bg-rose-400 animate-ping' : 'bg-indigo-400'}`}></span>
                                            {entangledPairs.length > 0 ? 'Entanglement' : 'Real-time Theta'}
                                        </h3>
                                        <div className="space-y-4">
                                            {sortedResults.slice(0, 4).map(([k, v]) => (
                                                <div key={k}>
                                                    <div className="flex justify-between text-[11px] font-black mb-1.5">
                                                        <span className="text-slate-400 tracking-tighter">{k}</span>
                                                        <span className="font-mono text-indigo-400">{v.toFixed(2)}</span>
                                                    </div>
                                                    <div className="h-1 bg-slate-800 rounded-full overflow-hidden">
                                                        <div className="bg-indigo-500 h-full transition-all duration-500" style={{width: `${Math.max(0, (v + 5) * 10)}%`}}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === "results" && (
                            <div className="max-w-4xl mx-auto bg-white p-6 sm:p-12 rounded-[2.5rem] shadow-sm border animate-in zoom-in-95 duration-700">
                                <h2 className="text-3xl font-black mb-10 text-center tracking-tight">職涯錨定鑑定報告</h2>
                                <div className="w-full flex justify-center mb-12 bg-slate-50 rounded-3xl py-8">
                                    <RadarChart data={radarData} />
                                </div>

                                <div className="bg-slate-50 p-8 rounded-3xl text-left space-y-6 mb-8 border border-slate-100">
                                    <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest border-b border-slate-200 pb-3">核心職涯錨定 (Primary Anchors)</h3>
                                    {topAnchors.map(([k, v], index) => (
                                        <div key={k} className="animate-in fade-in slide-in-from-left-4" style={{animationDelay: `${index * 150}ms`}}>
                                            <div className="flex items-center gap-2 mb-1.5">
                                                <span className="bg-indigo-600 text-white text-[9px] font-black px-2 py-0.5 rounded-md uppercase">Top {index + 1}</span>
                                                <h4 className="text-lg font-bold text-slate-800">{ANCHORS[k].name}</h4>
                                            </div>
                                            <p className="text-slate-500 text-xs leading-relaxed">{ANCHORS[k].desc}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-white p-8 rounded-3xl border-2 border-slate-100 text-left space-y-6">
                                    <div className="flex justify-between items-center border-b border-slate-100 pb-4">
                                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest">完整角色占比與 AI 分析</h3>
                                        <button onClick={handleCopyResults} className={`text-xs px-4 py-2 rounded-xl font-bold transition-all shadow-sm ${copySuccess ? 'bg-emerald-500 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                                            {copySuccess ? '✓ 已成功複製' : '📋 複製數據'}
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-4">
                                        {sortedResults.map(([k, v]) => (
                                            <div key={k} className="flex justify-between items-center bg-slate-50 px-4 py-3 rounded-2xl border border-slate-100 transition-hover hover:border-indigo-200">
                                                <span className="font-bold text-slate-700 text-sm">{ANCHORS[k].name}</span>
                                                <span className="font-mono font-black text-indigo-600">{v.toFixed(2)}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="bg-slate-900 rounded-[2rem] p-8 text-white text-center space-y-5 shadow-2xl">
                                        <h4 className="text-xl font-black text-amber-400 flex justify-center items-center gap-2">✨ 獲取 AI 深度解析報告</h4>
                                        <p className="text-xs text-slate-400 max-w-sm mx-auto leading-relaxed">
                                            系統已將您的分數換算為 <strong className="text-white">Gemini 專用百分比格式</strong>。請點擊上方按鈕複製後，前往下方連結貼上。
                                        </p>
                                        <a href="https://gemini.google.com/gem/15P_iNv1Jo_aqojAgcz1LlL3chFi7dSoY?usp=sharing" target="_blank" rel="noopener noreferrer" className="inline-block bg-amber-500 text-slate-900 font-black px-10 py-4 rounded-2xl hover:bg-amber-400 transition-all shadow-lg text-sm">
                                            前往 Gemini 貼上分析 ↗
                                        </a>
                                    </div>
                                </div>

                                <button onClick={restart} className="mt-12 w-full py-4 text-slate-400 font-bold text-xs uppercase tracking-widest hover:text-slate-600 transition-all">
                                    — 重新進行診斷 Restart Diagnostic —
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
