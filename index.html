        const RadarChart = ({ data }) => {
            const size = 400; const center = size / 2; const radius = size * 0.35;
            const maxVal = 10;

            const points = data.map((d, i) => {
                const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                const normalized = Math.max(0, Math.min(d.A / maxVal, 1));
                return {
                    x: center + radius * normalized * Math.cos(angle),
                    y: center + radius * normalized * Math.sin(angle),
                    labelX: center + (radius + 40) * Math.cos(angle),
                    labelY: center + (radius + 40) * Math.sin(angle),
                    subject: d.subject
                };
            });

            const polygonPoints = points.map(p => `${p.x},${p.y}`).join(' ');

            return (
                <svg viewBox={`0 0 ${size} ${size}`} className="w-full h-full max-h-[400px]">
                    {[1, 2, 3, 4].map(level => {
                        const r = radius * (level / 4);
                        const pts = data.map((_, i) => {
                            const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                            return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
                        }).join(' ');
                        return <polygon key={`grid-${level}`} points={pts} fill="none" stroke="#e2e8f0" strokeWidth="1" />;
                    })}
                    {data.map((_, i) => {
                        const angle = (Math.PI * 2 * i) / data.length - Math.PI / 2;
                        return <line key={`axis-${i}`} x1={center} y1={center} x2={center + radius * Math.cos(angle)} y2={center + radius * Math.sin(angle)} stroke="#e2e8f0" strokeWidth="1" />;
                    })}
                    <polygon points={polygonPoints} fill="#4f46e5" fillOpacity="0.2" stroke="#4f46e5" strokeWidth="3" />
                    {points.map((p, i) => <circle key={`dot-${i}`} cx={p.x} cy={p.y} r="4" fill="#4f46e5" />)}
                    {points.map((p, i) => (
                        <text key={`label-${i}`} x={p.labelX} y={p.labelY} fill="#64748b" fontSize="11" fontWeight="700" textAnchor="middle" dominantBaseline="middle">
                            {p.subject}
                        </text>
                    ))}
                </svg>
            );
        };

                { id: "C-SPC-01", text: "當團隊面臨高壓任務時，我會花更多時間安撫與協助心理壓力大的成員，而非只追求個人的挑戰成就。", catA: "S", catB: "PC" },
                { id: "C-SPC-02", text: "即使一份工作充滿挑戰與競爭樂趣，但若其核心邏輯會傷害大眾福祉，我會堅決拒絕。", catA: "S", catB: "PC" },
                { id: "C-SPC-03", text: "在極度困難的決策關頭，我寧可犧牲專案的短期勝利，也不願做出犧牲基層成員權益的冷酷決定。", catA: "S", catB: "PC" },

                // [矩陣 07] 生活 (LS) vs. 專業 (TF)
                { id: "C-LSTF-01", text: "當進階專業培訓撞期我策劃已久的家庭海外旅行時，我會選擇放棄該次培訓。", catA: "LS", catB: "TF" },
                { id: "C-LSTF-02", text: "若成為頂尖人才意味著必須 24 小時隨時待命處理危機，我寧可做個準時下班的普通員工。", catA: "LS", catB: "TF" },
                { id: "C-LSTF-03", text: "對我而言，利用下班時間經營個人生活嗜好，比研讀最新的專業文件更重要。", catA: "LS", catB: "TF" },

                // [矩陣 08] 管理 (GM) vs. 自主 (AU)
                { id: "C-GMAU-01", text: "為了獲得指揮龐大組織的權限，我可以忍受繁瑣的會議匯報與嚴格的層級規範。", catA: "GM", catB: "AU" },
                { id: "C-GMAU-02", text: "我願意犧牲決定工作步調的自由，來換取在組織圖上位居高處的絕對決策權。", catA: "GM", catB: "AU" },
                { id: "C-GMAU-03", text: "我不介意成為被體制運作束縛的推手，只要最終結果能證明我的營運策略是成功的。", catA: "GM", catB: "AU" },

                // [矩陣 09] 專業 (TF) vs. 自主 (AU)
                { id: "C-TFAU-01", text: "我願意嚴格遵循專業規範以確保產出完全合規，而非為了個人作業方便而自行簡化流程。", catA: "TF", catB: "AU" },
                { id: "C-TFAU-02", text: "面對複雜的處理程序，我會堅持按照官方標準指引執行，而非使用缺乏驗證的偏門方法繞過。", catA: "TF", catB: "AU" },
                { id: "C-TFAU-03", text: "我更看重任務是否在專業品質上達到業界最高標準，而非這份工作是否允許我自由安排時間。", catA: "TF", catB: "AU" },

                // [矩陣 10] 管理 (GM) vs. 服務 (S)
                { id: "C-GMS-01", text: "當資源有限時，我能為了組織整體獲利而縮減成本，即便這會大幅增加第一線同事的工作負擔。", catA: "GM", catB: "S" },
                { id: "C-GMS-02", text: "我更傾向擔任掌控預算與績效的計畫負責人，而非親自去關懷並協助每位同事的心理健康。", catA: "GM", catB: "S" },
                { id: "C-GMS-03", text: "我認為職業生涯最大的價值在於具備權衡各方利益的談判手腕，而非成為同事傾訴苦水的心靈導師。", catA: "GM", catB: "S" },

                // [矩陣 11] 創業 (EC) vs. 生活 (LS)
                { id: "C-ECLS-01", text: "若有機會擴大我的開創計畫，我願意在未來數年內犧牲絕大部分的休閒娛樂與私人假期。", catA: "EC", catB: "LS" },
                { id: "C-ECLS-02", text: "為了讓我主導的創新方案在市場上建立影響力，我不介意在私人行程中隨時中斷休息處理決策。", catA: "EC", catB: "LS" },
                { id: "C-ECLS-03", text: "下班後投入心力研發可變現的個人產品，比把時間花在安排高品質的感官體驗更有吸引力。", catA: "EC", catB: "LS" },

                // [矩陣 12] 穩定 (SS) vs. 挑戰 (PC)
                { id: "C-SSPC-01", text: "我寧可留在有完整制度保障的傳統企業，也不願空降到極需處理嚴重危機的高壓新創組織。", catA: "SS", catB: "PC" },
                { id: "C-SSPC-02", text: "面對具備高度未知的關鍵任務，我寧願選擇維持穩健現狀，也不願追求那種極限博弈的快感。", catA: "SS", catB: "PC" },
                { id: "C-SSPC-03", text: "在面對市場大幅波動時，我偏好那些具備抗壓屬性、能穩定產出的既有項目。", catA: "SS", catB: "PC" },

                // [矩陣 13] 專業 (TF) vs. 挑戰 (PC)
                { id: "C-TFPC-01", text: "處理緊急狀況時，我傾向按部就班執行標準解決程序，而非享受在最後關頭憑靈光一現搶救的極限刺激。", catA: "TF", catB: "PC" },
                { id: "C-TFPC-02", text: "我寧願維護一套邏輯完美且極少出錯的作業系統，也不願接手一套需要不斷與突發狀況攻防的殘破計畫。", catA: "TF", catB: "PC" },
                { id: "C-TFPC-03", text: "專家的價值在於將危機預防於發生之前，而非成為每次災難發生時享受眾人目光的救火英雄。", catA: "TF", catB: "PC" },

                // [矩陣 14] 生活 (LS) vs. 管理 (GM)
                { id: "C-LSGM-01", text: "為了確保休假期間完全不被公務干擾，我寧願在組織內做一個獨立貢獻者，也不願承接主管職務。", catA: "LS", catB: "GM" },
                { id: "C-LSGM-02", text: "若擔任統籌主管意味著長期無法準時回家陪伴家人，我會果斷放棄在決策層展露頭角的機會。", catA: "LS", catB: "GM" },
                { id: "C-LSGM-03", text: "即使晉升能掌控更大資源，若會讓我徹底失去安靜獨處的私人時間，這種晉升就毫無意義。", catA: "LS", catB: "GM" },

                // [矩陣 15] 創業 (EC) vs. 專業 (TF)
                { id: "C-ECTF-01", text: "若我構思出一套極具價值的解決方案，我會立刻思考如何將其專利化或市場化，而非繼續鑽研細節優化。", catA: "EC", catB: "TF" },
                { id: "C-ECTF-02", text: "掌握最新知識的最大價值，在於利用它們建立新的獲利流程，而非成為該領域純粹的學術權威。", catA: "EC", catB: "TF" },
                { id: "C-ECTF-03", text: "我更願意將精力花在開發業務、建立品牌與尋求投資，並將核心執行工作交由專家處理。", catA: "EC", catB: "TF" },

                // [矩陣 16] 自主 (AU) vs. 管理 (GM)
                { id: "C-AUGM-01", text: "我寧可作為一個獨往獨來的獨立專業人員，也不願成為一個每天行程都被會議塞滿的行政主管。", catA: "AU", catB: "GM" },
                { id: "C-AUGM-02", text: "當專案遇到瓶頸時，比起召集各級部門開會，我更習慣把自己關起來獨立將問題攻克。", catA: "AU", catB: "GM" },
                { id: "C-AUGM-03", text: "如果我能對自己的工作內容擁有絕對決定權，即便我完全沒有任何下屬，我也會感到滿足。", catA: "AU", catB: "GM" },

                // [矩陣 17] 服務 (S) vs. 穩定 (SS)
                { id: "C-SSS-01", text: "若出現具備重大公益價值的專案，即使缺乏明確的晉升認列，我也願意放棄目前安穩的工作去投入。", catA: "S", catB: "SS" },
                { id: "C-SSS-02", text: "為了替團隊爭取公平權益或更好的環境，我願意得罪高層，甚至承擔失去工作的風險。", catA: "S", catB: "SS" },
                { id: "C-SSS-03", text: "一份能讓我安穩度日、下班準時的差事，如果對社會毫無實質正面幫助，那也只是缺乏靈魂的合約。", catA: "S", catB: "SS" },

                // [矩陣 18] 挑戰 (PC) vs. 創業 (EC)
                { id: "C-PCEC-01", text: "我更享受憑藉精準決策在市場波動中勝出的「純智力挑戰感」，而非將資產拿去經營具體的實體門市。", catA: "PC", catB: "EC" },
                { id: "C-PCEC-02", text: "我願意接手瀕臨破產的公司並將其扭虧為盈，純粹是為了證明我的拆彈能力，成功後我可能就會轉身離開。", catA: "PC", catB: "EC" },
                { id: "C-PCEC-03", text: "核心動力是「戰勝強敵」與「解決死結」，至於計畫是否最終由我擁權或掛名則是次要的。", catA: "PC", catB: "EC" },

                // [矩陣 19] 穩定 (SS) vs. 自主 (AU)
                { id: "C-SSAU-01", text: "為了轉職到可以讓我自由安排生活節奏的遠距團隊，我願意放棄在傳統產業累積多年的優渥退休福利。", catA: "SS", catB: "AU" },
                { id: "C-SSAU-02", text: "我更傾向待在薪酬體系明確且抗風險的大公司，而非選擇模式完全自主但隨時可能斷糧的新創團隊。", catA: "SS", catB: "AU" },
                { id: "C-SSAU-03", text: "若組織強制要求所有人員回到固定地點辦公以換取不被裁員，我也會因為失去靈活性而選擇離開。", catA: "SS", catB: "AU" },

                // [矩陣 20] 管理 (GM) vs. 創業 (EC)
                { id: "C-GMEC-01", text: "我更享受調動組織跨國資源的指揮權威感，而不是將這些經驗拿去成立自己的小型微創事業。", catA: "GM", catB: "EC" },
                { id: "C-GMEC-02", text: "推動全公司大規模轉型成功的成就感，遠大於我自己創立一個品牌並將其商業變現。", catA: "GM", catB: "EC" },
                { id: "C-GMEC-03", text: "終極職涯目標是成為大型集團的營運負責人，而非成為由我獨資擁有的微型公司老闆。", catA: "GM", catB: "EC" },

                // [矩陣 21] 專業 (TF) vs. 服務 (S)
                { id: "C-TFS-01", text: "面對專業需求，我傾向研究如何用最嚴謹的方法來實現，而非親自去安撫並協助不熟悉流程的同事。", catA: "TF", catB: "S" },
                { id: "C-TFS-02", text: "面對核心邏輯的錯誤，我堅持徹底翻修，即便這會大幅延誤第一線處理客戶抱怨的時間。", catA: "TF", catB: "S" },
                { id: "C-TFS-03", text: "如果我的優化工具減少了作業時間，我的成就感來自「解決了複雜難題」，而非「改善了同事的工作負擔」。", catA: "TF", catB: "S" },

                // [矩陣 22] 生活 (LS) vs. 穩定 (SS)
                { id: "C-LSSS-01", text: "為了換取完全自主的長途旅行假期，我願意選擇薪水較低但保證不加班的工作，而非穩定隨時待命的高薪職務。", catA: "LS", catB: "SS" },
                { id: "C-LSSS-02", text: "我絕不會為了一份穩定高薪與退休保證，去接受一個會嚴重剝奪我陪伴家人時光的外派或出差職位。", catA: "LS", catB: "SS" },
                { id: "C-LSSS-03", text: "能在工作之餘保有精力經營個人社群或興趣，比在組織內謹小慎微地維持關係以保住職位更重要。", catA: "LS", catB: "SS" },

                // [矩陣 23] 自主 (AU) vs. 挑戰 (PC)
                { id: "C-AUPC-01", text: "我寧願選擇自由但步調平緩的常規工作，也不願加入一個執行極限任務但必須絕對服從指令的高壓團隊。", catA: "AU", catB: "PC" },
                { id: "C-AUPC-02", text: "若解決難題的前提是我必須密集進辦公室並接受頻繁進度審查，我會立刻失去解決該問題的興致。", catA: "AU", catB: "PC" },
                { id: "C-AUPC-03", text: "我職場上最渴望的是「沒有人能隨意干涉我的執行節奏」，而非不斷尋找更強大的對手來廝殺。", catA: "AU", catB: "PC" },

                // [矩陣 24] 創業 (EC) vs. 自主 (AU)
                { id: "C-ECAU-01", text: "為了經營事業能成功擴張規模，我願意每天應付各種繁瑣行政與外部談判，即便這會剝奪我的絕對自由。", catA: "EC", catB: "AU" },
                { id: "C-ECAU-02", text: "我承擔風險開創新事業是為了建立能持續獲利並具名聲的商業版圖，而非為了逃避管理制度。", catA: "EC", catB: "AU" },
                { id: "C-ECAU-03", text: "比起做個自由自在的個人顧問，我更渴望承擔風險成立團隊，即便這會讓我被職責緊緊綁住。", catA: "EC", catB: "AU" },

                // [矩陣 25] 穩定 (SS) vs. 專業 (TF)
                { id: "C-SSTF-01", text: "為了避免營運上的任何中斷，我寧可放棄嘗試最前衛的解決方案，建議維持目前的穩健模式。", catA: "SS", catB: "TF" },
                { id: "C-SSTF-02", text: "進行核心架構轉換時，比起使用高效但未經驗證的新工具，我更傾向使用緩慢但保證不出錯的標準化手法。", catA: "SS", catB: "TF" },
                { id: "C-SSTF-03", text: "職業的最高價值在於「提供組織絕對的安全感」，而非作為讓我實驗新穎專業理論的遊樂場。", catA: "SS", catB: "TF" },

                // [矩陣 26] 服務 (S) vs. 自主 (AU)
                { id: "C-SAU-01", text: "如果一個利他專案需要我每天駐點並嚴格配合群眾作息，我會欣然接受並放棄高度自由的工作狀態。", catA: "S", catB: "AU" },
                { id: "C-SAU-02", text: "我願意為了幫助陷入嚴重職涯瓶頸或心理困境的同事，而暫時放下我對「作業不受干擾」的堅持。", catA: "S", catB: "AU" },
                { id: "C-SAU-03", text: "當發現政策損害大多數基層成員利益時，我會主動帶頭倡議，即便這會讓我失去「自由做事」的特權。", catA: "S", catB: "AU" },

                // [矩陣 27] 挑戰 (PC) vs. 管理 (GM)
                { id: "C-PCGM-01", text: "我更享受憑藉一己之力在極限壓力下扭轉危機的刺激感，而非坐在辦公室裡指揮戰略與協調利益。", catA: "PC", catB: "GM" },
                { id: "C-PCGM-02", text: "當組織面臨存亡關鍵時，我渴望成為站在第一線進行攻防戰的部隊，而非幕後協調整體運作的總指揮。", catA: "PC", catB: "GM" },
                { id: "C-PCGM-03", text: "我寧願接手一個爛攤子來證明我反敗為勝的能力，也不願安穩地接班一個資源充足的大型部門職位。", catA: "PC", catB: "GM" },

                // [矩陣 28] 生活 (LS) vs. 創業 (EC)
                { id: "C-LSEC-01", text: "如果擴大副業版圖意味著未來數年無法享受長途旅行或發展個人愛好，我會果斷放棄擴張，維持目前狀態。", catA: "LS", catB: "EC" },
                { id: "C-LSEC-02", text: "我絕不會為了將研發的產品推向市場，而將原先用來確保家人生活品質的緊急預備金全數投入。", catA: "LS", catB: "EC" },
                { id: "C-LSEC-03", text: "一份能穩定產出現金流、且絕對不佔用任何私人時間的資產組合，比可能成為獨角獸的新事業更具吸引力。", catA: "LS", catB: "EC" },
				
				// [矩陣 29] 服務 (S) vs. 專業 (TF)
                { id: "C-STF-01", text: "當作業系統頻繁出現不影響產出但令人困惑的小錯誤時，我會優先花時間製作教學文件安撫並幫助同仁理解，而不是鑽研下一個更深奧的核心架構。", catA: "S", catB: "TF" },
                { id: "C-STF-02", text: "看到非專業部門的同事因為操作不順而感到嚴重挫折時，我寧願暫停手邊複雜的專案，花整個下午耐心指導對方，這比我獨自完成任務更有成就感。", catA: "S", catB: "TF" },
                { id: "C-STF-03", text: "在經營事業時，如果客戶反映流程不好用，我會優先考量使用者的數位落差，尋找最具人情味的處理方式，而不是導入一套架構頂尖但缺乏溫度的自動化系統。", catA: "S", catB: "TF" },

                // [矩陣 30] 管理 (GM) vs. 穩定 (SS)
                { id: "C-GMSS-01", text: "雖然我在目前職位已經擁有十多年的資歷與絕對安穩，但只要組織願意將具備重大影響力的轉型計畫交給我統籌，我願意簽下「若失敗就負責離職」的高風險承諾。", catA: "GM", catB: "SS" },
                { id: "C-GMSS-02", text: "若能讓我擔任跨區域的業務統籌負責人，我完全不在乎這會讓我失去目前在總部享有的穩定工時與優渥的固定福利提撥。", catA: "GM", catB: "SS" },
                { id: "C-GMSS-03", text: "為了展現高階管理的決斷力與預算控制力，我敢於大刀闊斧地精簡重疊的部門編制，即使這會打破組織內部長期的和諧與穩定感。", catA: "GM", catB: "SS" },

                // [矩陣 31] 創業 (EC) vs. 挑戰 (PC)
                { id: "C-ECPC-01", text: "若我成功開發出一套具備複雜邏輯的新型作業模式，我接下來最大的渴望是將其品牌化或尋求商業變現，而不是繼續挑戰將其移植到更嚴苛的極限環境中。", catA: "EC", catB: "PC" },
                { id: "C-ECPC-02", text: "面對競爭激烈的市場，我設立的目標是建立一套能快速複製、獲利的商業模式，而不是把這裡當成挑戰研發「業界工法最複雜產品」的個人競技場。", catA: "EC", catB: "PC" },
                { id: "C-ECPC-03", text: "當外部環境震盪時，比起享受在極限波動中精準決策的對決快感，我更在乎這筆資源能否成為我下一次開展事業的啟動資本。", catA: "EC", catB: "PC" },

                // [矩陣 32] 生活 (LS) vs. 自主 (AU)
                { id: "C-LSAU-01", text: "為了確保每個週末都能專心享受個人生活，我寧願接受一份主管會嚴格干涉我工作方法但「保證準時下班」的內勤，也不願選擇一份「自由但無固定下班時間」的顧問職。", catA: "LS", catB: "AU" },
                { id: "C-LSAU-02", text: "在度假期間，只要能讓我徹底斷網放鬆，我不介意組織要求我使用僵化的行政系統與死板的流程，而不是讓我自由發揮。", catA: "LS", catB: "AU" },
                { id: "C-LSAU-03", text: "下班後的寧靜時光對我來說神聖不可侵犯；為此，我願意忍受白天在辦公室裡必須完全聽命於上級的指令，不做多餘的個人爭執。", catA: "LS", catB: "AU" },

                // [矩陣 33] 穩定 (SS) vs. 服務 (S)
                { id: "C-SSS2-01", text: "當核心系統出現異常時，為了保住我個人的考核與安穩，我會嚴格遵守「非我管轄絕不介入」的原則，即使我知道別的部門同仁正為此焦頭爛額。", catA: "SS", catB: "S" },
                { id: "C-SSS2-02", text: "面對組織即將裁撤老員工以維持穩定的決策，為了確保我自己的部門預算與職位不受波及，我會選擇保持沉默，即使這違反了我照顧同僚的初衷。", catA: "SS", catB: "S" },
                { id: "C-SSS2-03", text: "在參與年度評等或決策時，我會將「不破壞既有體制」放在第一位，即使我知道某些真正有貢獻但被邊緣化的同仁應該獲得更高的評價。", catA: "SS", catB: "S" },

                // [矩陣 34] 挑戰 (PC) vs. 專業 (TF)
                { id: "C-PCTF-01", text: "當遇到幾乎無解的突發危機時，我最享受的是在無人看好的情況下驚險扭轉局勢的瞬間，至於這過程是否完全符合官方白皮書的專家規範，我並不在乎。", catA: "PC", catB: "TF" },
                { id: "C-PCTF-02", text: "比起坐在辦公室裡把現有的流程梳理到極致完美，我更渴望被派到第一線，去阻擋一場前所未見、正在衝擊組織運作的重大戰役。", catA: "PC", catB: "TF" },
                { id: "C-PCTF-03", text: "如果緊急任務要求在極短時間內完成交付，我會用最暴力的手段立刻達成挑戰，而不是慢條斯理地去雕琢產出的細節參數與格式完美度。", catA: "PC", catB: "TF" },

                // [矩陣 35] 自主 (AU) vs. 服務 (S)
                { id: "C-AUS-01", text: "在處理項目時，我堅持用我個人發明、效率最高的方式來作業，即使這種方式會讓負責接手或協作的人員感到難以理解與痛苦。", catA: "AU", catB: "S" },
                { id: "C-AUS-02", text: "我極度厭惡那些打著「為了團隊和諧」旗號，強迫我改變高效作業習慣或參加無意義社交協作的組織文化。", catA: "AU", catB: "S" },
                { id: "C-AUS-03", text: "在推動計畫時，我寧可獨自扛下所有壓力並用自己的極快節奏完成，也不願放慢腳步去照顧那些進度落後、需要大量情感支持的成員。", catA: "AU", catB: "S" },

                // [矩陣 36] 專業 (TF) vs. 穩定 (SS)
                { id: "C-TFSS-01", text: "只要組織允許我將最前衛的解決方案整合到核心流程中，我願意承擔這項新技術可能導致的不穩定、甚至讓我個人績效背鍋的風險。", catA: "TF", catB: "SS" },
                { id: "C-TFSS-02", text: "為了徹底掌握並推行一套效能更強大但冷門的運作架構，我願意放棄目前在主流環境累積多年的權威地位與安穩評價。", catA: "TF", catB: "SS" },
                { id: "C-TFSS-03", text: "如果留在老字號公司意味著我只能維護舊有模式而無法接觸最頂尖的領域技術，即使這家公司保證永不裁員，我也會主動尋找外部機會。", catA: "TF", catB: "SS" },

                // [矩陣 37] 服務 (S) vs. 管理 (GM)
                { id: "C-SGM-01", text: "參與重大專案時，我更希望利用這個專案去發掘並記錄基層人員的貢獻故事，而不是將其視為一個向各部門展現我統籌權力的舞台。", catA: "S", catB: "GM" },
                { id: "C-SGM-02", text: "當我推動成立內部的健康互助社團時，我唯一的目的是看到同事變快樂；我非常反感管理層試圖將這個社團轉化為展現公司績效的公關工具。", catA: "S", catB: "GM" },
                { id: "C-SGM-03", text: "在進行資源分配時，我寧願稍微犧牲自己部門的帳面數據，也要確保那些家境困難或處於弱勢的同仁能保有工作。", catA: "S", catB: "GM" },

                // [矩陣 38] 創業 (EC) vs. 服務 (S)
                { id: "C-ECS-01", text: "如果經營的事業面臨利潤微薄的困境，為了確保商業模式能存活，我會果斷停止服務那些經常延遲付款的清寒客戶，在商言商。", catA: "EC", catB: "S" },
                { id: "C-ECS-02", text: "當我發現一個極具獲利潛力的商業缺口時，即使這個項目可能會對部分群體的利益造成輕微損害，我也會優先考慮將其推向市場。", catA: "EC", catB: "S" },
                { id: "C-ECS-03", text: "如果我開發了一套能精準預測市場趨勢的分析工具，我會選擇成立收費昂貴的諮詢公司來最大化我的財富，而不是將其無償提供給大眾使用。", catA: "EC", catB: "S" },

                // [矩陣 39] 專業 (TF) vs. 生活 (LS)
                { id: "C-TFLS-01", text: "為了徹底搞懂一項最新的專業協定或底層運作機制，我願意連續幾個週末不出門，甚至犧牲原本安排好的休閒與娛樂時間。", catA: "TF", catB: "LS" },
                { id: "C-TFLS-02", text: "面對一個罕見的業務報錯，我會產生強烈的究極感，寧可熬夜查閱國外論壇與文獻到天亮，也不願按時下班把問題丟給隔天的接班人。", catA: "TF", catB: "LS" },
                { id: "C-TFLS-03", text: "如果能讓我參與一項業界最前沿的基礎建設升級計畫，我完全不介意它會大幅壓縮我陪伴家人與長途旅行的時間。", catA: "TF", catB: "LS" },

                // [矩陣 40] 管理 (GM) vs. 挑戰 (PC)
                { id: "C-GMPC-01", text: "比起親上前線廝殺、享受極限逆轉勝的刺激，我更喜歡待在總部，冷靜地指揮跨國部門的資源調度與長期戰略規劃。", catA: "GM", catB: "PC" },
                { id: "C-GMPC-02", text: "當組織面臨危機時，我認為最有價值的是「建立一套不再發生危機的制度」，而不是享受那種在混亂中成為救火英雄的快感。", catA: "GM", catB: "PC" },
                { id: "C-GMPC-03", text: "我期望的職涯頂點是掌管龐大且運作平穩的企業帝國，而不是不斷尋找高難度的爛攤子公司來證明我的反轉能力。", catA: "GM", catB: "PC" },

                // [矩陣 41] 自主 (AU) vs. 創業 (EC)
                { id: "C-AUEC-01", text: "我寧可永遠做個只對自己產出負責的獨立接案者，也不願成立公司、扛起發放員工薪水與繳納稅務的企業主責任。", catA: "AU", catB: "EC" },
                { id: "C-AUEC-02", text: "對我來說，「隨時隨地能工作」的絕對自由，遠比承擔風險去打造一個具備高變現能力的連鎖品牌更具吸引力。", catA: "AU", catB: "EC" },
                { id: "C-AUEC-03", text: "即使我手上有極具市場潛力的產品原型，只要想到創業必須不斷受制於股東與投資人的報告壓力，我就會打消念頭。", catA: "AU", catB: "EC" },

                // [矩陣 42] 穩定 (SS) vs. 創業 (EC)
                { id: "C-SSEC-01", text: "即使我有極好的創業點子與早期資金，我也會因為捨不得目前在成熟企業累積多年的年資與穩定分紅，而選擇按兵不動。", catA: "SS", catB: "EC" },
                { id: "C-SSEC-02", text: "在進行投資與職涯選擇時，我堅守「保本與穩定現金流」的原則，絕不輕易將大筆資金或職涯黃金期投入高風險的新創事業。", catA: "SS", catB: "EC" },
                { id: "C-SSEC-03", text: "對我而言，一份月薪固定但保證能讓我安穩退休的行政職缺，勝過一個號稱未來能讓我獲得千萬股權分紅的創辦人機會。", catA: "SS", catB: "EC" },

                // [矩陣 43] 服務 (S) vs. 生活 (LS)
                { id: "C-SLS-01", text: "如果一位新進同仁遇到嚴重的適應困難，我願意犧牲自己下班後寶貴的放鬆時間，留下來傾聽並給予他全力的支持。", catA: "S", catB: "LS" },
                { id: "C-SLS-02", text: "當參與一項能實質改善社會弱勢的專案時，即使需要我在原本規劃好的假日頻繁出勤，我也甘之如飴。", catA: "S", catB: "LS" },
                { id: "C-SLS-03", text: "我認為將業餘時間奉獻給內部的互助社團，比獨自待在家裡享受視聽設備更有意義。", catA: "S", catB: "LS" },

                // [矩陣 44] 挑戰 (PC) vs. 穩定 (SS)
                { id: "C-PCSS-01", text: "我會主動爭取接手那個風險極高、大家都認為會失敗的爛攤子，而不是安穩地待在業績穩定的舒適圈部門。", catA: "PC", catB: "SS" },
                { id: "C-PCSS-02", text: "只要能讓我與業界最強的對手進行商業上的極限對決，我願意放棄目前組織承諾的終身雇用制與退休福利。", catA: "PC", catB: "SS" },
                { id: "C-PCSS-03", text: "穩定且一眼望到頭的職涯會讓我感到窒息；我寧可在劇烈震盪的市場中尋求突圍，也不願安逸度日。", catA: "PC", catB: "SS" },

                // [矩陣 45] 生活 (LS) vs. 服務 (S)
                { id: "C-LSS-01", text: "在休假期間，我會徹底關閉通訊軟體享受旅程，即使我知道某個重要的公益專案或同事正急需我的遠端協助。", catA: "LS", catB: "S" },
                { id: "C-LSS-02", text: "我會婉拒擔任組織內部的心理輔導員或導師角色，因為我需要把精力保留給下班後的家庭生活與個人嗜好。", catA: "LS", catB: "S" },
                { id: "C-LSS-03", text: "即使一份工作充滿了崇高的助人理念，但只要它會長期剝奪我準時與家人聚餐的權利，我就絕對不會考慮。", catA: "LS", catB: "S" },

                // [矩陣 46] 自主 (AU) vs. 專業 (TF)
                { id: "C-AUTF-01", text: "我堅持用自己獨創的方式來架設作業環境或撰寫處理流程，即便這被專家指出「不符合標準指引的最佳實踐」。", catA: "AU", catB: "TF" },
                { id: "C-AUTF-02", text: "當面對一個強制要求成員遵循極度嚴格規範與繁瑣審查流程的系統時，我會為了爭取個人作業的隨性與自由而選擇離開。", catA: "AU", catB: "TF" },
                { id: "C-AUTF-03", text: "我認為「用我喜歡的方式把任務解掉」比「使用業界公認最深奧、最權威的作業框架來解決」更為重要。", catA: "AU", catB: "TF" },

                // [矩陣 47] 創業 (EC) vs. 管理 (GM)
                { id: "C-ECGM-01", text: "我寧可擁有一家規模極小但 100% 屬於我的事業（如工作室），也不願在千人規模的大型組織中擔任高階經理人。", catA: "EC", catB: "GM" },
                { id: "C-ECGM-02", text: "對我而言，將個人的想法變成一個能存活的獨立品牌，其成就感遠大於優化一個已經存在數十年的龐大企業體制。", catA: "EC", catB: "GM" },
                { id: "C-ECGM-03", text: "當手頭有大筆預算時，我更希望能拿這筆錢去成立一家脫離母公司控制的全新公司，而不是重整既有部門的人事結構。", catA: "EC", catB: "GM" },

                // [矩陣 48] 服務 (S) vs. 創業 (EC)
                { id: "C-SEC-01", text: "若我研發出一套極具價值的自動化工具，我傾向無償公開讓所有基層同仁受惠，而不是將其品牌化去變現。", catA: "S", catB: "EC" },
                { id: "C-SEC-02", text: "在經營事業時，我會為了維持對鄰里與弱勢客群的人情味而拒絕調漲售價，即便這會阻礙我的擴張計畫。", catA: "S", catB: "EC" },
                { id: "C-SEC-03", text: "我認為企業存在的最高價值是回饋社會，如果創業只為了追求個人財富的指數成長，那是非常自私的。", catA: "S", catB: "EC" },

                // [矩陣 49] 管理 (GM) vs. 生活 (LS)
                { id: "C-GMLS-01", text: "為了成功推動跨區域的長期轉型專案，我願意在未來一年內犧牲大部分的週末休假與私人時間來主持會議與決策。", catA: "GM", catB: "LS" },
                { id: "C-GMLS-02", text: "當我有機會晉升為掌控全局的高階主管時，即使這意味著我將永遠告別平靜的休閒嗜好，我也會欣然接受。", catA: "GM", catB: "LS" },
                { id: "C-GMLS-03", text: "我渴望獲得能支配預算與人事的決策權力，為此我完全可以忍受在原本規劃好的長假中，每天花數小時處理公務。", catA: "GM", catB: "LS" },

                // [矩陣 50] 自主 (AU) vs. 生活 (LS)
                { id: "C-AULS-01", text: "我寧可選擇一份沒有固定時間、需要隨時解決問題的遠距工作，也不願為了「準時下班」而忍受主管每天的進度盯梢。", catA: "AU", catB: "LS" },
                { id: "C-AULS-02", text: "為了維持我對事業內容的絕對掌控權，我完全可以接受這份事業嚴重侵犯到我與親友的日常相處時間。", catA: "AU", catB: "LS" },
                { id: "C-AULS-03", text: "對我而言，不受任何組織規章束縛的自由感，比確保每週都有完整的假期能享受個人娛樂來得更重要。", catA: "AU", catB: "LS" },

                // [矩陣 51] 挑戰 (PC) vs. 自主 (AU)
                { id: "C-PCAU-01", text: "為了參與解決一個業界公認極度困難的企業重構案，我願意服從總部極度僵化的體制，放棄我一貫獨行俠的風格。", catA: "PC", catB: "AU" },
                { id: "C-PCAU-02", text: "當面對一個失敗率極高的極限任務時，我寧願接受密集監控與嚴格的規範，也要搶下這個能讓我證明實力的機會。", catA: "PC", catB: "AU" },
                { id: "C-PCAU-03", text: "擊敗強大競爭對手帶來的快感，足以讓我忍受每天必須穿著正裝、遵循死板行政規章的痛苦。", catA: "PC", catB: "AU" },

                // [矩陣 52] 穩定 (SS) vs. 生活 (LS)
                { id: "C-SSLS-01", text: "為了確保我在組織累積多年的年資與保障絕對不會中斷，我願意配合常態性的週末加班與臨時出勤要求。", catA: "SS", catB: "LS" },
                { id: "C-SSLS-02", text: "只要能保證未來二十年的職涯安全與極高的薪資下限，我願意長期放棄在既有居住地經營的生活圈與休閒愛好。", catA: "SS", catB: "LS" },
                { id: "C-SSLS-03", text: "我願意把原本用來投資私人興趣的時間，全數轉為準備最保守、但能保住飯碗的內部常規考試，以換取對未來的安全感。", catA: "SS", catB: "LS" },

                // [矩陣 53] 專業 (TF) vs. 創業 (EC)
                { id: "C-TFEC-01", text: "當我成功開發出一套創新的技術模組時，我寧願留在實驗室裡持續優化核心邏輯，也不想花心思去寫企劃書找投資。", catA: "TF", catB: "EC" },
                { id: "C-TFEC-02", text: "若要在「成為該領域全球公認的技術權威」與「創辦一家獲利豐厚但沒有核心能力的代理商」之間選擇，我會選擇前者。", catA: "TF", catB: "EC" },
                { id: "C-TFEC-03", text: "對我來說，深入鑽研系統核心架構所帶來的智力滿足感，遠比利用這些知識去市場上賺取第一桶金來得重要。", catA: "TF", catB: "EC" },

                // [矩陣 54] 服務 (S) vs. 挑戰 (PC)
                { id: "C-SPC-01", text: "在帶領團隊度過危機時，如果為了達成目標必須犧牲同仁的身心健康，我會選擇放棄挑戰以保護我的成員。", catA: "S", catB: "PC" },
                { id: "C-SPC-02", text: "相比於在商場上透過價格戰擊垮對手，我更傾向花同樣的精力去建立一個能幫助組織內部弱勢同仁的互助平台。", catA: "S", catB: "PC" },
                { id: "C-SPC-03", text: "當發現一個能打破壟斷、具挑戰性的商機時，若這個行動會導致大量基層從業人員失業，我會拒絕執行這項挑戰。", catA: "S", catB: "PC" },

                // [矩陣 55] 創業 (EC) vs. 專業 (TF)
                { id: "C-ECTF-01", text: "當我發現一個能利用最新 AI 方案大幅降低成本的機會時，我會優先思考如何將其產品化，而不是沉迷於研究底層運算邏輯。", catA: "EC", catB: "TF" },
                { id: "C-ECTF-02", text: "為了讓事業順利擴張，我願意完全放棄親自執行實務細節，將技術工作外包，好讓我專心負責商業營運。", catA: "EC", catB: "TF" },
                { id: "C-ECTF-03", text: "在我看來專業只是工具；如果從事一般貿易比研發高科技更能快速建立商業版圖，我會立刻捨棄原有身分轉行。", catA: "EC", catB: "TF" },

                // [矩陣 56] 自主 (AU) vs. 管理 (GM)
                { id: "C-AUGM-01", text: "我寧可作為一個沒有實權但不受干涉的顧問，也不願成為一個必須在各部門之間進行政治妥協的高階營運官。", catA: "AU", catB: "GM" },
                { id: "C-AUGM-02", text: "如果晉升意味著我必須嚴格遵守組織的社交應酬文化與僵化的發言規範，我會果斷拒絕這個能登上權力頂峰的機會。", catA: "AU", catB: "GM" },
                { id: "C-AUGM-03", text: "相比於帶領百人團隊達成商業目標，我更享受一個人待在不受打擾的空間裡，用自己不願妥協的節奏完成專案。", catA: "AU", catB: "GM" }
            ]
        };

        function App() {
            const [step, setStep] = useState("welcome");
            const [qIndex, setQIndex] = useState(1);
            const [theta, setTheta] = useState({ TF: 0, GM: 0, AU: 0, SS: 0, EC: 0, S: 0, PC: 0, LS: 0 });
            
            const [tIo, setTIo] = useState(0);
            const [muT, setMuT] = useState(0);
            const [sigmaT, setSigmaT] = useState(0.1);
            const [history, setHistory] = useState([]);
            const [entangledPairs, setEntangledPairs] = useState([]);
            const [currentQ, setCurrentQ] = useState(null);
            
            // --- 新增：複製結果的狀態與函數 ---
            const [copySuccess, setCopySuccess] = useState(false);

            const handleCopyResults = () => {
                // 1. 將 Theta 分數轉換為正數基準 (對齊雷達圖的底層邏輯 v + 5)
                const shiftedScores = Object.entries(theta).map(([k, v]) => ({
                    key: k,
                    name: ANCHORS[k].name,
                    score: Math.max(0, v + 5) // 確保沒有負數，才能計算百分比
                }));

                // 2. 計算全維度總分，作為分母
                const totalScore = shiftedScores.reduce((sum, item) => sum + item.score, 0);

                // 3. 轉換為百分比，並組裝成 Gem 看得懂的格式 (包含自動觸發指令)
                const textToCopy = "您好，這是我剛完成的職涯錨定診斷數據（總和100%），請以此為基礎進行分析：\n\n" + 
                    shiftedScores.sort((a, b) => b.score - a.score).map(item => {
                        const percentage = totalScore > 0 ? ((item.score / totalScore) * 100).toFixed(1) : 0;
                        return `- ${item.name}： ${percentage}%`;
                    }).join('\n');
                
                // 寫入剪貼簿
                navigator.clipboard.writeText(textToCopy).then(() => {
                    setCopySuccess(true);
                    setTimeout(() => setCopySuccess(false), 2500);
                }).catch(err => {
                    alert("瀏覽器不支援自動複製，請手動選取文字複製！");
                });
            };
            // ---------------------------------
            
			const startTimeRef = useRef(0);
            const p2OrderRef = useRef(["TF", "GM", "AU", "SS", "EC", "S", "PC", "LS"].sort(() => Math.random() - 0.5));
            // --- 新增：Phase 1 校準題洗牌陣列 ---
            const calibOrderRef = useRef([...QB.phase1].sort(() => Math.random() - 0.5));
            // -----------------------------------
            const usedMatricesRef = useRef(new Set());
			const [rerollTrigger, setRerollTrigger] = useState(0);
			
            useEffect(() => {
					if (step === "testing") {
                    let nextQ;
                    if (qIndex === 1) {
                        nextQ = calibOrderRef.current[0]; // 拿洗牌後的第一題 
                    } else if (qIndex === 2) {
                        nextQ = calibOrderRef.current[1]; // 拿洗牌後的第二題 (保證不重複)
                    } else if (qIndex <= 10) {
                        const cat = p2OrderRef.current[qIndex - 3]; 
                        nextQ = QB.phase2[cat][Math.floor(Math.random() * 8)];
                        nextQ.type = "normal";
                        nextQ.cat = cat;
                    } else {
                        const sorted = Object.entries(theta).sort((a, b) => b[1] - a[1]);
                        const t1 = sorted[0][0]; const t2 = sorted[1][0];
                        
                        if (entangledPairs.length > 0) {
                            // 觸發糾纏狀態：針對糾纏的兩個維度進行深度拆解
                            const e1 = entangledPairs[0];
                            const e2 = entangledPairs[1];
                            
                            // 優先尋找這兩個糾纏維度的「衝突矩陣題」
                            nextQ = QB.matrices.find(m => 
                                ((m.catA === e1 && m.catB === e2) || (m.catA === e2 && m.catB === e1)) && !usedMatricesRef.current.has(m.id)
                            );
                            
                            if (nextQ) {
                                usedMatricesRef.current.add(nextQ.id);
                                nextQ.type = "matrix";
                            } else {
                                // 若矩陣題耗盡的防呆降級：在兩個糾纏維度中隨機選一個出常規題
                                const targetCat = Math.random() > 0.5 ? e1 : e2;
                                nextQ = QB.phase2[targetCat][Math.floor(Math.random() * 8)];
                                nextQ.type = "normal";
                                nextQ.cat = targetCat;
                            }
                        } else {
                            // 正常狀態：針對 Top 1 與 Top 2 尋找矩陣題
                            nextQ = QB.matrices.find(m => 
                                ((m.catA === t1 && m.catB === t2) || (m.catA === t2 && m.catB === t1)) && !usedMatricesRef.current.has(m.id)
                            );
                            if (nextQ) {
                                usedMatricesRef.current.add(nextQ.id);
                                nextQ.type = "matrix";
                            } else {
                                nextQ = QB.phase2[t1][Math.floor(Math.random() * 8)];
                                nextQ.type = "normal";
                                nextQ.cat = t1;
                            }
                        }
                    }
                    setCurrentQ(nextQ);
                    startTimeRef.current = Date.now();
                }
            }, [qIndex, step, theta, entangledPairs, rerollTrigger]); // 加入 rerollTrigger

            const handleAnswer = (score) => {
                const timeCost = (Date.now() - startTimeRef.current) / 1000;
				
				// --- 新增：Phase 1 校準題防呆驗證 ---
                if (qIndex <= 2) {
                    if (score !== currentQ.expected) {
                        alert(`【系統校準失敗】\n您點選了 ${score} 分，但題目指示為 ${currentQ.expected} 分。\n\n請精準依照文字指示作答，以確保測驗時間基準的準確性。`);
                        startTimeRef.current = Date.now(); // 關鍵：重置計時器，確保下一次點擊是純淨的反應時間
                        return; // 中斷，要求受測者重新點擊正確選項
                    }
                }
                // ----------------------------------
				
				// --- 新增：隱性異常偵測與超時作廢機制 ---
				// 若在正規測驗階段 (大於第2題)，且作答時間超過 20 秒 (可依實務調整)
				if (qIndex > 2 && timeCost > 20.0) {
					alert("系統偵測到您的作答可能受到外部中斷。為確保診斷數據的準確性，本題作答無效。系統將為您更換全新情境題，請保持專注繼續作答。");
					setRerollTrigger(prev => prev + 1); // 觸發重新抽題
					return; // 強制中斷後續的 Theta 計算與存檔
				}
				// ----------------------------------------
				
                let nextTheta = { ...theta };
                let currentTe = timeCost;

                if (qIndex <= 2) {
                    if (qIndex === 2) {
                        const prevTimeCost = history.length > 0 ? history[0].timeCost : timeCost;
                        setTIo((prevTimeCost + timeCost) / 2);
                    }
                } else {
                    currentTe = Math.max(0.1, timeCost - tIo); 
                    
                    if (qIndex <= 10) {
                        const sNorm = (score - 3.5) / 2.5;
                        nextTheta[currentQ.cat] += (1.0 * sNorm * 1.0);
                        
                        if (qIndex === 10) {
                            const p2Te = [...history.filter(h => h.id > 2).map(h => h.Te), currentTe];
                            const mean = p2Te.reduce((a, b) => a + b, 0) / 8;
                            const std = Math.sqrt(p2Te.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / 8) || 0.1;
                            setMuT(mean); setSigmaT(std);
                        }
                    } else {
                        const Z = (currentTe - muT) / sigmaT;
                        let W_rt = 1.0;
                        if (Z < -0.5) W_rt = Math.min(1.5, 1 + 0.2 * Math.abs(Z));
                        else if (Z > 0.5) W_rt = Math.max(0.2, 1 - 0.3 * Z);
                        
                        const sNorm = (score - 3.5) / 2.5;
                        
                        if (currentQ.type === "matrix") {
                            if ((score === 3 || score === 4) && Z > 1.0) {
                                if (!entangledPairs.includes(currentQ.catA)) setEntangledPairs(prev => [...prev, currentQ.catA, currentQ.catB]);
                            } else {
                                nextTheta[currentQ.catA] += (1.5 * sNorm * W_rt);
                                nextTheta[currentQ.catB] -= (1.5 * sNorm * W_rt);
                            }
                        } else {
                            nextTheta[currentQ.cat] += (1.0 * sNorm * W_rt);
                        }
                    }
                }

                setHistory([...history, { id: qIndex, qId: currentQ.id, timeCost: timeCost, Te: currentTe, score }]);
                setTheta(nextTheta);

                const sorted = Object.entries(nextTheta).sort((a, b) => b[1] - a[1]);
                let shouldEnd = false;
                
                if (qIndex >= 16 && qIndex < 24) {
                    if (entangledPairs.length === 0) {
                        const gap1 = sorted[0][1] - sorted[1][1];
                        const gap2 = sorted[1][1] - sorted[2][1];
                        const gap3 = sorted[2][1] - sorted[3][1];
                        if (gap1 >= 1.2 && gap2 >= 1.0 && gap3 >= 1.0) shouldEnd = true;
                        
                        if (gap3 < 0.8 && entangledPairs.length === 0) {
                            setEntangledPairs([sorted[2][0], sorted[3][0]]);
                        }
                    }
                }

                if (shouldEnd || qIndex >= 24) {
                    setStep("results");
                } else {
                    setQIndex(qIndex + 1);
                }
            };

            const restart = () => {
				// 若有使用 confirm 確認視窗，可在此處或按鈕上實作
                setStep("welcome"); 
                setQIndex(1); 
                setHistory([]); 
                setEntangledPairs([]);
                setTheta({ TF: 0, GM: 0, AU: 0, SS: 0, EC: 0, S: 0, PC: 0, LS: 0 });
                usedMatricesRef.current.clear();
                
				// --- 新增：重新洗牌校準題庫 ---
                calibOrderRef.current = [...QB.phase1].sort(() => Math.random() - 0.5);
				
                // 清空動態運算的基準變數
                setTIo(0);
                setMuT(0);
                setSigmaT(0.1);
            };

			if (!currentQ && step === "testing") return <div className="p-10 text-center">載入引擎中 Loading Engine...</div>;

            const sortedResults = Object.entries(theta).sort((a, b) => b[1] - a[1]);
            const radarData = Object.entries(theta).map(([k, v]) => ({ subject: ANCHORS[k].name, A: v + 5 }));

            // --- 新增：預先計算要顯示的核心數量 (避開 JSX 渲染陷阱) ---
            let displayCount = 3;
            if (sortedResults.length > 3 && sortedResults[2][1].toFixed(2) === sortedResults[3][1].toFixed(2)) {
                displayCount = 4;
            }
            const topAnchors = sortedResults.slice(0, displayCount);
            // --------------------------------------------------------

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <header className="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 w-8 h-8 rounded flex items-center justify-center text-white font-bold">A</div>
                            <div>
                                <h1 className="font-bold text-slate-800">Career Anchor CAT Engine</h1>
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">v3.2 Build</p>
                            </div>
                        </div>
                        <div className="text-right text-[10px] font-mono text-slate-400">
                            {qIndex > 10 ? `μ: ${muT.toFixed(2)}s | σ: ${sigmaT.toFixed(2)}s` : 'CALIBRATING'}
                        </div>
                    </header>

                    <main className="flex-1 overflow-auto p-6">
                        {step === "welcome" && (
                            <div className="max-w-4xl mx-auto py-20 flex flex-col items-center text-center animate-in fade-in">
                                <h2 className="text-4xl font-black text-slate-900 mb-6">職涯錨定適性診斷 v3.2</h2>
                                <p className="text-slate-500 max-w-xl mb-12">
                                    此系統完整實裝 Z-score 與四階段適性矩陣邏輯。請依據直覺作答，系統將捕捉您的隱性價值拉扯。
                                </p>
                                <button onClick={() => setStep("testing")} className="bg-slate-900 px-10 py-4 rounded-xl text-white font-bold text-lg hover:scale-105 transition-all">
                                    啟動測驗 START ENGINE
                                </button>
                            </div>
                        )}

                        {step === "testing" && currentQ && (
                            <div className="max-w-5xl mx-auto flex flex-col md:flex-row gap-6 animate-in slide-in-from-bottom-4">
                                <div className="flex-[2] bg-white rounded-2xl p-8 border shadow-sm">
										<div className="flex gap-2">
                                            <span className="bg-slate-100 px-2 py-1 rounded text-xs font-mono font-bold text-slate-500">QID: {currentQ.id}</span>
                                            <span className="text-xs font-bold text-slate-400 self-center">Prog: {qIndex}/24</span>
                                        </div>
                                        {/* 新增：主動中斷與重新測驗按鈕 (附帶防誤觸確認) */}
                                        <button 
                                            onClick={() => {
                                                if(window.confirm("確定要放棄當前的診斷進度，重新開始測驗嗎？")) {
                                                    restart();
                                                }
                                            }} 
                                            className="text-xs bg-slate-100 text-slate-500 px-3 py-1 rounded hover:bg-rose-100 hover:text-rose-600 font-bold transition-all"
                                        >
                                            ⟳ 中斷並重新測驗
                                        </button>
                                    <h2 className="text-2xl font-bold text-slate-800 mb-12 min-h-[80px]">{currentQ.text}</h2>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4">
                                        {[1, 2, 3, 4, 5, 6].map(s => (
                                            <button key={s} onClick={() => handleAnswer(s)} className="h-24 border-2 rounded-xl hover:border-indigo-600 hover:bg-indigo-50 font-black text-xl text-slate-400 hover:text-indigo-600 transition-all">
                                                {s} <div className="text-[10px] uppercase font-bold">{s <= 3 ? "不符合" : "符合"}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex-1 space-y-6">
                                    <div className={`rounded-2xl p-6 text-white transition-all ${entangledPairs.length > 0 ? 'bg-rose-900' : 'bg-slate-900'}`}>
                                        <h3 className="text-[10px] font-black uppercase tracking-widest mb-4 flex items-center gap-2">
                                            <span className={`w-2 h-2 rounded-full animate-pulse ${entangledPairs.length > 0 ? 'bg-rose-500' : 'bg-indigo-500'}`}></span>
                                            {entangledPairs.length > 0 ? 'ENTANGLEMENT DETECTED' : 'REAL-TIME THETA'}
                                        </h3>
                                        <div className="space-y-3">
                                            {sortedResults.slice(0, 4).map(([k, v]) => (
                                                <div key={k}>
													<div className="flex justify-between text-xs font-bold mb-1">
														<span className="text-slate-300 font-black tracking-widest">{k}</span>
														<span className="font-mono text-indigo-300">{v.toFixed(2)}</span>
													</div>
                                                    <div className="h-1 bg-slate-800 rounded-full overflow-hidden">
                                                        <div className="bg-indigo-500 h-full" style={{width: `${Math.max(0, (v + 5) * 10)}%`}}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === "results" && (
                            <div className="max-w-4xl mx-auto bg-white p-10 rounded-3xl shadow-sm border text-center animate-in zoom-in-95 duration-500">
                                <h2 className="text-3xl font-black mb-8">職涯錨定鑑定報告</h2>
                                
                                <div className="w-full flex justify-center mb-10">
                                    <RadarChart data={radarData} />
                                </div>
								
								{/* 顯示核心錨定 (動態 Top 3 或 Top 4) */}
                                <div className="bg-slate-50 p-6 rounded-2xl text-left space-y-6 mb-6">
                                    <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest border-b pb-2">核心職涯錨定 (Primary Anchors)</h3>
                                    {topAnchors.map(([k, v], index) => (
                                        <div key={k}>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-0.5 rounded">
                                                    Top {index + 1}
                                                </span>
                                                <h4 className="text-xl font-bold text-indigo-600">{ANCHORS[k].name}</h4>
                                            </div>
                                            <p className="text-slate-600 text-sm">{ANCHORS[k].desc}</p>
                                        </div>
                                    ))}
                                </div>
								
                                {/* 顯示八大維度完整得分與 Gemini 分析引導 */}
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 text-left space-y-4">
                                    <div className="flex justify-between items-center border-b pb-2">
                                        <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest">八大維度完整得分 (Theta Score)</h3>
                                        <button 
                                            onClick={handleCopyResults}
                                            className={`text-xs px-3 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1 shadow-sm ${copySuccess ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100'}`}
                                        >
                                            {copySuccess ? '✅ 已成功複製！' : '📋 複製分數'}
                                        </button>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pb-4">
                                        {sortedResults.map(([k, v]) => (
                                            <div key={k} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                <span className="font-bold text-slate-700">{ANCHORS[k].name}</span>
                                                <span className="font-mono font-bold text-indigo-600">{v.toFixed(2)}</span>
                                            </div>
                                        ))}
                                    </div>

                                    {/* 新增：分析角色引導區塊 */}
                                    <div className="mt-2 bg-slate-800 rounded-2xl p-6 text-white text-center space-y-4 shadow-inner">
                                        <h4 className="text-lg font-black text-amber-400 flex justify-center items-center gap-2">
                                            <span>✨</span> 獲取 AI 專屬職涯分析報告
                                        </h4>
                                        <p className="text-sm text-slate-300 max-w-md mx-auto leading-relaxed">
                                            想深入了解這些分數代表的真實意義嗎？<br/>
                                            請先點擊上方「<strong className="text-white">📋 複製分數</strong>」，然後前往我們專屬的 Gemini AI 助理，將分數貼上即可獲得深度解析與職涯建議！
                                        </p>
                                        <a 
                                            href="https://gemini.google.com/gem/15P_iNv1Jo_aqojAgcz1LlL3chFi7dSoY?usp=sharing" 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="inline-block mt-2 bg-amber-500 text-slate-900 font-black px-8 py-3 rounded-xl hover:bg-amber-400 hover:scale-105 transition-all shadow-lg"
                                        >
                                            前往 Gemini 貼上分數分析 ↗
                                        </a>
                                    </div>
                                </div>

                                <button onClick={restart} className="mt-8 px-8 py-3 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition-all hover:scale-105">
                                    RESTART DIAGNOSTIC
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
